<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Audible">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.json">
<title>Audible</title>
<style>
:root{
  --bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--bg4:#3a3a3c;--sep:rgba(84,84,88,.55);
  --label:#fff;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.32);--fill:rgba(118,118,128,.24);
  --green:#30d158;--red:#ff453a;--orange:#ff9f0a;--yellow:#ffd60a;--blue:#0a84ff;--purple:#bf5af2;--teal:#64d2ff;
  --green-t:rgba(48,209,88,.16);--red-t:rgba(255,69,58,.16);--orange-t:rgba(255,159,10,.16);--blue-t:rgba(10,132,255,.16);
  --bar:rgba(22,22,24,.86);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html[data-theme=light]{
  --bg:#f2f2f7;--bg2:#fff;--bg3:#e9e9ee;--bg4:#d1d1d6;--sep:rgba(60,60,67,.18);
  --label:#000;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.32);--fill:rgba(118,118,128,.12);
  --green:#28b14c;--red:#ff3b30;--orange:#f08c00;--yellow:#e0b400;--blue:#007aff;--purple:#af52de;--teal:#1ea7d6;
  --green-t:rgba(40,177,76,.12);--red-t:rgba(255,59,48,.12);--orange-t:rgba(240,140,0,.13);--blue-t:rgba(0,122,255,.1);
  --bar:rgba(249,249,251,.88);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);font:16px/1.32 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body{min-height:100vh;padding-bottom:calc(84px + var(--sab))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--label)}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}
.c2{color:var(--label2)}.c3{color:var(--label3)}.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}
.sm{font-size:13px}.xs{font-size:11px}
.bold{font-weight:700}

/* top bar */
.bar{position:sticky;top:0;z-index:20;padding-top:var(--sat);background:transparent;transition:background .2s}
.bar.solid{background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.bar .wrap{height:52px;display:flex;align-items:center;justify-content:space-between}
.bar .mini{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s}
.bar.solid .mini{opacity:1}
.circ{width:40px;height:40px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;box-shadow:0 0 0 .5px var(--sep)}
.circ svg{width:21px;height:21px;stroke:var(--label);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html[data-theme=light] .circ{background:var(--bg2);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar .acts{display:flex;gap:12px}
.lt{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:2px 0 0;line-height:1.1}
.sub{color:var(--label2);font-size:15px;margin:3px 0 4px;display:flex;align-items:center;gap:6px}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);padding-bottom:var(--sab)}
nav .wrap{display:flex;padding:0 4px}
nav button{flex:1;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--label3);position:relative}
nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--blue)}
.badge{position:absolute;top:2px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}

/* sections + groups */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 9px}
.sec h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em}
.sec button,.sec a{color:var(--blue);font-size:15px}
.grp{background:var(--bg2);border-radius:14px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;min-height:52px}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:62px;height:.5px;background:var(--sep)}
.cell.noimg+.cell::before,.cell.noimg::before{left:14px}
button.cell{width:100%;text-align:left}
.cell .main{flex:1;min-width:0}
.t1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.end{text-align:right;flex:none}
.chev{width:8px;height:13px;flex:none;stroke:var(--label3);fill:none;stroke-width:2.2}
.foot{text-align:center;font-size:12px;color:var(--label3);margin:16px 12px}
.empty{padding:22px 16px;text-align:center;color:var(--label2);font-size:15px}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:12px 0 4px}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:13px;font-weight:600;color:var(--label)}
.seg button.on{background:var(--bg4);box-shadow:0 2px 6px rgba(0,0,0,.18)}
html[data-theme=light] .seg button.on{background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 13px;border-radius:999px;background:var(--bg2);font-size:14px;font-weight:600;color:var(--label)}
.chip.on{background:var(--label);color:var(--bg)}
.search{display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:10px;padding:8px 10px;margin-top:12px}
.search svg{width:16px;height:16px;stroke:var(--label2);fill:none;stroke-width:2.2;flex:none}
.search input{flex:1;background:none;border:0;outline:none;font-size:16px;min-width:0}

/* avatars & headshots */
.hs{position:relative;width:38px;height:38px;border-radius:50%;background:var(--bg3);flex:none;overflow:hidden;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--label2)}
.hs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.hs.def img{inset:16%;width:68%;height:68%;object-fit:contain}
.hs.lg{width:84px;height:84px;font-size:24px}
.av{position:relative;width:44px;height:44px;border-radius:50%;background:var(--bg3);overflow:hidden;display:grid;place-items:center;font-weight:700;color:var(--label2);flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.s{width:30px;height:30px;font-size:13px}
.av.l{width:54px;height:54px;font-size:20px}

/* status pills */
.st{display:inline-block;font-size:11px;font-weight:700;padding:1px 5px;border-radius:5px;margin-left:5px;vertical-align:2px;letter-spacing:0}
.st.Q{background:var(--orange-t);color:var(--orange)}
.st.O,.st.IR,.st.D,.st.S,.st.BYE{background:var(--red-t);color:var(--red)}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.g{background:var(--green-t);color:var(--green)}.tag.b{background:var(--blue-t);color:var(--blue)}.tag.o{background:var(--orange-t);color:var(--orange)}.tag.r{background:var(--red-t);color:var(--red)}

/* score bug */
.bug{background:var(--bg2);border-radius:18px;padding:16px 16px 14px;margin-top:12px}
.brow{display:flex;align-items:center;gap:12px;padding:5px 0}
.brow .bi{flex:1;min-width:0}
.bug .nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bug .rec{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.bug .sc{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.bug .sc.lose{color:var(--label3)}
.wp{margin-top:14px}
.wp .lbls{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:5px;font-variant-numeric:tabular-nums}
.wp .track{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden;display:flex}
.wp .track i{display:block;height:100%;background:var(--green);transition:width .6s}
.wp .track i+i{background:var(--blue)}
.pop{animation:pop .75s ease}
@keyframes pop{30%{transform:scale(1.14);color:var(--green)}}
.wkpick{display:flex;align-items:center;gap:6px}
.wkpick button{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--blue);font-size:18px;font-weight:600;display:grid;place-items:center}

/* matchup rows */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr);align-items:center;gap:4px;padding:9px 10px;position:relative}
.mrow+.mrow::before{content:"";position:absolute;top:0;left:10px;right:10px;height:.5px;background:var(--sep)}
.mp{display:flex;align-items:center;gap:7px;min-width:0}
.mp.r{flex-direction:row-reverse;text-align:right}
.mp .hs{width:32px;height:32px}
.mp .i{flex:1;min-width:0}
.mp .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp .g{font-size:11px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp .pts{text-align:right;min-width:36px}
.mp.r .pts{text-align:left}
.mp .pts b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.mp .pts small{font-size:11px;color:var(--label3);font-variant-numeric:tabular-nums}
.mp.done .pts b{color:var(--label)}
.mp.live .g{color:var(--green)}
.slot{justify-self:center;font-size:10px;font-weight:700;color:var(--label2);background:var(--fill);border-radius:6px;padding:4px 0;width:40px;text-align:center;letter-spacing:.02em}
.mrow.flash{animation:flash 1.8s ease}
@keyframes flash{0%{background:var(--green-t)}100%{background:transparent}}

/* games rail */
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{display:none}
.game{flex:none;width:168px;background:var(--bg2);border-radius:14px;padding:11px 12px;scroll-snap-align:start}
.game .gr{display:flex;align-items:center;gap:8px;height:26px}
.game .gr img{width:22px;height:22px;object-fit:contain}
.game .gr .ab{flex:1;font-weight:700;font-size:15px}
.game .gr .s{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.game .gr.l .ab,.game .gr.l .s{color:var(--label2)}
.game .gs{font-size:12px;color:var(--label2);margin-top:6px;display:flex;justify-content:space-between;gap:6px}
.game .gs .live{color:var(--red);font-weight:600}
.game .mine{font-size:11px;color:var(--blue);font-weight:600;margin-top:3px}

/* audible */
.bot{background:linear-gradient(160deg,rgba(10,132,255,.22),rgba(191,90,242,.14) 60%,transparent),var(--bg2);border-radius:18px;padding:14px 14px 6px;margin-top:14px}
.bot .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px;padding:0}
.bot .hd .chev{margin-left:4px}
.boticon{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;flex:none}
.boticon svg{width:20px;height:20px;fill:#fff}
.bot .hd b{display:block;font-size:16px}
.bot .hd span{font-size:12px;color:var(--label2)}
.ins{display:flex;gap:11px;padding:10px 0;border-top:.5px solid var(--sep);text-align:left;width:100%}
.ins:first-of-type{border-top:0}
.ins .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.ins .dot.bad{background:var(--red)}.ins .dot.warn{background:var(--orange)}.ins .dot.good{background:var(--green)}.ins .dot.info{background:var(--blue)}
.ins .tx{flex:1;font-size:15px;line-height:1.36}
.ins .tx b{font-weight:600}
.aibox{font-size:15px;line-height:1.45;white-space:pre-wrap;padding:6px 0 10px}
.aibtn svg{width:17px;height:17px;fill:currentColor}
.aibtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;margin:4px 0 8px;border-radius:12px;background:var(--fill);font-weight:600;font-size:15px;color:var(--blue)}

/* buttons */
.btn{display:block;width:100%;text-align:center;background:var(--blue);color:#fff;font-weight:600;border-radius:13px;padding:14px;font-size:17px}
.btn.gray{background:var(--bg2);color:var(--blue)}
.btn.red{background:var(--bg2);color:var(--red)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:600px;margin:0 auto;background:var(--bg);border-radius:14px 14px 0 0;max-height:calc(100vh - var(--sat) - 30px);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
html[data-theme=light] .sheet{background:var(--bg)}
.sheet.on{transform:none}
.sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--bg4);margin:7px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;flex:none}
.sheet .sh b{font-size:17px}
.sheet .sh button{color:var(--blue);font-weight:600;font-size:17px}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(24px + var(--sab))}
.lbl{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;margin:22px 14px 7px}
.note{font-size:13px;color:var(--label2);margin:7px 14px 0;line-height:1.4}
.sel{background:none;border:0;color:var(--label2);font-size:16px;text-align:right;direction:rtl;outline:none;-webkit-appearance:none;appearance:none;max-width:60%}
.sel option{direction:ltr}
.tgl{position:relative;width:51px;height:31px;flex:none}
.tgl input{opacity:0;width:0;height:0;position:absolute}
.tgl i{position:absolute;inset:0;border-radius:16px;background:var(--bg4);transition:.2s}
.tgl i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:.2s}
.tgl input:checked+i{background:var(--green)}
.tgl input:checked+i::after{transform:translateX(20px)}
.tin{flex:1;background:none;border:0;outline:none;text-align:right;color:var(--label2);font-size:16px;min-width:0}

/* player sheet */
.phero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.phero h3{margin:12px 0 2px;font-size:24px;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border-radius:14px;margin-top:14px}
.stats div{padding:12px 6px;text-align:center}
.stats div+div{box-shadow:-.5px 0 0 var(--sep)}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats span{font-size:12px;color:var(--label2)}
.spark{display:flex;align-items:flex-end;gap:5px;height:90px;padding:12px 14px 8px}
.spark div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.spark i{display:block;width:100%;max-width:22px;border-radius:4px 4px 2px 2px;background:var(--blue);min-height:2px}
.spark span{font-size:10px;color:var(--label3)}

/* trades + news */
.trade{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 14px 12px}
.trade .side .who{font-size:12px;color:var(--label2);margin-bottom:4px}
.trade .side div{font-size:14px;font-weight:600;line-height:1.35}
.news{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;position:relative}
.news+.news::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.news .im{width:78px;height:58px;border-radius:9px;background:var(--bg3);flex:none;overflow:hidden}
.news .im img{width:100%;height:100%;object-fit:cover}
.news h4{margin:0;font-size:15px;line-height:1.3;font-weight:600}
.news p{margin:3px 0 0;font-size:12px;color:var(--label2)}

/* setup + toasts + loading */
.setup{min-height:86vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 4px}
.logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center}
.logo svg{width:40px;height:40px;fill:#fff}
.setup h1{margin:6px 0 0;font-size:34px;letter-spacing:-.025em}
.field{width:100%;background:var(--bg2);border:0;border-radius:12px;padding:15px;font-size:17px;outline:none}
.err{color:var(--red);font-size:14px;min-height:18px}
.toasts{position:fixed;top:calc(8px + var(--sat));left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--bg3);border-radius:999px;padding:6px 18px 6px 6px;box-shadow:0 12px 34px rgba(0,0,0,.35);animation:tin .4s cubic-bezier(.2,.9,.3,1.2),tout .4s ease 3.7s forwards;font-weight:600;font-size:15px}
.toast .hs{width:34px;height:34px}
.toast b{color:var(--green);font-size:17px;font-variant-numeric:tabular-nums}
.toast.plain{padding:11px 18px}
@keyframes tin{from{transform:translateY(-36px) scale(.92);opacity:0}}
@keyframes tout{to{transform:translateY(-36px);opacity:0}}
.loading{padding:90px 0;text-align:center;color:var(--label2)}
.spin{width:24px;height:24px;border:2.5px solid var(--bg4);border-top-color:var(--label2);border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* audible bot */
.abot{display:block;flex:none;overflow:visible}
.abot .b{transform-box:fill-box;transform-origin:center}
.abot .bd.hop{animation:abhop .85s cubic-bezier(.3,1.4,.5,1)}
.abot .bd.shake{animation:abshake .55s ease}
.abot .bd.sink{transform:translateY(4px);transition:transform .6s ease}
.abot .bd.tilt{transform:rotate(-6deg);transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.abot .bd.breathe{animation:abbreathe 3.2s ease-in-out infinite}
.abot .bd.popin{animation:abpop .55s cubic-bezier(.3,1.6,.5,1)}
.abot .fc{transition:transform .11s ease-in}.abot .ey{transition:transform .08s ease-in}
.abot .led.flash{animation:abflash .25s 4 alternate}
.abot .zz{opacity:0}.abot.sleep .zz{animation:abzz 2.6s ease-in infinite}.abot.sleep .zz2{animation-delay:1.3s}
@keyframes abhop{30%{transform:translateY(-8px) rotate(-3deg)}55%{transform:translateY(0)}72%{transform:translateY(-2.5px)}100%{transform:none}}
@keyframes abshake{20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}100%{transform:none}}
@keyframes abbreathe{50%{transform:translateY(2px) scale(.985)}}
@keyframes abpop{0%{transform:scale(.4) translateY(20px);opacity:0}100%{transform:none;opacity:1}}
@keyframes abflash{to{opacity:.15}}
@keyframes abzz{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(6px,-12px)}}
.abot.a28{width:30px;height:30px}.abot.a40{width:40px;height:40px}.abot.a64{width:66px;height:66px;margin:0 auto 12px}.abot.a18{width:22px;height:22px}
.reduce .abot *{animation:none!important;transition:none!important}
.reduce .toast,.reduce .pop,.reduce .flash{animation:none!important}

/* ===== app feel ===== */
html{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
.aibox,.msg{-webkit-user-select:text;user-select:text}
button,.cell,.game,.bug,a.news,.chip{transition:transform .18s cubic-bezier(.2,.9,.3,1),background-color .15s,opacity .15s}
button:active,.chip:active,.game:active,.bug:active{transform:scale(.97)}
.cell:active,a.news:active,.trow:active{background:var(--bg3)}
nav button:active{transform:scale(.9)}
.enter{animation:enter .32s cubic-bezier(.2,.9,.3,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
.sheet.drag,.chat.drag{transition:none}
.skel{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shim 1.2s infinite;border-radius:14px;height:64px;margin-top:10px}
@keyframes shim{to{background-position:-200% 0}}

/* fab */
.fab{position:fixed;right:16px;bottom:calc(66px + var(--sab));z-index:29;width:58px;height:58px;border-radius:50%;padding:0;box-shadow:0 8px 24px rgba(10,132,255,.38)}
.fab .abot{width:58px;height:58px}
.fab{transition:transform .32s cubic-bezier(.2,.9,.3,1),opacity .25s ease}
.fab.hide{transform:translateY(24px) scale(.6);opacity:0;pointer-events:none}
@media(min-width:640px){.fab{right:calc(50% - 284px)}}

/* chat */
.chat{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.3,1);padding-top:var(--sat)}
.chat:not(.on){visibility:hidden;transition:transform .38s cubic-bezier(.2,.9,.3,1),visibility 0s .38s}
.chat.on{transform:none}
.chd{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:.5px solid var(--sep);max-width:600px;width:100%;margin:0 auto}
.chbtn{color:var(--blue);font-size:17px;min-width:56px}
#chClear{text-align:right}
.chtitle{display:flex;align-items:center;gap:8px;font-size:17px}
.boticon.sm2{width:28px;height:28px;border-radius:8px}
.boticon.sm2 svg{width:16px;height:16px}
.chlog{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 10px;max-width:600px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:20px;font-size:16px;line-height:1.4;word-wrap:break-word;animation:enter .25s ease}
.msg.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--bg2);border-bottom-left-radius:6px}
.msg.e{align-self:flex-start;background:var(--red-t);color:var(--red);font-size:14px}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}
.msg ul{margin:4px 0 8px;padding-left:18px}.msg li{margin:2px 0}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--label3);animation:bob 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-4px);opacity:.5}}
.sugg{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.sugg button{background:var(--bg2);border-radius:14px;padding:12px 14px;text-align:left;font-size:15px}
.chintro{text-align:center;padding:30px 10px 10px;color:var(--label2)}
.chintro .boticon{width:60px;height:60px;border-radius:18px;margin:0 auto 12px}
.chintro .boticon svg{width:32px;height:32px}
.chintro b{display:block;color:var(--label);font-size:20px;margin-bottom:4px}
.chin{display:flex;align-items:flex-end;gap:8px;padding:8px 12px calc(8px + var(--sab));border-top:.5px solid var(--sep);max-width:600px;width:100%;margin:0 auto;background:var(--bg)}
.chin textarea{flex:1;resize:none;background:var(--bg2);border:0;border-radius:20px;padding:9px 14px;font:inherit;font-size:16px;color:var(--label);outline:none;max-height:120px;line-height:1.35}
.chin button{width:36px;height:36px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}
.chin button:disabled{background:var(--bg4)}
.chin button svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.keybox{background:var(--bg2);border-radius:14px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.keybox input{background:var(--bg3);border:0;border-radius:10px;padding:12px;font-size:16px;outline:none}

/* team */
.trow{display:flex;align-items:center;gap:10px;padding:10px 14px;position:relative;width:100%;text-align:left}
.trow+.trow::before{content:"";position:absolute;top:0;right:0;left:56px;height:.5px;background:var(--sep)}
.trow .slot{width:38px;flex:none}
.trow .hs{width:40px;height:40px}
.trow.bad{box-shadow:inset 3px 0 0 var(--red)}
.trow.warn{box-shadow:inset 3px 0 0 var(--orange)}
.trow .i{flex:1;min-width:0}
.trow .r{text-align:right;flex:none;min-width:44px}
.trow .r b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.trow .r small{font-size:11px;color:var(--label3);font-variant-numeric:tabular-nums}
.live-g{color:var(--green)!important;font-weight:600}
.summ{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2);border-radius:14px;margin-top:12px}
.summ div{padding:11px 4px;text-align:center}
.summ div+div{box-shadow:-.5px 0 0 var(--sep)}
.summ b{display:block;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.summ span{font-size:11px;color:var(--label2)}

/* player game box + stat lines */
.gbox{background:var(--bg2);border-radius:14px;padding:14px;margin-top:14px}
.gbox .gt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.gbox img{width:34px;height:34px;object-fit:contain}
.gbox .ab{font-weight:700;font-size:15px}
.gbox .gs2{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.gbox .gsd{font-size:13px;color:var(--label2);margin-top:2px}
.gbox .gsd.live{color:var(--red);font-weight:600}
.sgrp{background:var(--bg2);border-radius:14px;padding:12px 14px;margin-top:10px}
.sgrp h5{margin:0 0 8px;font-size:13px;color:var(--label2);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.sline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;text-align:center}
.sline b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.sline span{font-size:11px;color:var(--label2)}
.brk{display:flex;justify-content:space-between;padding:7px 0;font-size:15px;border-top:.5px solid var(--sep)}
.brk:first-of-type{border-top:0}
.brk b{font-variant-numeric:tabular-nums}

/* game tracker */
.trkcard{background:var(--bg2);border-radius:16px;overflow:hidden}
.trkhd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;font-size:14px;font-weight:600}
.field{display:block;width:100%;height:auto}
.field .fn{fill:rgba(255,255,255,.55);font:700 9px -apple-system,sans-serif;text-anchor:middle}
.field .ezt{fill:#fff;font:800 13px -apple-system,sans-serif;text-anchor:middle;letter-spacing:.12em;opacity:.95}
.field .gt2{fill:#fff;font:700 11px -apple-system,sans-serif;text-anchor:middle}
.lastp{padding:10px 14px;font-size:13px;line-height:1.35}
.play{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;position:relative}
.play+.play::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.play.on{background:var(--blue-t)}
.play:active{background:var(--bg3)}
.play .pq{font-size:11px;color:var(--label3);width:38px;flex:none;line-height:1.3;font-variant-numeric:tabular-nums}
.play .pt{flex:1;font-size:14px;line-height:1.35;min-width:0}
.play .pr{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;min-width:44px}
.play .pr b{font-size:16px}.play .pr small{font-size:10px;color:var(--label3)}.play .pr span{font-size:12px;font-weight:600}
.play.big .pt{font-weight:600}
.relv{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 6px}
.relt{font-size:22px;letter-spacing:-.02em;margin:4px 2px 12px}
.bigpts{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
/* ===== 1.3.2 native feel ===== */
:root{--ios:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.4,.64,1)}
@supports (transition-timing-function:linear(0,1)){:root{--spring:linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017 19.4%,1.067,1.099 24.3%,1.108 26%,1.1,1.084 30.6%,1.019 39.4%,.996 44.9%,.988 50%,1 63.2%,1.001 79.2%,1)}}
/* top bar: frosts in gradually as you scroll */
.bar,.bar.solid{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important}
.bar::before{content:"";position:absolute;inset:0;background:var(--bar);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);box-shadow:0 .5px 0 var(--sep);opacity:var(--bo,0);pointer-events:none}
.bar .wrap{position:relative;z-index:1}
.bar .mini{transition:none}
nav{backdrop-filter:saturate(190%) blur(28px);-webkit-backdrop-filter:saturate(190%) blur(28px)}
.toast{background:var(--bar);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);box-shadow:0 12px 34px rgba(0,0,0,.28),0 0 0 .5px var(--sep);animation:tin .55s var(--spring),tout .4s ease 3.7s forwards}
/* large title collapses into the bar */
.lt{transform-origin:left bottom;will-change:transform,opacity}
/* springy presses */
button,.cell,.game,.bug,a.news,.chip{transition:transform .5s var(--spring),background-color .2s,opacity .15s}
button:active,.chip:active,.game:active,.bug:active{transform:scale(.96);transition-duration:.1s}
.circ:active{transform:scale(.88)}
.btn:active{transform:scale(.97);opacity:.85}
nav button:active{transform:scale(.88)}
nav button.on svg{animation:tabpop .55s var(--spring)}
@keyframes tabpop{0%{transform:scale(.72)}100%{transform:none}}
.enter{animation:enter .45s var(--ios)}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.992)}}
/* sliding segmented control */
.seg{position:relative}
.seg .pill{position:absolute;top:2px;bottom:2px;left:0;border-radius:7px;background:var(--bg4);box-shadow:0 3px 8px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.04);transition:transform .5s var(--spring),width .3s var(--ios)}
html[data-theme=light] .seg .pill{background:#fff}
.seg button{position:relative;z-index:1}
.seg button.on,html[data-theme=light] .seg button.on{background:none;box-shadow:none}
.seg button:active{transform:scale(.94)}
/* sheets & chat: iOS curve */
.sheet{transition:transform .5s var(--ios);will-change:transform}
.sheet .sh{transition:box-shadow .2s}
.sheet.scrolled .sh{box-shadow:0 .5px 0 var(--sep)}
.scrim{transition:opacity .4s var(--ios)}
.scrim.dragging{transition:none}
.chat{transition:transform .5s var(--ios)}
.chat:not(.on){transition:transform .5s var(--ios),visibility 0s .5s}
.fab{transition:transform .5s var(--spring),opacity .25s ease}
/* liquid glass tab bar + buttons */
:root{--soft:cubic-bezier(.3,1.08,.5,1);--nb:max(10px, calc(var(--sab) - 8px));--glass:rgba(38,38,42,.5);--glass-hi:rgba(255,255,255,.2);--glass-lo:rgba(255,255,255,.06);--bub:rgba(255,255,255,.13)}
html[data-theme=light]{--glass:rgba(255,255,255,.55);--glass-hi:rgba(255,255,255,.95);--glass-lo:rgba(255,255,255,.35);--bub:rgba(0,0,0,.065)}
body{padding-bottom:calc(var(--nb) + 92px)}
nav{left:14px;right:14px;bottom:var(--nb);max-width:560px;margin:0 auto;border-radius:999px;padding:4px;background:var(--glass);backdrop-filter:blur(18px) saturate(210%) brightness(1.08);-webkit-backdrop-filter:blur(18px) saturate(210%) brightness(1.08);box-shadow:inset 0 1px .5px var(--glass-hi),inset 0 -1px .5px var(--glass-lo),inset 0 0 0 .5px var(--glass-lo),0 10px 34px rgba(0,0,0,.32),0 1px 3px rgba(0,0,0,.18)}
nav::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,0) 48%,rgba(255,255,255,0) 80%,rgba(255,255,255,.05));pointer-events:none}
html[data-theme=light] nav::before{background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0) 50%)}
nav .wrap{max-width:none;padding:0;position:relative}
nav button{padding:7px 0 6px;border-radius:999px;z-index:1}
nav .tbub{position:absolute;top:0;bottom:0;left:0;border-radius:999px;background:var(--bub);box-shadow:inset 0 .5px .5px var(--glass-hi),inset 0 0 0 .5px var(--glass-lo);transition:transform .6s var(--spring),width .4s var(--ios),scale .35s var(--spring);pointer-events:none}
nav:active .tbub{scale:1.06 1.1}
@supports (transition-timing-function:linear(0,1)){:root{--soft:linear(0,.006,.025 2.8%,.101 6.1%,.539 18.9%,.721 25.3%,.849 31.5%,.937 38.1%,.968 41.8%,.991 45.7%,1.006 50.1%,1.015 55%,1.017 63.9%,1.001 85.9%,1)}}
nav .tbub{transition:transform .55s var(--soft),width .4s var(--ios),scale .35s var(--soft)}
.seg .pill{transition:transform .5s var(--soft),width .3s var(--ios)}
nav.dragging .tbub{transition:transform .16s var(--ios),scale .3s var(--soft);scale:1.12 1.16}
/* snappier bubble, instant drag tracking */
nav .tbub{transition:transform .34s var(--soft),width .3s var(--ios),scale .25s var(--soft)}
nav.dragging .tbub{transition:scale .12s linear;scale:1.1 1.1;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.45),inset 0 -1px 1px rgba(255,255,255,.12),inset 0 0 0 .5px rgba(255,255,255,.25),0 6px 18px rgba(0,0,0,.28)}
html[data-theme=light] nav.dragging .tbub{background:rgba(255,255,255,.55);box-shadow:inset 0 1px 1px #fff,inset 0 0 0 .5px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.14)}
nav.tinting button,nav.tinting button.on{color:color-mix(in srgb,var(--blue) var(--p,0%),var(--label3))}
/* tab bar v3: physics in JS, no CSS motion fighting it */
nav{touch-action:none;-webkit-user-select:none;user-select:none}
nav .tbub,nav.dragging .tbub{transition:background .2s,box-shadow .2s;will-change:transform,scale}
nav:active .tbub{scale:none}
nav button,nav button:active,nav.dragging button,nav.dragging button:active{transform:none;transition:color .12s}
nav button.on svg{animation:none}
nav.dragging button,nav.dragging button:active{transform:none;transition:color .12s}
nav button{transition:transform .3s var(--soft),color .15s}
/* top buttons: no backdrop blur (it smudged them against the status bar) */
.circ{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:#2c2c2e;box-shadow:inset 0 .5px 0 rgba(255,255,255,.14)}
html[data-theme=light] .circ{background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.08)}
nav button:active{transform:scale(.92)}
.fab{bottom:calc(var(--nb) + 76px)}
/* top buttons: crisp light glass, bright icons */
.circ{width:42px;height:42px;background:rgba(120,120,128,.3);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px .5px rgba(255,255,255,.22),inset 0 0 0 .5px rgba(255,255,255,.1)}
.circ svg{width:22px;height:22px;stroke:#fff;stroke-width:2.3}
html[data-theme=light] .circ{background:rgba(255,255,255,.75);box-shadow:inset 0 1px .5px #fff,0 0 0 .5px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.1)}
html[data-theme=light] .circ svg{stroke:#000}
/* game cards line up with the page edge */
.rail{scroll-padding-inline:16px}
/* chat composer: one compact capsule that sits right on the keyboard */
.chin{margin:6px auto calc(6px + var(--sab));width:calc(100% - 20px);max-width:580px;padding:4px 4px 4px 14px;background:var(--bg2);border:.5px solid var(--sep);border-top:.5px solid var(--sep);border-radius:22px;align-items:flex-end;gap:6px}
.chin textarea{background:none;border-radius:0;padding:7px 0;max-height:110px}
.chin button{width:32px;height:32px}
.chin button svg{width:16px;height:16px}
.chat.kb .chin{margin-bottom:8px}
.chat{box-sizing:border-box}
.chat.kb .chd{padding-top:6px;padding-bottom:6px}
/* game sheet */
.gbox{transition:background .4s}
.lines{width:100%;table-layout:fixed;border-collapse:collapse;margin-top:14px;font-size:13px}
.lines th{font-weight:600;color:var(--label3);padding:2px 0;text-align:center}
.lines td{text-align:center;padding:4px 0;color:var(--label2)}
.lines td:first-child,.lines th:first-child{text-align:left;font-weight:700;color:var(--label);width:24%}
.lines td:last-child{color:var(--label)}
.gcard{background:var(--bg2);border-radius:14px;padding:12px 14px}
.wprow{display:flex;justify-content:space-between;font-size:14px;color:var(--label2)}
.wprow b{color:var(--label);font-size:17px}
.wpbar,.tsbar{display:flex;gap:3px;height:6px;margin-top:8px}
.wpbar i,.tsbar i{display:block;border-radius:3px;min-width:3px}
.tsbar{height:4px;margin-top:5px}
.tsh{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px}
.tsr{padding:8px 0}.tsr+.tsr{border-top:.5px solid var(--sep)}
.tsv{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.tsv span{font-size:13px;color:var(--label2)}
.ldrs{padding-top:4px}
.ldcat{font-size:12px;font-weight:600;color:var(--label3);text-transform:uppercase;letter-spacing:.03em;text-align:center;margin-top:10px}
.ldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 0 4px}
.ldrow+.ldcat{border-top:.5px solid var(--sep);padding-top:10px}
.ldr{display:flex;align-items:center;gap:8px;min-width:0}
.ldr.r{flex-direction:row-reverse;text-align:right}
.ldr .hs{width:34px;height:34px}
.ln{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{font-size:12px;color:var(--label2);line-height:1.3}
/* clearer frosted glass, shared by every glass surface */
:root{--glass:rgba(30,30,34,.3);--frost:blur(12px) saturate(210%) brightness(1.06)}
html[data-theme=light]{--glass:rgba(255,255,255,.38)}
nav,.bar::before,.toast{backdrop-filter:var(--frost);-webkit-backdrop-filter:var(--frost)}
.bar::before{background:var(--glass)}
.toast{background:var(--glass)}
nav button{text-shadow:0 1px 6px rgba(0,0,0,.35)}
html[data-theme=light] nav button{text-shadow:0 1px 6px rgba(255,255,255,.6)}
/* hide initials behind player photos once the photo loads */
.hs:has(img),.av:has(img){color:transparent}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

function whatsNewBody(all){

/* =============== utils =============== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
async function getJSON(url){

}
const api = p => getJSON(API + p);
const f1 = n => (n == null || isNaN(n)) ? "–" : (Math.round(n*10)/10).toFixed(1);

const tm = d => d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}).replace(/\s/g,"").toLowerCase();
const day = d => d.toLocaleDateString([], {weekday:"short"});
function ago(ms){
  const s = (Date.now() - ms)/1000;
  if(s < 60) return "just now"; if(s < 3600) return Math.floor(s/60) + "m ago";
  if(s < 86400) return Math.floor(s/3600) + "h ago"; return Math.floor(s/86400) + "d ago";
}
const CHEV = '<svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5 6.5 6.5 1.5 11.5"/></svg>';

/* =============== settings & theme =============== */
function loadSettings(){ S.set = {...DEF_SET, ...(store.get("gd_settings") || {})}; applyTheme(); }

function applyTheme(){
  const t = S.set.theme === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : S.set.theme;
  document.documentElement.dataset.theme = t;
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.content = t === "light" ? "#f2f2f7" : "#000000";
  document.body.classList.toggle("reduce", !S.set.celebrate);
}
try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme); } catch(e){}

/* =============== players =============== */
const KEEP = new Set(["QB","RB","WR","TE","K","DEF","DL","DE","DT","LB","DB","CB","S"]);
async function loadPlayers(force){
  const c = store.get("gd_players3");
  if(c && c.p && !force && Date.now() - c.t < 12*3600e3){ S.players = c.p; return; }
  loading("Loading the player list. This happens about once a day.");
  const raw = await api("/players/nfl");
  const p = {};
  for(const id in raw){
    const x = raw[id]; if(!x || !KEEP.has(x.position)) continue;
    if(!x.team && !x.active) continue;
    const name = x.position === "DEF" ? `${x.first_name||""} ${x.last_name||""}`.trim() : (x.full_name || `${x.first_name||""} ${x.last_name||""}`.trim());
    p[id] = [name || id, x.position || "", x.team || "", x.injury_status || "", (x.fantasy_positions || [x.position]).join(","), x.number || "", x.age || "", x.years_exp == null ? "" : x.years_exp, x.injury_body_part || "", x.espn_id || ""];
  }
  S.players = p; store.set("gd_players3", {t:Date.now(), p}); store.del("gd_players2");
}
function P(id){
  if(!id || id === "0") return {id:"0", name:"Empty", pos:"", team:"", inj:"", fp:[], empty:true};
  const x = S.players[id];
  if(!x) return {id, name:"Player " + id, pos:"", team:"", inj:"", fp:[]};
  return {id, name:x[0], pos:x[1], team:x[2], inj:x[3], fp:x[4] ? x[4].split(",") : [x[1]], num:x[5], age:x[6], exp:x[7], body:x[8], espn:x[9]};
}
function shortName(p){
  if(p.empty) return "Empty";
  const w = p.name.split(" ");
  if(p.pos === "DEF") return w[w.length-1];
  return w.length > 1 ? w[0][0] + ". " + w.slice(1).join(" ") : p.name;
}
const INJ = {Questionable:"Q", Doubtful:"D", Out:"O", IR:"IR", PUP:"IR", Sus:"S", NA:"O", DNR:"O", COV:"O"};
function stBadge(p){
  if(isBye(p)) return '<span class="st BYE">BYE</span>';
  const c = p.inj ? (INJ[p.inj] || p.inj.slice(0,2).toUpperCase()) : "";
  return c ? `<span class="st ${c}">${c}</span>` : "";
}
function hs(p, cls){
  if(p.empty) return `<div class="hs ${cls||""}">–</div>`;
  const ini = esc(p.name.split(" ").map(w => w[0]).join("").slice(0,2));
  const src = p.pos === "DEF" ? `${CDN}/images/team_logos/nfl/${p.id.toLowerCase()}.png` : `${CDN}/content/nfl/players/thumb/${p.id}.jpg`;
  return `<div class="hs ${p.pos==="DEF"?"def":""} ${cls||""}">${ini}<img src="${src}" alt="" loading="lazy" onerror="this.remove()"></div>`;
}

/* =============== scoring, projections, history =============== */
function fpts(st){
  if(!st) return null;
  const ss = (S.league && S.league.scoring_settings) || {};
  let t = 0, any = false;
  for(const k in ss){ const v = st[k]; if(typeof v === "number"){ t += v * ss[k]; any = true; } }
  if(any) return Math.round(t*100)/100;
  const rec = ss.rec || 0, k = rec >= 1 ? "pts_ppr" : rec >= .5 ? "pts_half_ppr" : "pts_std";
  return typeof st[k] === "number" ? st[k] : null;
}
function normStats(d){
  if(Array.isArray(d)){ const o = {}; d.forEach(x => { if(x && x.player_id) o[x.player_id] = x.stats || x; }); return o; }
  return d || {};
}
async function loadProj(){
  const lid = S.league.league_id, key = `gd_proj_${lid}_${S.state.season}_${S.week}`;
  const c = store.get(key);
  if(c && Date.now() - c.t < 2*3600e3){ S.proj = c.p; return; }
  try{
    const raw = normStats(await api(`/projections/nfl/regular/${S.state.season}/${S.week}`));
    const p = {};
    for(const id in raw){ const v = fpts(raw[id]); if(v != null && v > 0) p[id] = v; }
    S.proj = p; store.set(key, {t:Date.now(), p});
  }catch(e){ S.proj = {}; }
}
async function loadSeason(){
  const lid = S.league.league_id, key = `gd_season_${lid}_${S.state.season}`;
  const c = store.get(key);
  if(c && Date.now() - c.t < 6*3600e3){ S.season = c.p; return; }
  try{
    const raw = normStats(await api(`/stats/nfl/regular/${S.state.season}`));
    const p = {};
    for(const id in raw){
      const st = raw[id], v = fpts(st), gp = st.gp || st.gms_active || 0;
      if(v != null && gp) p[id] = [Math.round(v*10)/10, gp];
    }
    S.season = p; store.set(key, {t:Date.now(), p});
  }catch(e){ S.season = {}; }
}
function ppg(id){
  const s = S.season[id]; if(s && s[1]) return s[0]/s[1];
  let tot = 0, n = 0;
  for(const w in S.hist){ const v = S.hist[w][id]; if(typeof v === "number" && v !== 0){ tot += v; n++; } }
  return n ? tot/n : null;
}
const proj = id => (S.proj[id] != null ? S.proj[id] : null);
async function loadHistory(){
  const id = S.league.league_id, cur = S.state.week || 1;
  S.hist = (store.get("gd_hist_" + id) || {}).weeks || {};
  const need = [];
  for(let w = 1; w < cur && w <= 18; w++) if(!S.hist[w]) need.push(w);
  if(!need.length) return;
  try{
    const res = await Promise.all(need.map(w => api(`/league/${id}/matchups/${w}`).then(ms => [w, ms])));
    for(const [w, ms] of res){
      const pts = {}; (ms||[]).forEach(m => Object.assign(pts, m.players_points || {}));
      if(Object.keys(pts).length) S.hist[w] = pts;
    }
    store.set("gd_hist_" + id, {weeks:S.hist});
  }catch(e){}
}

/* =============== NFL games (ESPN) =============== */
const FIX = {WSH:"WAS", LA:"LAR", JAC:"JAX"};
async function loadGames(){
  try{
    const st = S.state.season_type === "post" ? 3 : 2;
    const d = await getJSON(`${ESPN}/scoreboard?seasontype=${st}&week=${S.week}&dates=${S.state.season}`);
    S.games = (d.events || []).map(ev => {
      const c = ev.competitions[0], st = c.status || ev.status, t = st.type || {};
      const side = h => { const x = c.competitors.find(k => k.homeAway === h) || {}; const tm = x.team || {};
        return {abbr:FIX[tm.abbreviation] || tm.abbreviation, score:+x.score || 0, logo:tm.logo || "", rec:((x.records||[])[0]||{}).summary || ""}; };
      const o = (c.odds || [])[0] || {};
      return {id:ev.id, date:new Date(ev.date), state:t.state || "pre", detail:t.shortDetail || "", period:st.period || 0, clock:st.clock || 0,
        home:side("home"), away:side("away"), odds:o.details || "", ou:o.overUnder || null, net:(((c.broadcasts||[])[0]||{}).names||[])[0] || ""};
    });
  }catch(e){ if(!S.games) S.games = null; }
}
const gameFor = team => S.games && team ? S.games.find(g => g.home.abbr === team || g.away.abbr === team) : null;
function isBye(p){ return !!(S.games && S.games.length > 10 && p.team && p.pos && !gameFor(p.team)); }
function gameLine(p){
  if(p.empty || !p.team) return p.empty ? "" : "Free agent";
  if(isBye(p)) return "Bye week";
  const g = gameFor(p.team); if(!g) return p.team;
  const home = g.home.abbr === p.team, opp = home ? g.away.abbr : g.home.abbr, at = home ? "vs" : "@";
  if(g.state === "pre") return `${at} ${opp} · ${day(g.date)} ${tm(g.date)}`;
  const me = home ? g.home.score : g.away.score, them = home ? g.away.score : g.home.score;
  if(g.state === "in") return `${at} ${opp} · ${g.detail}`;
  return `Final · ${me > them ? "W" : me < them ? "L" : "T"} ${me}-${them}`;
}
function gameFrac(p){
  const g = gameFor(p.team); if(!g) return isBye(p) ? 1 : 0;
  if(g.state === "post") return 1; if(g.state === "pre") return 0;
  if(g.period > 4) return .98;
  return Math.min(1, Math.max(0, ((g.period - 1)*900 + (900 - (g.clock||0)))/3600));
}
const gState = p => { const g = gameFor(p.team); return g ? g.state : (isBye(p) ? "post" : "pre"); };

/* =============== league =============== */
const ELIG = {QB:["QB"],RB:["RB"],WR:["WR"],TE:["TE"],K:["K"],DEF:["DEF"],FLEX:["RB","WR","TE"],WRRB_FLEX:["RB","WR"],REC_FLEX:["WR","TE"],SUPER_FLEX:["QB","RB","WR","TE"],DL:["DL","DE","DT"],LB:["LB"],DB:["DB","CB","S"],IDP_FLEX:["DL","DE","DT","LB","DB","CB","S"]};
const SLBL = {FLEX:"FLX",SUPER_FLEX:"SF",WRRB_FLEX:"W/R",REC_FLEX:"W/T",IDP_FLEX:"IDP"};
const canPlay = (p, slot) => { const e = ELIG[slot] || [slot]; return p.fp.some(x => e.includes(x)); };
const slots = () => (S.league.roster_positions || []).filter(x => !["BN","IR","TAXI"].includes(x));
function team(rid){
  const r = S.rosters.find(x => x.roster_id === rid);
  const u = r ? S.users.find(x => x.user_id === r.owner_id) : null;
  const st = (r && r.settings) || {};
  return {rid, r, u, name:(u && u.metadata && u.metadata.team_name) || (u && u.display_name) || ("Team " + rid),
    handle:(u && u.display_name) || "", avatar:u && u.avatar, w:st.wins||0, l:st.losses||0, t:st.ties||0,
    pf:(st.fpts||0) + (st.fpts_decimal||0)/100, pa:(st.fpts_against||0) + (st.fpts_against_decimal||0)/100,
    streak:(r && r.metadata && r.metadata.streak) || "", faab:st.waiver_budget_used, wpos:st.waiver_position};
}
const owner = n => n;
const rec = t => `${t.w}-${t.l}${t.t ? "-" + t.t : ""}`;
function av(t, cls){
  const ini = esc((t.name||"?").slice(0,1).toUpperCase());
  return `<div class="av ${cls||""}">${ini}${t.avatar ? `<img src="${CDN}/avatars/thumbs/${esc(t.avatar)}" alt="" onerror="this.remove()">` : ""}</div>`;
}
const mOf = rid => S.matchups.find(m => m.roster_id === rid);
const oppOf = m => (m && m.matchup_id != null) ? S.matchups.find(x => x.matchup_id === m.matchup_id && x.roster_id !== m.roster_id) : null;
const ownerMap = () => { const o = {}; S.rosters.forEach(r => (r.players||[]).forEach(id => o[id] = r.roster_id)); return o; };
const isCur = () => S.week === S.state.week;

async function loadLeague(){
  const id = S.league.league_id;
  const [lg, rosters, users, matchups] = await Promise.all([api(`/league/${id}`), api(`/league/${id}/rosters`), api(`/league/${id}/users`), api(`/league/${id}/matchups/${S.week}`)]);
  if(lg) S.league = {...S.league, ...lg};
  S.rosters = rosters || []; S.users = users || []; S.matchups = matchups || [];
  const mine = S.rosters.find(r => r.owner_id === S.user.user_id || (r.co_owners||[]).includes(S.user.user_id));
  S.myRid = mine ? mine.roster_id : null;
  S.tx = null; S.trendAdd = null; S.trendDrop = null;
  S.updated = new Date();
  await Promise.all([loadGames(), loadProj()]);
  // background extras
  Promise.all([loadSeason(), loadHistory(), loadTx(), loadTrending(), loadNews()]).then(() => render());
}
async function loadTx(){
  const id = S.league.league_id, w = S.state.week || 1, weeks = [w, w-1, w-2].filter(x => x >= 1);
  try{
    const res = await Promise.all(weeks.map(x => api(`/league/${id}/transactions/${x}`).catch(() => [])));
    S.tx = res.flat().filter(t => t && t.status === "complete").sort((a,b) => (b.status_updated||b.created) - (a.status_updated||a.created));
  }catch(e){ S.tx = []; }
}
async function loadTrending(){
  try{ [S.trendAdd, S.trendDrop] = await Promise.all([api("/players/nfl/trending/add?lookback_hours=24&limit=150"), api("/players/nfl/trending/drop?lookback_hours=24&limit=60")]); }
  catch(e){ S.trendAdd = S.trendAdd || []; S.trendDrop = S.trendDrop || []; }
}
async function loadNews(){
  try{

/* =============== projections & win probability =============== */
function teamOutlook(m){
  if(!m) return null;
  let cur = m.points || 0, rem = 0, v = 0, left = 0;
  (m.starters || []).forEach((id, i) => {
    if(!id || id === "0") return;
    const p = P(id), pr = proj(id) || 0, act = (m.starters_points||[])[i] || 0, f = gameFrac(p);
    if(f >= 1) return;
    const r = Math.max(0, pr * (1 - f));
    if(f === 0 || pr > act) { rem += f === 0 ? pr : Math.max(0, pr - act) * (1 - f) + 0; }
    v += Math.pow(Math.max(2, r) * .55, 2); left++;
  });
  return {cur, proj:cur + rem, sd:Math.sqrt(v), left};
}
function winProb(a, b){
  if(!a || !b) return null;
  const sd = Math.sqrt(a.sd*a.sd + b.sd*b.sd);
  if(sd < .01) return a.proj > b.proj ? 1 : a.proj < b.proj ? 0 : .5;
  const z = (a.proj - b.proj) / sd;
  return 1 / (1 + Math.exp(-1.702 * z));
}
const hasProj = () => Object.keys(S.proj).length > 20;

/* =============== lineup + Audible =============== */
const BAD = new Set(["Out","IR","PUP","Sus","NA","DNR","COV","Doubtful"]);
function benchOf(rid){
  const r = S.rosters.find(x => x.roster_id === rid), m = mOf(rid);
  if(!r) return [];
  const st = new Set((m && m.starters) || r.starters || []), res = new Set([...(r.reserve||[]), ...(r.taxi||[])]);
  return (r.players||[]).filter(id => !st.has(id) && !res.has(id)).map(P);
}
const val = id => proj(id) != null ? proj(id) : (ppg(id) || 0);
function lineupIssues(){
  const me = mOf(S.myRid); if(!me || !isCur()) return [];
  const st = me.starters || [], bench = benchOf(S.myRid);
  const ok = b => b.team && (!b.inj || b.inj === "Questionable") && !isBye(b) && gState(b) === "pre";
  const out = [];
  slots().forEach((slot, i) => {
    const p = P(st[i]);
    if(!p.empty && gState(p) !== "pre") return; // locked
    let level = null, why = "";
    if(p.empty){ level = "bad"; why = "Empty slot"; }
    else if(isBye(p)){ level = "bad"; why = "On bye this week"; }
    else if(!p.team && p.pos !== "DEF"){ level = "bad"; why = "Not on an NFL team"; }
    else if(BAD.has(p.inj)){ level = "bad"; why = p.inj === "Doubtful" ? "Doubtful to play" : "Listed " + p.inj; }
    else if(p.inj === "Questionable"){ level = "warn"; why = "Questionable"; }
    const subs = bench.filter(b => canPlay(b, slot) && ok(b)).map(b => ({p:b, v:val(b.id)})).sort((a,b) => b.v - a.v);
    if(level){ out.push({slot, p, level, why, subs:subs.slice(0,3)}); return; }
    const mine = val(p.id), best = subs[0];
    const gap = hasProj() ? 2.5 : 3.5;
    if(best && mine > 0 && best.v - mine >= gap) out.push({slot, p, level:"tip", why:`${f1(mine)} ${hasProj()?"proj":"ppg"}`, subs:[best]});
  });
  return out;
}
function insights(){
  const out = [], me = mOf(S.myRid), op = oppOf(me);

  });
  issues.filter(x => x.level === "warn").forEach(x => {

    out.push({tone:"warn", go:"matchup", html:`<b>${esc(x.p.name)}</b> is questionable${g && g.state==="pre" ? ` for ${day(g.date)} ${tm(g.date)}` : ""}. Check the news before kickoff${x.subs[0] ? `. <b>${esc(x.subs[0].p.name)}</b> is your backup` : ""}.`});

  });

  if(me && op && hasProj()){

    const oppHurt = (op.starters||[]).map(P).filter(p => !p.empty && (BAD.has(p.inj) || isBye(p)));
    if(oppHurt.length) out.push({tone:"info", go:"matchup", html:`${esc(T.handle || T.name)} is starting <b>${esc(oppHurt[0].name)}</b>, who's ${isBye(oppHurt[0]) ? "on bye" : oppHurt[0].inj.toLowerCase()}. That's free points for you if they don't notice.`});
  }
  const fa = bestAvailable(), need = needs();

    out.push({tone:"info", go:"players", html:`Top pickup: <b>${esc(pick.p.name)}</b> (${pick.p.pos}, ${pick.p.team})${pick.adds ? `, added in ${pick.adds.toLocaleString()} leagues today` : ""}${need.has(pick.p.pos) ? ". Fills a hole for you" : ""}.`});
  }

  if(trades.length){
    const t = trades[0], names = (t.roster_ids||[]).map(r => team(r).handle || team(r).name).join(" and ");

  }

  if(myIdx >= 0 && std.length > 1){
    const first = std[0], meT = std[myIdx];
    out.push({tone:"info", go:"league", html: myIdx === 0 ? `You're in <b>1st place</b> at ${rec(meT)}.` : `You're <b>${ordinal(myIdx+1)}</b> at ${rec(meT)}, ${Math.max(0, first.w - meT.w)} ${first.w - meT.w === 1 ? "game" : "games"} behind ${esc(first.name)}.`});
  }
  return out;
}
const ordinal = n => n + (["th","st","nd","rd"][((n%100)-20)%10] || ["th","st","nd","rd"][n%100] || "th");
function needs(){

function friendlyErr(st, m){
  if(st === 401) return "That API key isn't working. Double-check it in Settings.";
  if(/credit|balance/i.test(m)) return "Your Claude credit balance is out. Add credits at console.anthropic.com.";
  if(st === 404 || /model/i.test(m)) return `That model isn't available on your key. Try the other model in Settings. (${m})`;
  if(st === 429) return "Too many requests at once. Give it a few seconds.";
  if(st >= 500) return "Claude is busy right now. Try again in a moment.";
  return m;
}
async function sendChat(text){
  text = (text || "").trim(); if(!text || S.chatBusy || !S.set.apiKey) return;
  S.chat.push({role:"user", content:text}); S.chatBusy = true; abHold = "thinking"; abApply("thinking", true);
  $("#chText").value = ""; autosize(); renderChat();
  const msgs = S.chat.filter(m => !m.err).slice(-12).map(m => ({role:m.role, content:m.content}));
  const out = {role:"assistant", content:"", streaming:true};
  const req = {model:S.set.model || DEF_SET.model, max_tokens:4096, system:sysPrompt(), messages:msgs};
  const hdrs = {"content-type":"application/json", "x-api-key":S.set.apiKey.trim(), "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"};
  let stopReason = "";
  try{
    const r = await fetch("https://api.anthropic.com/v1/messages", {method:"POST",
      headers:hdrs,
      body:JSON.stringify(Object.assign({}, req, {stream:true}))});
    if(!r.ok){ let m = "Error " + r.status; try{ const d = await r.json(); m = (d.error && d.error.message) || m; }catch(e){} throw new Error(friendlyErr(r.status, m)); }
    S.chat.push(out); renderChat();
    const bubble = [...$("#chLog").querySelectorAll(".msg.a")].pop();
    if(r.body && r.body.getReader){
      const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
      for(;;){
        const {done, value} = await reader.read(); if(done) break;
        buf += dec.decode(value, {stream:true}); let i;
        while((i = buf.indexOf("\n")) >= 0){
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
          if(!line.startsWith("data:")) continue;
          let ev; try{ ev = JSON.parse(line.slice(5)); }catch(e){ continue; }
          if(ev.type === "message_delta" && ev.delta && ev.delta.stop_reason) stopReason = ev.delta.stop_reason;
          else if(ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta" && ev.delta.text){ if(abHold){ abHold = null; abApply(abBase(), true); } out.content += ev.delta.text; bubble.innerHTML = md(out.content); const lg = $("#chLog"); lg.scrollTop = lg.scrollHeight; }
          else if(ev.type === "error") throw new Error(friendlyErr(0, (ev.error && ev.error.message) || "Something went wrong."));
        }
      }
    } else {
      const t = await r.text();
      t.split("\n").forEach(line => { if(line.startsWith("data:")){ try{ const ev = JSON.parse(line.slice(5)); if(ev.delta && ev.delta.text) out.content += ev.delta.text; }catch(e){} } });
    }
    if(!out.content.trim()){
      // Backup plan: ask again without streaming and pull out the text
      const r2 = await fetch("https://api.anthropic.com/v1/messages", {method:"POST", headers:hdrs, body:JSON.stringify(req)});
      if(r2.ok){ const d = await r2.json(); stopReason = d.stop_reason || stopReason;
        out.content = (d.content || []).filter(b => b.type === "text").map(b => b.text).join("").trim(); }
    }
    if(!out.content.trim()){
      const i = S.chat.indexOf(out); if(i >= 0) S.chat.splice(i, 1);
      throw new Error(stopReason === "max_tokens" ? "Audible ran out of room thinking before he could answer. Try a shorter question." : stopReason === "refusal" ? "Audible couldn't answer that one. Try rewording it." : "Audible didn't send an answer (" + (stopReason || "no reason given") + "). Try again, or switch the model in Settings.");
    }
  }catch(e){
    const i = S.chat.indexOf(out); if(i >= 0 && !out.content) S.chat.splice(i, 1);
    S.chat.push({role:"assistant", err:true, content: e instanceof TypeError ? "Couldn't connect to Claude. Check your internet and try again." : (e.message || "Something went wrong.")});
  }
  delete out.streaming; S.chatBusy = false; if(abHold){ abHold = null; abApply(abBase(), true); } saveChat(); renderChat();
}

  sleeping:{e:abSt("M-15 1 Q-10 6 -5 1", AB_D, 3.5) + abSt("M5 1 Q10 6 15 1", AB_D, 3.5), m:abSt("M-4 22 L4 22", AB_D), b:"breathe", dim:1}

let abN = 0, abMood = "normal", abTemp = null, abHold = null;
function abot(cls){
  const id = "abc" + (++abN), M = AB[abMood];
  return `<svg class="abot ${cls || ""} ${abMood === "sleeping" ? "sleep" : ""}" viewBox="-75 -75 150 150" aria-hidden="true"><defs><clipPath id="${id}"><circle r="75"/></clipPath></defs><circle r="75" fill="#3d6af2"/>

<circle cx="0" cy="7" r="40" fill="#f4f5f9"/><path d="M-41 -5 Q-41 -39 0 -39 Q41 -39 41 -5" fill="none" stroke="#16161a" stroke-width="8" stroke-linecap="round"/>
<rect x="-48" y="-9" width="14" height="32" rx="7" fill="#16161a"/><rect x="34" y="-9" width="14" height="32" rx="7" fill="#16161a"/>
<circle cx="0" cy="7" r="30" fill="#0e1220"/><g class="fc b"><g class="ey b">${M.e}</g><g class="mo">${M.m}</g></g>
<path d="M44 20 Q46 41 17 41" fill="none" stroke="#16161a" stroke-width="4.5" stroke-linecap="round"/><rect x="5" y="36.5" width="13" height="9" rx="4.5" fill="#16161a"/>
<circle class="led" cx="41" cy="-3" r="2.2" fill="#30d158" opacity="${M.dim ? .35 : 1}"/>
<path class="zz b" d="M20 -48 L28 -48 L20 -40 L28 -40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="zz zz2 b" d="M31 -52 L37 -52 L31 -46 L37 -46" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</g></g></g></svg>`;
}
function abApply(m, animate){
  if(!AB[m]) m = "normal";
  const changed = m !== abMood; abMood = m;
  document.querySelectorAll(".abot").forEach(svg => {
    const fc = svg.querySelector(".fc"), bd = svg.querySelector(".bd"), led = svg.querySelector(".led");
    const swap = () => { svg.querySelector(".ey").innerHTML = AB[m].e; svg.querySelector(".mo").innerHTML = AB[m].m; };
    if(changed && animate && S.set.celebrate){ fc.style.transform = "scaleY(.06)"; setTimeout(() => { swap(); fc.style.transform = ""; }, 120); }
    else swap();
    bd.setAttribute("class", "bd b"); void bd.getBBox();
    if(AB[m].b && (changed || animate) && S.set.celebrate) setTimeout(() => bd.setAttribute("class", "bd b " + AB[m].b), 30);

  const me = mOf(S.myRid), op = oppOf(me), live = S.games && S.games.some(g => g.state === "in");
