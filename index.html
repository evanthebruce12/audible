  [[FEZ,1],[1-FEZ,1],[0,1],[1,1],[FEZ,0],[1-FEZ,0],[0,0],[1,0]].forEach(([a, c]) => { const q = FP(a, c), w = 1.5 * q.s, h = 3.3 * q.s;
    g += `<rect x="${fN(q.x - w/2)}" y="${fN(q.y - h)}" width="${fN(w)}" height="${fN(h)}" rx=".4" fill="#ff8a1f"/>`; });
  return `<svg class="field" viewBox="0 0 360 ${FVH}" aria-hidden="true"><defs>
    <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c7341"/><stop offset=".55" stop-color="#27904f"/><stop offset="1" stop-color="#34a862"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1224"/><stop offset=".62" stop-color="#080b17"/><stop offset="1" stop-color="#05070d"/></linearGradient>
    <radialGradient id="lts" cx=".5" cy=".46" r=".62"><stop offset="0" stop-color="#7fb2ff" stop-opacity=".2"/><stop offset=".55" stop-color="#5a86e0" stop-opacity=".06"/><stop offset="1" stop-color="#5a86e0" stop-opacity="0"/></radialGradient>
    <radialGradient id="fsh"><stop offset="0" stop-color="#000" stop-opacity=".7"/><stop offset=".7" stop-color="#000" stop-opacity=".3"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="ezsh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity=".07"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gpg"><stop offset="0" stop-color="#ffe45c" stop-opacity=".75"/><stop offset="1" stop-color="#ffd60a" stop-opacity="0"/></radialGradient>
    <linearGradient id="tdg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${esc(co)}" stop-opacity="1"/><stop offset=".5" stop-color="${esc(co)}" stop-opacity=".62"/><stop offset="1" stop-color="${esc(co)}" stop-opacity=".1"/></linearGradient>
    <linearGradient id="tdv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></linearGradient>
    <linearGradient id="ballg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9713d"/><stop offset=".5" stop-color="#8f4e25"/><stop offset="1" stop-color="#5d2e12"/></linearGradient>
    </defs>
    <rect width="360" height="${FVH}" fill="url(#sky)"/>
    <rect width="360" height="${FVH}" fill="url(#lts)"/>
    ${fPost(-.045, 1, "gpl")}
    ${g}
    ${ezText(FEZ/2, "ezot", fName(off), fInk(co))}
    ${ezText(1-FEZ/2, "ezdt", fName(def), fInk(cd))}
    <polygon class="pband" points="" opacity="0"/>
    <polygon class="parrow" points="" opacity="0"/>
    <line class="los" x1="0" x2="0" y1="0" y2="0" stroke="#2f8cff" stroke-width="1.9" stroke-linecap="round" opacity="0"/>
    <line class="fdl" x1="0" x2="0" y1="0" y2="0" stroke="#ffd60a" stroke-width="1.9" stroke-linecap="round" opacity="0"/>
    <polygon class="ezflash" points="${fQuad(1-FEZ,1)}" fill="#fff" opacity="0"/>
    ${fPost(1.045, -1, "gpr")}
    <ellipse class="bshadow" rx="6" ry="1.9" fill="#000" opacity="0"/>
    <path class="trail" d="" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3.4 3.4" stroke-linecap="round" opacity=".8"/>
    <circle class="bglow" r="15" fill="url(#glow)" opacity="0"/>
    <circle class="ring" r="9" fill="none" stroke="#fff" stroke-width="1.6" opacity="0"/>
    <g class="ball" opacity="0">
      <path d="M-7.6 0 Q-4 -4.7 0 -4.7 Q4 -4.7 7.6 0 Q4 4.7 0 4.7 Q-4 4.7 -7.6 0 Z" fill="url(#ballg)" stroke="#2c1508" stroke-width=".7"/>
      <path d="M-5.2 -2.6 Q-4.3 0 -5.2 2.6 M5.2 -2.6 Q4.3 0 5.2 2.6" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".95"/>
      <path d="M-2.6 -1.5 H2.6 M-1.9 -2.5 V-.5 M-.6 -2.6 V-.4 M.6 -2.6 V-.4 M1.9 -2.5 V-.5" fill="none" stroke="#fff" stroke-width=".75" stroke-linecap="round"/>
      <path d="M-5.6 -1.9 Q-2 -4 3 -3.6" fill="none" stroke="#fff" stroke-width=".7" stroke-linecap="round" opacity=".28"/>
    </g>
    <g class="tdbn" opacity="0">
      <rect width="360" height="${FVH}" fill="#06080f"/>
      <rect width="360" height="${FVH}" fill="url(#tdg)"/>
      <g class="tdst">${Array.from({length:13}, (_, i) => `<polygon points="${-70 + i*40},${FVH} ${-40 + i*40},0 ${-22 + i*40},0 ${-52 + i*40},${FVH}" fill="#fff" opacity="${i % 2 ? ".05" : ".085"}"/>`).join("")}</g>
      <rect width="360" height="${FVH}" fill="url(#tdv)"/>
      <text class="tdghost" x="350" y="${fN(FVH*.82)}"></text>
      <text class="tdbig" x="24" y="${fN(FVH*.52)}">TOUCHDOWN</text>
      <rect class="tdrule" x="25" y="${fN(FVH*.6)}" width="150" height="2.4" rx="1.2" fill="#fff"/>
      <text class="tdsub" x="25" y="${fN(FVH*.78)}"></text>
    </g>
    <g class="gain" opacity="0"><g class="gin"><rect class="gbg" x="-26" y="-9.5" width="52" height="19" rx="9.5" fill="rgba(0,0,0,.6)"/><text y="3.7" class="gt2"></text></g></g>
  </svg>`;
}
/* Endzone lettering sits IN the plane of the field, on a frame built from the
   endzone's own edge: the baseline runs exactly parallel to that edge and the
   letters stand square to it, so there is no italic lean fighting the slant.
   The two ends are a 180 degree pair, each reading toward its own endline, the
   way they are actually painted. Glyphs are never stretched - the type is
   sized to the band and spaced out to fill the width, so the strokes stay the
   weight the typeface drew them. */
const EZW = {I:.30,J:.58,M:.93,W:.95,L:.62,T:.65,F:.60,E:.63,S:.66,A:.72,B:.70,C:.72,
             D:.74,G:.77,H:.77,K:.70,N:.77,O:.79,P:.68,Q:.79,R:.70,U:.75,V:.71,X:.70,
             Y:.68,Z:.63," ":.26,"1":.52,"4":.66,"9":.66};
const ezNat = t => [...t].reduce((n, c) => n + (EZW[c] || .70), 0);
function ezFit(a, txt){
  const t = String(txt == null ? "" : txt).toUpperCase(), n = Math.max(1, t.length);
  const P0 = FP(a, 0), P1 = FP(a, 1), flip = a > .5;
  /* baseline along the endzone's own edge, each end reading toward its endline */
  let ux = flip ? P1.x - P0.x : P0.x - P1.x;
  let uy = flip ? P1.y - P0.y : P0.y - P1.y;
  const depth = Math.hypot(ux, uy); ux /= depth; uy /= depth;
  const nx = -uy, ny = ux;                       /* square to it, never sheared */
  /* centre on the real screen midpoint of the two sidelines, not FP(a,.5):
     perspective puts that point well off centre. */
  const cx0 = (P0.x + P1.x) / 2, cy0 = (P0.y + P1.y) / 2;
  /* the band's two edges converge, so fit inside the tighter of each pair */
  let lo = -1e9, hi = 1e9;
  for(const e of [-FEZ/2, FEZ/2]) for(const c of [0, 1]){
    const q = FP(a + e, c), d = (q.x - cx0) * nx + (q.y - cy0) * ny;
    if(e < 0 === !flip){ if(d > lo) lo = d; } else { if(d < hi) hi = d; }
  }
  const yc = (lo + hi) / 2, half = (hi - lo) / 2;
  const span = depth * .76;                      /* paint stops short of both sidelines */
  let size = half * 2 * .86 / 1.3;               /* cap block against the 10-yard band */
  const nat = ezNat(t) || 1;
  if(nat * size > span) size = span / nat;
  const gap = n > 1 ? Math.max(0, Math.min(size * .34, (span - nat * size) / (n - 1))) : 0;
  const ox = cx0 + nx * yc + ux * gap / 2, oy = cy0 + ny * yc + uy * gap / 2;
  return {m: `matrix(${fN3(ux)} ${fN3(uy)} ${fN3(nx)} ${fN3(ny)} ${fN(ox)} ${fN(oy)})`,
          size: fN(size), ls: fN(gap), t: t};
}
function ezApply(el, a, txt, ink){
  if(!el) return;
  const z = ezFit(a, txt);
  el.textContent = z.t;
  el.setAttribute("transform", z.m);
  el.setAttribute("font-size", z.size);
  el.setAttribute("letter-spacing", z.ls);
  el.setAttribute("fill", ink || "#fff");
}
function ezText(a, cls, txt, ink){
  const z = ezFit(a, txt);
  return `<text class="ezt ${cls}" transform="${z.m}" font-size="${z.size}" letter-spacing="${z.ls}" fill="${ink || "#fff"}" dominant-baseline="central">${esc(z.t)}</text>`;
}

/* a yard line drawn across the field in perspective */
function fLine(el, yte, op){
  if(!el) return;
  if(op === 0){ el.setAttribute("opacity", "0"); return; }
  const A = FP(FA(yte), .006), B = FP(FA(yte), .994);
  el.setAttribute("x1", fN(A.x)); el.setAttribute("y1", fN(A.y));
  el.setAttribute("x2", fN(B.x)); el.setAttribute("y2", fN(B.y));
  el.setAttribute("opacity", op);
}

function orient(svg, off, def){
  if(!svg || !off || !off.abbr) return;
  const co = fCol(off, "#0a84ff"), cd = fCol(def, "#ff453a");
  svg.querySelector(".ezo").setAttribute("fill", co);
  svg.querySelector(".ezd").setAttribute("fill", cd);
  const so = svg.querySelector(".slo"), sd = svg.querySelector(".sld");
  if(so) so.setAttribute("fill", co);
  if(sd) sd.setAttribute("fill", cd);
  /* the fit is baked in, so refit whenever the names change length */
  ezApply(svg.querySelector(".ezot"), FEZ/2, fName(off), fInk(co));
  ezApply(svg.querySelector(".ezdt"), 1 - FEZ/2, fName(def), fInk(cd));
  const c = svg.closest(".trkcard"), dv = c && c.querySelector(".drv"); if(dv) dv.textContent = off.abbr + " driving →";
}
/* The ball is drawn at a ground point plus a height. Its shadow stays on the
   turf and shrinks as it climbs, which is what makes a pass read as being in
   the air rather than sliding up the screen. */
function setBall(svg, a, c, z, rot, k){
  const g = FP(a, c), ball = svg.querySelector(".ball"), sh = svg.querySelector(".bshadow");
  const s = g.s * .8 * (k || 1), lift = Math.max(0, z || 0), up = Math.min(1, lift / 46);
  ball.setAttribute("transform", `translate(${fN(g.x)} ${fN(g.y - lift - 2.6 * g.s)}) rotate(${fN(rot || 0)}) scale(${fN3(s)})`);
  ball.setAttribute("opacity", "1");
  if(sh){
    sh.setAttribute("cx", fN(g.x)); sh.setAttribute("cy", fN(g.y + .4));
    sh.setAttribute("rx", fN(5.6 * g.s * (1 - .42 * up))); sh.setAttribute("ry", fN(1.7 * g.s * (1 - .42 * up)));
    sh.setAttribute("opacity", fN3(.46 * (1 - .62 * up)));
  }
  return {x: g.x, y: g.y - lift - 2.6 * g.s, gx: g.x, gy: g.y, s: g.s};
}
/* the gain, painted on the turf from the line of scrimmage to the ball */
function setBand(svg, a0, a1, col, op){
  const b = svg.querySelector(".pband"), ar = svg.querySelector(".parrow");
  if(!b) return;
  if(!op || Math.abs(a1 - a0) < YD * .6){ b.setAttribute("opacity", "0"); ar.setAttribute("opacity", "0"); return; }
  const d = a1 >= a0 ? 1 : -1, tip = a1, neck = a1 - d * Math.min(Math.abs(a1 - a0), YD * 2.4);
  b.setAttribute("points", fQuad(Math.min(a0, neck), Math.max(a0, neck), .43, .57));
  const A = FP(neck, .34), B = FP(tip, .5), C = FP(neck, .66);
  ar.setAttribute("points", `${fN(A.x)},${fN(A.y)} ${fN(B.x)},${fN(B.y)} ${fN(C.x)},${fN(C.y)}`);
  b.setAttribute("fill", col); ar.setAttribute("fill", col);
  b.setAttribute("opacity", op); ar.setAttribute("opacity", op);
}
function fieldReset(svg){
  svg._tok = (svg._tok || 0) + 1;
  (svg._ts || []).forEach(clearTimeout); svg._ts = [];
  const q = s => svg.querySelector(s);
  q(".gain").setAttribute("opacity", "0"); q(".gain").setAttribute("class", "gain");
  q(".trail").setAttribute("d", "");
  setBand(svg, 0, 0, "", 0);
  const bn = q(".tdbn"); if(bn){ bn.setAttribute("class", "tdbn"); bn.setAttribute("opacity", "0"); }
  const fl = q(".ezflash"); if(fl){ fl.setAttribute("class", "ezflash"); fl.setAttribute("opacity", "0"); }
  const rg = q(".ring"); if(rg){ rg.setAttribute("class", "ring"); rg.setAttribute("opacity", "0"); }
  svg.querySelectorAll(".gp.lit").forEach(n => n.setAttribute("class", n.getAttribute("class").replace(" lit", "")));
  return svg._tok;
}
function placeBall(svg, yte, opts){
  opts = opts || {};
  if(!opts.keep) fieldReset(svg);
  const a = FA(yte), q = setBall(svg, a, .5, 0, 0), gl = svg.querySelector(".bglow");
  gl.setAttribute("cx", fN(q.gx)); gl.setAttribute("cy", fN(q.y)); gl.setAttribute("r", fN(15 * q.s));
  gl.setAttribute("opacity", opts.glow ? ".5" : "0");
  fLine(svg.querySelector(".los"), yte, opts.los ? ".95" : 0);
  fLine(svg.querySelector(".fdl"), yte - (opts.dist || 0), (opts.dist && yte - opts.dist > 0) ? ".95" : 0);
  svg.querySelector(".rz").setAttribute("opacity", yte <= 20 ? ".12" : "0");
}
/* ---- what a play looks like ----
   Turn one line of play-by-play into a flight path. The feed gives the start,
   the end and a sentence; the sentence says a good deal more than it seems:
   which side of the field, short or deep, caught or dropped, wide or blocked.
   Each leg is a start and end on the ground (along, across) plus a height. */
function playPlan(pl){
  const t = pl.text || "", ty = pl.type || "", tr = playTier(pl), k = tr && tr.k;
  const clampA = a => Math.max(FEZ * .2, Math.min(1 - FEZ * .22, a));
  const a0 = FA(pl.s), yds = +pl.yds || 0, td = k === "td";
  const side = /\bright\b/i.test(t) ? 1 : /\bleft\b/i.test(t) ? -1 : 0, deep = /\bdeep\b/i.test(t);
  let a1 = td ? 1 - FEZ * .5 : clampA(FA(pl.e));
  const legs = []; let plate = "", tone = "", fx = "", band = true, home = false, top = false;
  const air = (A0, C0, A1, C1, H, ms, spin) => legs.push({a0:A0, c0:C0, z0:0, a1:A1, c1:C1, z1:0, H, ms, spin:spin == null ? 1 : spin, air:true});
  const run = (A0, C0, A1, C1, ms) => legs.push({a0:A0, c0:C0, z0:0, a1:A1, c1:C1, z1:0, H:0, ms, spin:0});
  const runMs = d => Math.min(1250, 380 + Math.abs(d) / YD * 19), airMs = d => Math.min(1150, 500 + Math.abs(d) / YD * 21);
  const dist = +((t.match(/(\d+)\s*-?\s*yard field goal/i) || [])[1] || 0);
  if(k === "fg" || k === "fgx"){
    /* the posts face the camera, so "through the uprights" is between them in x */
    const G = fPostGeo(1.045, -1), aP = fAofX(G.nx), zP = FP(aP, .5).y - (G.ny - G.up * .52);
    const H = 15 + Math.min(18, (aP - a0) / YD * .22), ms = 1050 + Math.min(450, (aP - a0) / YD * 9);
    band = false; top = true;
    if(k === "fg"){
      legs.push({a0, c0:.5, z0:0, a1:aP, c1:.5, z1:zP, H, ms, spin:3, air:true});
      plate = (dist ? dist + " YD " : "") + "FIELD GOAL · GOOD"; tone = "good"; fx = "posts";
    } else {
      const blocked = /block/i.test(t), short = /\bshort\b/i.test(t), post = /upright|crossbar/i.test(t);
      if(blocked){
        legs.push({a0, c0:.5, z0:0, a1:a0 + YD * 2.2, c1:.5, z1:7, H:3, ms:300, spin:1, air:true});
        legs.push({a0:a0 + YD * 2.2, c0:.5, z0:7, a1:a0 - YD * 4, c1:.66, z1:0, H:9, ms:620, spin:2, air:true});
        plate = "NO GOOD · BLOCKED";
      } else if(short){
        legs.push({a0, c0:.5, z0:0, a1:aP - YD * 7, c1:.5, z1:0, H:H * .8, ms, spin:3, air:true});
        plate = "NO GOOD · SHORT";
      } else if(post){
        const sx = side < 0 ? -1 : 1, aU = fAofX(G.nx + sx * G.W);
        legs.push({a0, c0:.5, z0:0, a1:aU, c1:.5, z1:zP, H, ms, spin:3, air:true});
        legs.push({a0:aU, c0:.5, z0:zP, a1:aU - YD * 6, c1:.5 + .14 * sx, z1:0, H:4, ms:560, spin:2, air:true});
        plate = "NO GOOD · OFF THE UPRIGHT";
      } else {
        const sx = side < 0 ? -1 : 1, aW = fAofX(G.nx + sx * (G.W + 7.5 * G.s));
        legs.push({a0, c0:.5, z0:0, a1:aW, c1:.5, z1:zP * 1.04, H, ms, spin:3, air:true});
        plate = "NO GOOD" + (side ? " · WIDE " + (side < 0 ? "LEFT" : "RIGHT") : "");
      }
      tone = "bad"; fx = "miss";
    }
  } else if(/punt/i.test(ty) || /\bpunts\b/i.test(t)){
    const d = +((t.match(/punts (\d+) yard/i) || [])[1] || 0);
    a1 = clampA(a0 + YD * (d || 40)); band = false; top = true;
    legs.push({a0, c0:.5, z0:0, a1, c1:.5 + side * .16, z1:0, H:24 + Math.min(10, (d || 40) * .16), ms:1250 + (d || 40) * 6, spin:2.5, air:true});
    plate = "PUNT" + (d ? " · " + d + " YDS" : ""); tone = "";
  } else if(/kickoff/i.test(ty) || /\bkicks \d+ yard/i.test(t)){
    const d = +((t.match(/kicks (\d+) yard/i) || [])[1] || 0);
    a1 = clampA(a0 + YD * (d || 60)); band = false; top = true;
    legs.push({a0, c0:.5, z0:0, a1, c1:.5, z1:0, H:30, ms:1500, spin:2.5, air:true});
    plate = /touchback/i.test(t) ? "KICKOFF · TOUCHBACK" : "KICKOFF"; tone = "";
  } else if(/\bsack/i.test(t)){
    run(a0, .5, a1, .5 + side * .1, runMs(a1 - a0) * .9);
    plate = "SACK" + (yds ? " · " + (yds > 0 ? "+" : "−") + Math.abs(yds) : ""); tone = "bad"; fx = "hit";
  } else if(/incomplete/i.test(t)){
    const aT = clampA(a0 + YD * (deep ? 24 : 9)), cT = .5 + side * .24;
    air(a0, .5, aT, cT, deep ? 22 : 11, airMs(aT - a0));
    legs.push({a0:aT, c0:cT, z0:0, a1:aT + YD * 1.6, c1:cT + side * .03, z1:0, H:3.2, ms:260, spin:.6, air:true});
    plate = "INCOMPLETE"; tone = "mute"; band = false; home = true;
  } else if(k === "turn" && /INTERCEPTED/i.test(t)){
    const aT = clampA(a0 + YD * (deep ? 22 : 10)), cT = .5 + side * .24;
    air(a0, .5, aT, cT, deep ? 22 : 11, airMs(aT - a0));
    plate = "INTERCEPTED"; tone = "bad"; fx = "turn"; band = false;
  } else if(/\bpass\b/i.test(t) || /pass/i.test(ty)){
    const cT = .5 + side * .23;
    let airY = deep ? Math.max(yds * .72, Math.min(yds, 16)) : Math.min(yds, /screen|behind/i.test(t) ? 0 : 6);
    if(yds - airY < 2.5 || td && yds < 12) airY = yds;
    const aC = td && airY === yds ? a1 : clampA(a0 + YD * airY);
    air(a0, .5, aC, cT, Math.min(30, 8 + Math.abs(airY) * .55) * (td ? 1.1 : 1), airMs(aC - a0) * (td ? 1.12 : 1));
    if(Math.abs(a1 - aC) > YD * 1.5) run(aC, cT, a1, cT + (.5 - cT) * .45, runMs(a1 - aC) * (td ? 1.1 : 1));
  } else {
    const cT = .5 + side * .15 * (/end\b/i.test(t) ? 1.5 : 1);
    run(a0, .5, a1, cT, runMs(a1 - a0) * (td ? 1.15 : 1));
  }
  if(k === "turn" && /FUMBLES/i.test(t)){
    const L = legs[legs.length - 1];
    legs.push({a0:L.a1, c0:L.c1, z0:0, a1:clampA(L.a1 + YD * 1.6), c1:L.c1 + .14, z1:0, H:6.5, ms:420, spin:2, air:true});
    plate = "FUMBLE LOST"; tone = "bad"; fx = "turn";
  }
  if(k === "turn" && /safety/i.test(t) && !plate){ plate = "SAFETY"; tone = "bad"; fx = "turn"; }
  if(td){ plate = "TOUCHDOWN"; tone = "good"; fx = "td"; }
  if(!plate){
    const first = pl.dist && yds >= pl.dist && !td;
    plate = (yds > 0 ? "+" + yds + " YDS" : yds < 0 ? "−" + Math.abs(yds) + " YDS" : "NO GAIN") + (first && yds < 20 ? " · 1ST DOWN" : "");
    tone = yds >= 20 ? "hot" : first ? "first" : yds < 0 ? "bad" : "";
    if(yds >= 40) fx = "boom"; else if(yds >= 20) fx = "pop";
  }
  if(/\bPENALTY\b/.test(t) && /no play/i.test(t)){ plate = "PENALTY"; tone = "first"; fx = ""; }
  if(!legs.length) run(a0, .5, a1, .5, 400);
  return {legs, plate, tone, fx, band, home, top, td, tr};
}
const PLATE = {good:"rgba(40,190,84,.96)", bad:"rgba(255,69,58,.96)", hot:"rgba(255,149,10,.97)", first:"rgba(255,214,10,.97)", mute:"rgba(84,84,92,.92)", "":"rgba(12,14,22,.82)"};

function animPlay(svg, pl){
  if(!svg || pl.s == null || pl.e == null) return;
  orient(svg, pl.team, pl.def);
  placeBall(svg, pl.s, {los:true, dist:pl.dist});
  const tok = svg._tok, P = playPlan(pl), reduce = !S.set.celebrate;
  const q = s => svg.querySelector(s), later = (f, ms) => svg._ts.push(setTimeout(() => { if(svg._tok === tok) f(); }, ms));
  const trail = q(".trail"), gl = q(".bglow"), col = fCol(pl.team, "#0a84ff");
  const bandCol = P.tone === "bad" ? "#ff453a" : col, L0 = P.legs[0], LN = P.legs[P.legs.length - 1];
  const zAt = (L, e) => L.z0 + (L.z1 - L.z0) * e + L.H * 4 * e * (1 - e);
  const finish = pos => {
    const lastAir = LN.z1 > 1;
    gl.setAttribute("cx", fN(pos.gx)); gl.setAttribute("cy", fN(pos.y)); gl.setAttribute("r", fN((P.td ? 20 : 15) * pos.s));
    gl.setAttribute("opacity", P.td ? "1" : P.fx === "boom" || P.fx === "posts" ? ".75" : P.fx ? ".5" : ".3");
    q(".rz").setAttribute("opacity", pl.e <= 20 && !P.td && P.band ? ".12" : "0");
    const px = P.top ? 180 : pos.x, py = P.top ? 15 : (lastAir ? pos.y - 15 : pos.y - 14);
    const ring = q(".ring");
    if(P.fx && P.fx !== "td" && ring && !reduce){
      ring.setAttribute("cx", fN(pos.x)); ring.setAttribute("cy", fN(pos.y));
      ring.setAttribute("stroke", P.tone === "bad" ? "#ff453a" : P.fx === "posts" ? "#ffd60a" : "#fff");
      ring.setAttribute("class", "ring"); void ring.getBBox(); ring.setAttribute("class", "ring go");
    }
    if(P.fx === "posts" && !reduce){ const gp = q(".gpr"); if(gp) gp.setAttribute("class", "gp gpr lit"); abFlash("hyped", 2000); }
    if(P.td && !reduce){
      const flash = q(".ezflash"); flash.setAttribute("class", "ezflash"); void flash.getBBox(); flash.setAttribute("class", "ezflash lit");
      abFlash("hyped", 2800);
      /* ESPN drops a graphic over the whole card for a beat, then gives the
         field back. Same idea: team colour, speed stripes, the word, the team. */
      const bn = q(".tdbn");
      svg.querySelectorAll("#tdg stop").forEach(st => st.setAttribute("stop-color", col));
      const gh = bn.querySelector(".tdghost"), nm = fName(pl.team);
      gh.textContent = nm; gh.style.fontSize = Math.min(60, Math.round(196 / (Math.max(3, nm.length) * .66))) + "px";
      bn.querySelector(".tdsub").textContent = [(pl.team && pl.team.abbr) || "", pl.q ? "Q" + pl.q : "", pl.clock || ""].filter(Boolean).join("  ·  ");
      later(() => { bn.setAttribute("class", "tdbn run"); }, 420);
      later(() => { bn.setAttribute("class", "tdbn"); bn.setAttribute("opacity", "0"); showPlate(svg, P, px, py); }, 420 + 2600);
    } else showPlate(svg, P, px, py);
    if(P.home && !reduce) later(() => { setBall(svg, FA(pl.e), .5, 0, 0); gl.setAttribute("opacity", "0"); trail.setAttribute("d", ""); }, 1300);
  };
  if(reduce){
    const pos = setBall(svg, LN.a1, LN.c1, LN.z1, 0);
    if(P.band) setBand(svg, L0.a0, LN.a1, bandCol, ".68");
    finish(pos); return;
  }
  let li = 0, t0 = performance.now(), d = "", pos = null, pen = false;
  const step = now => {
    if(svg._tok !== tok) return;
    const L = P.legs[li], k = Math.min(1, (now - t0) / L.ms);
    /* a thrown or kicked ball holds its speed; a runner gets going and pulls up */
    const e = L.air ? k : (k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
    const a = L.a0 + (L.a1 - L.a0) * e, c = L.c0 + (L.c1 - L.c0) * e, z = zAt(L, e);
    const fwd = L.a1 >= L.a0 ? 1 : -1;
    const rot = L.air ? (L.spin >= 2 ? fwd * k * 360 * L.spin : fwd * (-22 + 44 * e)) : 0;
    pos = setBall(svg, a, c, z, rot, 1 + (L.air ? .22 * Math.min(1, z / 30) : 0));
    if(L.air){ d += (pen ? " L" : " M") + `${fN(pos.x)} ${fN(pos.y)}`; pen = true; trail.setAttribute("d", d); } else pen = false;
    if(P.band) setBand(svg, L0.a0, a, bandCol, ".68");
    if(k < 1){ requestAnimationFrame(step); return; }
    if(++li < P.legs.length){ t0 = now; requestAnimationFrame(step); return; }
    finish(pos);
  };
  requestAnimationFrame(step);
}

/* ---- how much a play actually matters ----
   One "big" flag treated a 21-yard catch and a 60-yard touchdown the same.
   Rank them so the list has a hierarchy and the replay can give the big ones
   a real moment. */
function playTier(pl){
  const t = pl.text || "", y = Math.abs(pl.yds || 0);
  const nullified = /nullified|no play/i.test(t);
  if(!nullified && /touchdown/i.test(t))                       return {k:"td",   lbl:"TD",        cls:"g", rank:5};
  if(!nullified && /INTERCEPTED/i.test(t))                     return {k:"turn", lbl:"INT",       cls:"r", rank:4};
  if(!nullified && /FUMBLES/i.test(t) && /recovered by/i.test(t)) return {k:"turn", lbl:"Fumble",  cls:"r", rank:4};
  if(/field goal/i.test(t) && !nullified){
    const d = +((t.match(/(\d+)\s*-?\s*yard field goal/i) || [])[1] || 0);
    if(/no good|missed|blocked/i.test(t)) return {k:"fgx", lbl:/block/i.test(t) ? "FG blocked" : "FG missed", cls:"r", rank:3};
    if(/good/i.test(t)) return {k:"fg", lbl:d ? d + " yd FG" : "FG", cls:"b", rank:d >= 50 ? 4 : 3};
  }
  if(/safety/i.test(t) && !nullified)                          return {k:"turn", lbl:"Safety",    cls:"r", rank:4};
  if(/sack/i.test(t) && y >= 8)                                return {k:"sack", lbl:"Big sack",  cls:"r", rank:2};
  if(y >= 40)                                                  return {k:"exp",  lbl:"Explosive", cls:"o", rank:4};
  if(y >= 20)                                                  return {k:"chunk",lbl:"Big play",  cls:"o", rank:3};
  if(/4th down/i.test(t) && /converted|1st down/i.test(t))     return {k:"4th",  lbl:"4th down",  cls:"o", rank:3};
  return null;
}
function shortPlay(t){ return t.replace(/\(.*?shotgun.*?\)\s*/i, "").replace(/\s*\([^)]*\)\s*$/, "").replace(/^\(\d+:\d+ - \d\w+\)\s*/, "").slice(0, 120); }
function playRows(list, p, re){
  return list.map((pl, i) => {
    const pp = p ? playPts(p, pl, re) : null, tr = playTier(pl);
    const cls = "play" + (tr ? " big t-" + tr.k : "");
    return `<button class="${cls}" data-play="${i}"><div class="pq">Q${esc(pl.q)}<br>${esc(pl.clock)}</div><div class="pt">${tr ? `<span class="tag ${tr.cls}">${esc(tr.lbl)}</span> ` : ""}${esc(shortPlay(pl.text))}</div>
      <div class="pr"><b class="num">${pl.yds > 0 ? "+" : ""}${pl.yds}</b><small>yds</small>${pp && pp.pts ? `<span class="${pp.pts > 0 ? "green" : "red"} num">${pp.pts > 0 ? "+" : ""}${f1(pp.pts)}</span>` : ""}</div></button>`;
  }).join("");
}

const tcol = (sum, a, fb) => { const c = (sum.byAbbr[a] || {}).color; return c && !/^#(000000|111111)$/i.test(c) ? c : fb; };
function gameDress(g, sum){

function gameExtras(g, sum, part){

/* the service worker serves the shell from cache, so a new build lands quietly.
   Say so rather than leaving them on an old version without knowing. */
const SHELL_CACHE = "audible-shell-v15";   /* keep in step with sw.js */
/* The shell is served from cache, so without this a new build would not show
   up until the launch after next. The launch animation gives us two seconds
   of cover: fetch the live copy, and if the version moved, write it into the
   cache and reload right then. The user sees one ordinary launch. */
async function checkUpdate(){
  try{
    const r = await fetch("index.html?fresh=" + Date.now(), {cache: "no-store"});
    if(!r.ok) return;
    const t = await r.text();
    const m = t.match(/const VERSION = "([0-9.]+)"/);
    if(!m || m[1] === VERSION) return;
    try{
      const c = await caches.open(SHELL_CACHE);
      const mk = () => new Response(t, {headers: {"content-type": "text/html; charset=utf-8"}});
      await c.put(new Request("index.html"), mk());
      await c.put(new Request("./"), mk());
    }catch(e){}
    if(!bootDone){ location.reload(); return; }          /* still on the splash: swap now */
    if(S.updPrompted) return;
    S.updPrompted = true;
    const el = toast("Audible " + m[1] + " is ready. Tap to update.");
    if(el){ el.style.cursor = "pointer"; el.addEventListener("click", () => location.reload(), {once: true}); }
  }catch(e){}
}

  $$("nav button[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  homeBadge();
  { const nb = $("#navBot"); if(nb && !nb.firstChild) nb.innerHTML = abot("a28"); $("#navLgName").textContent = S.league.name || ""; $("#navLgSub").textContent = "Week " + S.week + (S.leagues && S.leagues.length > 1 ? " · switch" : ""); }
  $("#miniTitle").textContent = TITLES[S.tab] || "";
  const v = {home:vHome, matchup:vMatchup, team:vTeam, players:vPlayers, league:vLeague}[S.tab] || vHome;
  const y = window.scrollY, app = $("#app");
  app.innerHTML = v();
  if(anim){ app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter"); window.scrollTo(0, 0); }
  else window.scrollTo(0, y);
  bind();
  const fb = $("#fab"); if(fb && !fb.firstChild) fb.innerHTML = abot("");
  abRefresh(); segPills(); titleFx(scrollY); navBubble();
}
function head(title, sub){ return `<h1 class="lt">${title}</h1><div class="sub">${sub || ""}</div>`; }
function liveSub(){
  const live = S.games && S.games.some(g => g.state === "in") && isCur();
  return `${live ? '<i class="livedot"></i>Live · ' : ""}${esc(S.league.name)} · Week ${S.week}`;
}
/* A row that just produced something should say so, otherwise you have to
   open every player to find out who did. Week stats are already loaded, so
   this costs nothing. */
function bigBadge(p){
  if(!p || p.empty) return "";
  const w = (S.wstats && S.wsW === S.week) ? S.wstats[p.id] : null;
  if(!w) return "";
  const td = (+w.pass_td || 0) + (+w.rush_td || 0) + (+w.rec_td || 0) + (+w.def_td || 0);
  if(td) return `<span class="bp td">${td > 1 ? td + " TD" : "TD"}</span>`;
  const lng = Math.max(+w.fgm_lng || 0, 0);
  if((+w.fgm || 0) && lng >= 50) return `<span class="bp fg">${lng} FG</span>`;
  if((+w.fum_rec || 0) || (+w.int || 0)) return `<span class="bp to">TO</span>`;
  return "";
}
function tRow(p, slot, pts, lvl){
  const s = p.empty ? "" : gState(p), pr = proj(p.id);
  return `<button class="trow ${lvl || ""}" ${p.empty ? "" : `data-p="${esc(p.id)}"`}>${slot ? `<div class="slot">${SLBL[slot] || slot}</div>` : ""}${hs(p)}
    <div class="i"><div class="t1 ${p.empty ? "red" : ""}">${esc(p.empty ? "Empty slot" : p.name)}${stBadge(p)}${bigBadge(p)}${!p.empty && hasNews(p) ? '<i class="ndot" title="New news"></i>' : ""}</div><div class="t2 ${s === "in" ? "live-g" : ""}">${p.empty ? "Tap Edit lineup to fill" : esc(p.pos) + " · " + esc(gameLine(p))}</div></div>
    <div class="r">${p.empty ? "" : `<b>${s === "pre" && !pts ? "–" : f1(pts || 0)}</b>${pr != null ? `<small>proj ${f1(pr)}</small>` : ""}`}</div></button>`;
}

/* ---- Today ---- */
function vHome(){
  const d = new Date().toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"});
  let h = head("Today", esc(d)), side = "";
  const ins = insights();
  h += `<div class="bot"><button class="hd" id="botHd" style="width:100%;text-align:left">${abot("a40")}<div style="flex:1;min-width:0"><b>${esc(S.set.botName)}</b><span>Week ${S.state.week} briefing · ${esc(S.league.name)}</span></div>${CHEV}</button>
    ${ins.map(i => `<button class="ins" data-go="${i.go}"><i class="dot ${i.tone}"></i><span class="tx">${i.html}</span></button>`).join("") || `<div class="empty">Nothing to flag right now.</div>`}
    <button class="aibtn" id="askBtn">Ask ${esc(S.set.botName)} anything</button></div>`;
  const me = mOf(S.myRid), op = oppOf(me);
  if(me && isCur()){
    /* everyone of yours in a game right now: starters first, then bench */
    const st = me.starters || [], seen = new Set(st);
    const r = S.rosters.find(x => x.roster_id === S.myRid) || {};
    const live = st.map((id, i) => ({p:P(id), pts:(me.starters_points || [])[i], slot:slots()[i]}))
      .concat((r.players || []).filter(id => !seen.has(id)).map(id => ({p:P(id), pts:weekPts(id), slot:"BN"})))
      .filter(x => !x.p.empty && gState(x.p) === "in" && !sidelined(x.p));
    if(live.length) h += `<div class="sec"><h2>On the field</h2><span class="sm" style="color:var(--red);font-weight:600">● Live</span></div><div class="grp">${live.map(x => tRow(x.p, x.slot, x.pts)).join("")}</div>`;
  }
  if(me) h += `<div class="sec"><h2>Your matchup</h2><button data-go="matchup">See all</button></div>` + scoreBug(me, op, true);
  if(S.games && S.games.length){
    const own = ownerMap(), mine = {};
    Object.keys(own).forEach(id => { if(own[id] === S.myRid){ const q = P(id); if(q.team && !sidelined(q)) mine[q.team] = (mine[q.team] || 0) + 1; } });
    const ord = {in:0, pre:1, post:2};
    const sorted = [...S.games].sort((a,b) => (ord[a.state] - ord[b.state]) || (a.date - b.date));
    side += `<div class="sec"><h2>NFL · Week ${S.week}</h2></div><div class="rail">${sorted.map(g => gameCard(g, (mine[g.home.abbr] || 0) + (mine[g.away.abbr] || 0))).join("")}</div>`;
  }
  const tx = (S.tx || []).slice(0, 4);
  let tail = "";
  if(tx.length) tail += `<div class="sec"><h2>League activity</h2><button data-go="league" data-seg="activity">See all</button></div><div class="grp">${tx.map(txCell).join("")}</div>`;
  tail += `<div class="btns"><a class="btn gray" href="https://sleeper.com/leagues/${S.league.league_id}/trades" target="_blank" rel="noopener">Check trade offers in Sleeper</a></div>`;
  if(DOCK()) h += tail; else side += tail;
  const cut = h.indexOf('<div class="bot">');
  return h.slice(0, cut) + dash(h.slice(cut), side);
}
function gameCard(g, mineN){
  const done = g.state === "post", aw = g.away.score > g.home.score, hw = g.home.score > g.away.score;
  const row = (s, lose) => `<div class="gr ${done && lose ? "l" : ""}">${s.logo ? `${imgTag(esc(s.logo))}` : ""}<span class="ab">${esc(s.abbr)}</span>${g.state !== "pre" ? `<span class="s">${s.score}</span>` : `<span class="xs c2">${esc(s.rec)}</span>`}</div>`;
  const status = g.state === "in" ? `<span class="live">${esc(g.detail)}</span>` : g.state === "post" ? "Final" : `${day(g.date)} ${tm(g.date)}`;
  return `<button class="game" data-g="${esc(g.id)}" style="text-align:left">${row(g.away, hw)}${row(g.home, aw)}<div class="gs"><span>${status}</span><span>${g.state === "pre" ? esc(g.odds) : esc(g.net)}</span></div>${mineN ? `<div class="mine">${mineN} of your players</div>` : ""}</button>`;
}

/* ---- score bug ---- */
function wpField(wp, A, B){
  const ini = T => esc((T.name || "").replace(/[^A-Za-z0-9 ]/g, "").split(" ").filter(Boolean).map(w => w[0]).join("").slice(0, 3).toUpperCase() || "—");
  const x = Math.max(3, Math.min(97, wp * 100));
  const ticks = [10,20,30,40,50,60,70,80,90].map(v => `<i class="yl" style="left:${v}%"></i>`).join("");
  const nums = [10,20,30,40,50,40,30,20,10].map((n, i) => `<span style="left:${(i + 1) * 10}%">${n}</span>`).join("");
  return `<div class="fld" role="img" aria-label="Win probability: ${esc(A.name)} ${pct(wp)}, ${esc(B.name)} ${pct(1 - wp)}"><div class="ez a">${av(A, "ez-av")}</div><div class="turf"><b class="side a" style="width:${x}%"></b><b class="side b" style="left:${x}%"></b>${ticks}<div class="hash"></div><div class="nums">${nums}</div><i class="los" style="left:${x}%"></i><i class="ball" style="left:${x}%"></i></div><div class="ez b">${av(B, "ez-av")}</div></div>`;
}
function scoreBug(a, b, link){
  const A = team(a.roster_id), B = b ? team(b.roster_id) : null;
  const ap = a.points || 0, bp = b ? (b.points || 0) : 0;
  const oa = teamOutlook(a), ob = b ? teamOutlook(b) : null, wp = hasProj() && b ? winProb(oa, ob) : null;
  const line = (T, p, o, lose, id) => `<div class="brow">${av(T, "l" + (wp != null ? (id === "scA" ? " ring-a" : " ring-b") : ""))}<div class="bi"><div class="nm">${esc(T.name)}</div><div class="rec">${rec(T)}${o && hasProj() ? ` · proj ${f1(o.proj)}` : ""}</div></div><span class="sc ${lose ? "lose" : ""}" ${link ? "" : `id="${id}"`}>${f2(p)}</span></div>`;
  return `<div class="bug" ${link ? `data-go="matchup"` : ""}>${line(A, ap, oa, b && ap < bp, "scA")}${B ? line(B, bp, ob, bp < ap, "scB") : `<div class="brow"><div class="bi"><div class="nm c2">Bye week</div></div></div>`}${wp != null ? `<div class="wp"><div class="lbls"><span class="green">${pct(wp)}</span><span class="c2">Win probability</span><span style="color:var(--blue)">${pct(1-wp)}</span></div>${wpField(wp, A, B)}</div>` : ""}</div>`;
}

/* ---- Matchup ---- */
function mCell(id, pts, right){
  const p = P(id), pr = proj(id), s = p.empty ? "" : gState(p);
  const [g1, g2] = p.empty ? ["", ""] : gameParts(p);
  return `<div class="mp ${right ? "r" : ""} ${s === "post" ? "done" : s === "in" ? "live" : ""}" ${p.empty ? "" : `data-p="${esc(id)}"`}>${hs(p)}<div class="i"><div class="n"><span class="nm">${esc(shortName(p))}</span>${stBadge(p)}${!p.empty && hasNews(p) ? '<i class="ndot" title="New news"></i>' : ""}</div><div class="g">${esc(g1)}</div>${g2 ? `<div class="g g2">${esc(g2)}</div>` : ""}</div>
    <div class="pts">${p.empty ? "" : `<b>${s === "pre" && !pts ? "–" : f1(pts)}</b>${pr != null ? `<small>${f1(pr)}</small>` : ""}`}</div></div>`;
}
function matchupBody(a, b){
  let h = scoreBug(a, b, false);
  h += `<div class="sec"><h2>Starters</h2>${hasProj() ? '<span class="xs c3">Small number = projection</span>' : ""}</div><div class="grp">`;
  slots().forEach((slot, i) => {
    const aid = (a.starters || [])[i], bid = b ? (b.starters || [])[i] : null;
    h += `<div class="mrow" data-a="${esc(aid)}">${mCell(aid, (a.starters_points || [])[i], false)}<div class="slot">${SLBL[slot] || slot}</div>${b ? mCell(bid, (b.starters_points || [])[i], true) : "<div></div>"}</div>`;
  });
  h += `</div>`;
  if(S.set.showBench){
    const ba = benchOf(a.roster_id), bb = b ? benchOf(b.roster_id) : [], n = Math.max(ba.length, bb.length);
    if(n){
      h += `<div class="sec"><h2>Bench</h2></div><div class="grp">`;
      for(let i = 0; i < n; i++){
        const x = ba[i], y = bb[i];
        h += `<div class="mrow">${x ? mCell(x.id, (a.players_points || {})[x.id], false) : "<div></div>"}<div class="slot">BN</div>${y ? mCell(y.id, (b.players_points || {})[y.id], true) : "<div></div>"}</div>`;
      }
      h += `</div>`;
    }
  }
  return h;
}
function vMatchup(){
  let h = head("Matchup", liveSub());
  h += wkCtl("row", S.updated ? "Updated " + tm(S.updated) : "");
  if(!S.myRid) return h + `<div class="empty">Couldn't find your team in this league.</div>`;
  const me = mOf(S.myRid);
  if(!me) return h + `<div class="empty">No matchup for week ${S.week} yet.</div>`;
  const iss = lineupIssues(); let side = "";
  if(iss.length){
    side += `<div class="sec"><h2>Lineup check</h2><a href="https://sleeper.com/leagues/${S.league.league_id}/team" target="_blank" rel="noopener">Edit in Sleeper</a></div><div class="grp">` +
      iss.map(x => `<button class="cell" data-p="${esc(x.p.id)}">${hs(x.p)}<div class="main"><div class="t1">${esc(x.p.name)}${stBadge(x.p)}</div><div class="t2">${SLBL[x.slot] || x.slot} · ${esc(x.why)}</div>
        ${x.subs.length ? `<div class="t2" style="color:var(--${x.level === "bad" ? "red" : x.level === "warn" ? "orange" : "blue"})">${x.level === "tip" ? "Consider" : "Swap in"} ${x.subs.map(s => `${esc(s.p.name)} (${f1(s.v)})`).join(", ")}</div>` : `<div class="t2 orange">No bench option. Check waivers.</div>`}</div></button>`).join("") + `</div>`;
  }
  if(DOCK()) side += `<div class="sec"><h2>Around the league</h2><button data-go="league" data-seg="scores">Standings</button></div>` + scoresList();
  h += dash(matchupBody(me, oppOf(me)), side, true);
  h += `<div class="foot">${+S.set.refresh ? `Scores refresh every ${S.set.refresh} seconds while the app is open.` : "Auto-refresh is off. Tap ↻ to update."} Tap any player for live stats.</div>`;
  return h;
}

/* ---- My Team ---- */
const PORD = "QB RB WR TE K DEF DL LB DB";
function vTeam(){
  if(!S.myRid) return head("My Team", "") + `<div class="empty">Couldn't find your team in this league.</div>`;
  const T = team(S.myRid), r = T.r || {}, m = mOf(S.myRid);
  let h = head("My Team", `${esc(T.name)} · ${rec(T)}`);
  const st = (m && m.starters) || r.starters || [];
  const ptsOf = id => m ? (m.players_points || {})[id] : null;
  const iss = {}; lineupIssues().forEach(x => { if(x.level !== "tip") iss[x.p.id] = x.level; });
  const o = m ? teamOutlook(m) : null, ls = S.league.settings || {};
  const faab = ls.waiver_type === 2 && ls.waiver_budget ? `<div><b>$${ls.waiver_budget - (T.faab || 0)}</b><span>FAAB left</span></div>` : `<div><b>${T.wpos != null ? "#" + T.wpos : "–"}</b><span>Waiver order</span></div>`;
  h += `<div class="summ"><div><b>${m ? f1(m.points) : "–"}</b><span>Wk ${S.week} pts</span></div><div><b>${o && hasProj() ? f1(o.proj) : "–"}</b><span>Projected</span></div><div><b>${Math.round(T.pf)}</b><span>Season PF</span></div>${faab}</div>`;
  const nIss = Object.keys(iss).length + st.filter(id => !id || id === "0").length;
  let side = "";
  h += `<div class="sec"><h2>Starters</h2>${nIss ? `<span class="sm red" style="font-weight:600">${nIss} need${nIss === 1 ? "s" : ""} attention</span>` : `<span class="sm green" style="font-weight:600">All set</span>`}</div>`;
  h += `<div class="grp">${slots().map((slot, i) => { const id = st[i], p = P(id); return tRow(p, slot, ptsOf(id), p.empty ? "bad" : iss[id]); }).join("")}</div>`;
  const bench = benchOf(S.myRid).sort((a,b) => PORD.indexOf(a.pos) - PORD.indexOf(b.pos) || val(b.id) - val(a.id));
  if(bench.length) side += `<div class="sec"><h2>Bench</h2><span class="sm c2">${bench.length}</span></div><div class="grp">${bench.map(p => tRow(p, "BN", ptsOf(p.id))).join("")}</div>`;
  if((r.reserve || []).length) side += `<div class="sec"><h2>Injured reserve</h2></div><div class="grp">${r.reserve.map(id => tRow(P(id), "IR", ptsOf(id))).join("")}</div>`;
  if((r.taxi || []).length) side += `<div class="sec"><h2>Taxi squad</h2></div><div class="grp">${r.taxi.map(id => tRow(P(id), "TX", ptsOf(id))).join("")}</div>`;
  const cutT = h.indexOf('<div class="sec"><h2>Starters</h2>');
  const edit = `<div class="btns"><a class="btn" href="https://sleeper.com/leagues/${S.league.league_id}/team" target="_blank" rel="noopener">Edit lineup in Sleeper</a></div>`;
  /* side by side, the button belongs to the starters column and matches its width */
  h = h.slice(0, cutT) + (DOCK() ? dash(h.slice(cutT) + edit, side) : dash(h.slice(cutT), side) + edit);
  h += `<div class="foot">Tap any player for live stats, game info, and news.</div>`;
  return h;
}

/* ---- Players ---- */
function vPlayers(){
  let h = head("Players", esc(S.league.name));
  const two = DOCK(); if(two && S.seg.players === "news") S.seg.players = "trending";
  const seg = S.seg.players;
  h += `<div class="seg">${[["trending","Trending"],["available","Available"]].concat(two ? [] : [["news","News"]]).map(([k,l]) => `<button data-seg="${k}" class="${seg === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
  if(seg === "news"){
    h += `<div class="chips">${[["mine","My Players"],["league","My League"],["all","All NFL"]].map(([k,l]) => `<button class="chip ${S.seg.news === k ? "on" : ""}" data-nf="${k}">${l}</button>`).join("")}</div>`;
    return h + newsList();
  }
  h += `<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search all players" value="${esc(S.q)}" autocomplete="off" autocorrect="off" spellcheck="false"></div>`;
  h += `<div class="chips">${["ALL","QB","RB","WR","TE","K","DEF"].map(p => `<button class="chip ${S.pos === p ? "on" : ""}" data-pos="${p}">${p}</button>`).join("")}</div>`;
  if(!two) return h + `<div id="plist">${playerList()}</div>`;
  const cutP = h.indexOf('<div class="seg">');
  return h.slice(0, cutP) + dash(h.slice(cutP) + `<div id="plist">${playerList()}</div>`,
    `<div class="sec" style="margin-top:6px"><h2>News</h2></div><div class="chips">${[["mine","My Players"],["league","My League"],["all","All NFL"]].map(([k,l]) => `<button class="chip ${S.seg.news === k ? "on" : ""}" data-nf="${k}">${l}</button>`).join("")}</div>` + newsList());
}
function playerList(){
  const own = ownerMap(), seg = S.seg.players, posOk = p => S.pos === "ALL" || p.pos === S.pos;
  let items = [], note = "";
  if(S.q.trim().length >= 2){
    const q = S.q.trim().toLowerCase();
    items = Object.keys(S.players).filter(id => S.players[id][0].toLowerCase().includes(q)).map(P).filter(posOk)
      .sort((a,b) => (val(b.id) || 0) - (val(a.id) || 0)).slice(0, 40).map(p => ({p}));
  } else if(seg === "trending"){
    if(!S.trendAdd) return `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
    const need = needs();
    items = (S.trendAdd || []).map(t => ({p:P(t.player_id), adds:t.count})).filter(x => x.p.team && posOk(x.p));
    items.forEach(x => x.fit = !own[x.p.id] && x.p.fp.some(f => need.has(f)));
    note = "Most-added across all Sleeper leagues in the last 24 hours.";
  } else {
    items = Object.keys(S.players).filter(id => !own[id]).map(P).filter(p => p.team && posOk(p) && !BAD.has(p.inj))
      .map(p => ({p, v:val(p.id)})).filter(x => x.v > 0).sort((a,b) => b.v - a.v).slice(0, 40);
    note = hasProj() ? "Best free agents by this week's projection." : "Best free agents by points per game.";
  }
  if(!items.length) return `<div class="grp" style="margin-top:12px"><div class="empty">No players here.</div></div>`;
  return `<div class="grp" style="margin-top:12px">${items.map(x => {
    const o = own[x.p.id], ot = o ? team(o) : null, pr = proj(x.p.id), pg = ppg(x.p.id);
    const right = x.adds != null ? `<div class="t1 num" style="font-size:15px">+${kfmt(x.adds)}</div><div class="t2">adds</div>` :
      `<div class="t1 num" style="font-size:15px">${pr != null ? f1(pr) : f1(pg)}</div><div class="t2">${pr != null ? "proj" : "ppg"}</div>`;
    const avail = o ? (o === S.myRid ? `<span class="tag b">Yours</span>` : `<span class="c3">${esc(ot.name)}</span>`) : `<span class="tag g">Free agent</span>`;
    return `<button class="cell" data-p="${esc(x.p.id)}">${hs(x.p)}<div class="main"><div class="t1">${esc(x.p.name)}${stBadge(x.p)}</div><div class="t2">${esc(x.p.pos)} · ${esc(x.p.team || "FA")} · ${avail}${x.fit ? ` <span class="tag o">Need</span>` : ""}</div></div><div class="end">${right}</div></button>`;
  }).join("")}</div>${note ? `<div class="foot">${note}</div>` : ""}`;
}
function newsList(){
  if(!S.news) return `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
  const seg = S.seg.news, own = ownerMap();
  const names = rids => { const n = new Set(); Object.keys(own).forEach(id => { if(!rids || rids.has(own[id])) n.add(P(id).name.toLowerCase()); }); return n; };
  const set = seg === "mine" ? names(new Set([S.myRid])) : seg === "league" ? names(null) : null;
  let items = S.news;
  if(set) items = items.filter(a => a.ath.some(x => set.has(x)) || [...set].some(n => n.length > 6 && (a.h + " " + a.d).toLowerCase().includes(n)));
  return items.length ? `<div class="grp" style="margin-top:12px">${items.slice(0, 40).map(a => `<button class="news" data-art="${artKey(a)}"><div style="flex:1;min-width:0;text-align:left"><h4 style="color:var(--label)">${esc(a.h)}</h4><p>${esc(a.d).slice(0, 140)}</p><p class="c3">${ago(a.t)}</p></div>${a.img ? `<div class="im"><img src="${esc(a.img)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></div>` : ""}</button>`).join("")}</div>`
    : `<div class="empty">No recent stories about ${seg === "mine" ? "your players" : "players in your league"}. Try All NFL.</div>`;
}

/* ---- League ---- */
function scoresList(){
  const byM = {};
  (S.matchups || []).forEach(m => { if(m.matchup_id != null) (byM[m.matchup_id] = byM[m.matchup_id] || []).push(m); });

/* ---- News ---- */
/* =============== sheets =============== */
/* The sheet holds a stack of pages. Opening something while a sheet is already
   up pushes it; Back pops; Done (or the scrim, or a swipe down) closes the lot.
   A page that is covered keeps its real DOM, handlers and scroll position, so
   coming back to a game does not rebuild or refetch it. */
let shStack = [], shCur = null;
const SH_RE = {};                       /* title -> re-render, for pages whose labels go stale */
SH_RE.Settings = () => openSettings();
function shBackBtn(){ $("#shBack").classList.toggle("on", shStack.length > 0); }
function shSwap(dir, mutate){
  const sh = $("#sheet"), b = $("#shBody"), ttl = $("#shTitle");
  if(matchMedia("(prefers-reduced-motion:reduce)").matches || !b.animate){ b.style.minHeight = Math.max(0, sh.offsetHeight - b.offsetTop) + "px"; mutate(); return; }
  sh.querySelectorAll(".shghost").forEach(n => n.remove());
  const h0 = sh.offsetHeight, y = b.scrollTop;
  /* a page that is still loading is short for a moment; hold the sheet at the
     height it already has so the old page can't show through underneath */
  b.style.minHeight = Math.max(0, h0 - b.offsetTop) + "px";
  const g = b.cloneNode(true);
  g.removeAttribute("id"); g.querySelectorAll("[id]").forEach(n => n.removeAttribute("id"));
  g.className = "sb shghost"; g.style.top = b.offsetTop + "px"; g.setAttribute("aria-hidden", "true");
  mutate();
  sh.classList.add("nav"); sh.classList.toggle("back", dir < 0);
  sh.appendChild(g); g.scrollTop = y;
  const h1 = sh.offsetHeight, D = 440, E = "cubic-bezier(.32,.72,0,1)";
  b.animate(dir > 0 ? [{transform:"translateX(100%)"}, {transform:"translateX(0)"}]
                    : [{transform:"translateX(-28%)", opacity:.35}, {transform:"translateX(0)", opacity:1}], {duration:D, easing:E});
  const out = g.animate(dir > 0 ? [{transform:"translateX(0)", opacity:1}, {transform:"translateX(-28%)", opacity:.35}]
                                : [{transform:"translateX(0)"}, {transform:"translateX(100%)"}], {duration:D, easing:E, fill:"forwards"});
  if(h1 !== h0 && !sheetBase) sh.animate([{transform:`translateY(${h1 - h0}px)`}, {transform:"translateY(0)"}], {duration:D, easing:E});
  ttl.animate([{opacity:0, transform:`translateX(${dir * 22}px)`}, {opacity:1, transform:"translateX(0)"}], {duration:D, easing:E});
  const done = () => { g.remove(); if(!sh.querySelector(".shghost")) sh.classList.remove("nav", "back"); };
  out.onfinish = done; out.oncancel = done;
  sheetSettling(D + 60);                 /* nothing rebuilds while the pages are moving */
}
function openSheet(title, body, keep){
  const sh = $("#sheet"), b = $("#shBody"), open = sh.classList.contains("on");
  if(!keep){ S.sheetPid = null; S.sheetGid = null; S.sheetArt = null; }
  const st = {title, pid:S.sheetPid || null, gid:S.sheetGid || null, art:S.sheetArt || null};
  if(open && shCur && shCur.title === title && shCur.pid === st.pid && shCur.gid === st.gid && shCur.art === st.art){
    /* the same page drawing itself again: stay put, keep the scroll */
    const y = b.scrollTop; b.innerHTML = body; b.scrollTop = y; shCur = st; bindSheet(); return;
  }
  if(open && shCur){
    const prev = shCur;
    shSwap(1, () => {
      const frag = document.createDocumentFragment(), y = b.scrollTop;
      while(b.firstChild) frag.appendChild(b.firstChild);
      shStack.push({st:prev, frag, y, scrolled:sh.classList.contains("scrolled")});
      if(shStack.length > 8) shStack.shift();
      $("#shTitle").textContent = title; b.innerHTML = body; b.scrollTop = 0; sh.classList.remove("scrolled");
    });
    shCur = st; shBackBtn(); bindSheet(); haptic(); return;
  }
  shStack = []; shCur = st; shBackBtn(); b.style.minHeight = "";
  $("#shTitle").textContent = title; b.innerHTML = body; b.scrollTop = 0;
  sheetReset(); sh.classList.remove("scrolled");
  document.documentElement.classList.add("ovl");
  sheetSettling();
  sh.classList.add("mv");
  $("#scrim").classList.add("on"); sh.classList.add("on"); bindSheet();
}
function sheetBack(){
  const p = shStack.pop(); if(!p) return closeSheet();
  const sh = $("#sheet"), b = $("#shBody");
  shSwap(-1, () => { b.textContent = ""; b.appendChild(p.frag); $("#shTitle").textContent = p.st.title; });
  b.scrollTop = p.y; sh.classList.toggle("scrolled", !!p.scrolled);
  S.sheetPid = p.st.pid; S.sheetGid = p.st.gid; S.sheetArt = p.st.art; shCur = p.st; shBackBtn(); haptic();
  const re = SH_RE[p.st.title];
  if(re) re();
  else if(S.sheetPid) refreshSheet();
  else if(S.sheetGid){ const g = (S.games || []).find(x => x.id === S.sheetGid); if(g && g.state === "in") setTimeout(() => { if(S.sheetGid === g.id) fillGame(g.id); }, 520); }
}
function closeSheet(){ S.sheetArt = null; sheetReset(); $("#sheet").classList.add("mv"); $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on");
  if(!$("#chat").classList.contains("on")) document.documentElement.classList.remove("ovl"); S.sheetPid = null; S.sheetGid = null;
  shCur = null; const dead = shStack; shStack = [];
  setTimeout(() => { if(!shStack.length && !$("#sheet").classList.contains("on")) shBackBtn(); dead.length = 0; }, 420); }
$("#shBack").onclick = sheetBack;
/* swipe in from the left edge to go back, like everywhere else on the phone */
(function(){
  const sh = $("#sheet"); let x0 = null, y0 = 0;
  sh.addEventListener("touchstart", e => { const t = e.touches[0]; x0 = (shStack.length && t.clientX < 28) ? t.clientX : null; y0 = t.clientY; }, {passive:true});
  sh.addEventListener("touchmove", e => {
    if(x0 == null) return; const t = e.touches[0];
    if(t.clientX - x0 > 56 && Math.abs(t.clientY - y0) < 44){ x0 = null; sheetBack(); }
  }, {passive:true});
  sh.addEventListener("touchend", () => { x0 = null; });
})();
$("#scrim").onclick = closeSheet; $("#shDone").onclick = closeSheet;
$("#sheet").addEventListener("transitionend", e => {
  if(e.target !== $("#sheet") || e.propertyName !== "transform") return;
  clearTimeout(sheetBusy); sheetBusy = 0;
  $("#sheet").classList.remove("mv");          /* drop the layer once it is parked */
  if(rsQueued){ rsQueued = false; refreshSheet(); }
});

  }).join("");

const SLAB = {pass_yd:"Passing yards",pass_td:"Passing TDs",pass_int:"Interceptions thrown",pass_2pt:"2-pt pass",rush_yd:"Rushing yards",rush_td:"Rushing TDs",rush_2pt:"2-pt run",rec:"Receptions",rec_yd:"Receiving yards",rec_td:"Receiving TDs",rec_2pt:"2-pt catch",fum_lost:"Fumbles lost",fum:"Fumbles",xpm:"Extra points",xpmiss:"Missed XPs",fgmiss:"Missed FGs",sack:"Sacks",int:"Interceptions",fum_rec:"Fumble recoveries",def_td:"Defensive TDs",safe:"Safeties",blk_kick:"Blocked kicks",def_st_td:"Return TDs",ff:"Forced fumbles",st_td:"Return TDs",pass_cmp:"Completions",pass_inc:"Incompletions",rush_att:"Carries",pass_att:"Pass attempts"};

/* The sheet slides up on a transform the compositor can run by itself, but a

   otherwise smooth deceleration. So: nothing rebuilds while it is moving.
   The log, the news and the week stats also each used to trigger their own
   full rebuild, so they are coalesced into one. */
let sheetBusy = 0, rsQueued = false;
function sheetSettling(ms){

function refreshSheet(){

(function(){

  const show = p => { el.style.opacity = Math.min(1, p / 44).toFixed(2); el.style.transform = `translateY(${(Math.min(p, 96) * .62 - 20).toFixed(1)}px) rotate(${Math.round(p * 3.2)}deg)`; };
  document.addEventListener("touchstart", e => { armed = false; y0 = (!blocked() && scrollY <= 0 && e.touches.length === 1 && !e.target.closest("nav, .fab, .rail, .pmenu")) ? e.touches[0].clientY : null; }, {passive:true});
  document.addEventListener("touchmove", e => {
    if(y0 == null) return; const dy = e.touches[0].clientY - y0;
    if(scrollY > 2){ y0 = null; show(0); return; }
    const p = dy > 0 ? Math.max(-scrollY, dy * .45) : 0; show(p);
    const a = p >= 62; if(a !== armed){ armed = a; el.classList.toggle("armed", a); if(a) haptic(); }
  }, {passive:true});
  const end = async () => {
    if(y0 == null) return; y0 = null;
    if(!armed){ show(0); return; }

    try{ await Promise.all([refresh(true), new Promise(r => setTimeout(r, 550))]); }catch(e){}

  };

/* Four panels around the spotlight swallow touches, so the only live part of
   the screen is the thing being pointed at. The overlay itself is
   pointer-events:none, which is what lets taps reach the real control. */
function tourBlock(T, r){
  const B = n => T.querySelector(".blk." + n);
  if(!r){ ["bt","bb","bl","br"].forEach(n => B(n).style.cssText = "left:0;top:0;right:0;bottom:0"); return; }
  B("bt").style.cssText = `left:0;top:0;right:0;height:${Math.max(0, r.top)}px`;
  B("bb").style.cssText = `left:0;top:${r.top + r.height}px;right:0;bottom:0`;
  B("bl").style.cssText = `left:0;top:${r.top}px;width:${Math.max(0, r.left)}px;height:${r.height}px`;
  B("br").style.cssText = `left:${r.left + r.width}px;top:${r.top}px;right:0;height:${r.height}px`;
}
async function tourShow(){
  const T = $("#tour"), hole = T.querySelector(".hole"), tip = T.querySelector(".tip");
  tourTeardown();
  for(; tourI < TOUR.length; tourI++){
    const st = Object.assign({}, TOUR[tourI], WIDE() ? TOUR_WIDE[TOUR[tourI].sel] : null), last = tourI === TOUR.length - 1;
    const dots = `<div class="dots">${TOUR.map((_, k) => `<i class="${k === tourI ? "on" : ""}"></i>`).join("")}</div>`;
    const foot = btn => `<div class="tf">${dots}${last ? "" : `<button class="skip" id="tSkip">Skip</button>`}${btn}</div>`;

    /* a step that shows rather than tells */
    if(st.demo){
      hole.style.cssText = "opacity:0;width:0;height:0";
      tourBlock(T, null);
      tip.innerHTML = `<div class="th"><div class="tb">${abot("")}</div><b>${esc(st.t)}</b></div><p>${esc(st.d)}</p>
        <div class="tdemo">${fieldSVG({abbr:"BUF", nick:"Bills", color:"#00338d"}, {abbr:"MIA", nick:"Dolphins", color:"#008e97"})}
          <div class="grp tdrow">${playRows([DEMO_PLAY], null)}</div></div>
        ${foot(`<button class="next" id="tNext">Next</button>`)}`;
      tip.style.top = Math.max(54, (innerHeight - tip.offsetHeight) / 2) + "px";
      const svg = tip.querySelector(".field");
      const run = () => animPlay(svg, DEMO_PLAY);
      setTimeout(run, 420);
      const loop = setInterval(run, 3400);
      tip.querySelectorAll("[data-play]").forEach(x => x.onclick = run);
      tourOff = () => clearInterval(loop);
      $("#tNext").onclick = () => { haptic(); tourI++; tourShow(); };
      const sk0 = $("#tSkip"); if(sk0) sk0.onclick = endTour;
      return;
    }

    if(st.tab && S.tab !== st.tab){ go(st.tab); await sleep(380); }
    $("#fab").classList.remove("hide");
    const el = $(st.sel.startsWith("#") ? st.sel : "#app " + st.sel); if(!el || !el.offsetWidth) continue;
    const fixed = !!el.closest("#nav, #fab, #bar");
    if(fixed){ if(st.sel === "#pfBtn") window.scrollTo(0, 0); }
    else { const r0 = el.getBoundingClientRect(); window.scrollTo(0, Math.max(0, scrollY + r0.top - 140)); }
    await sleep(90);
    const r = el.getBoundingClientRect(), pad = fixed ? 5 : 7;
    const top = Math.max(6, r.top - pad), h = Math.min(r.height + pad * 2, innerHeight * .46);
    const box = {left:Math.max(4, r.left - pad), top, width:Math.min(innerWidth - 8, r.width + pad * 2), height:h};
    hole.style.cssText = `left:${box.left}px;top:${box.top}px;width:${box.width}px;height:${box.height}px;border-radius:${st.r || 24}px;opacity:1`;
    tourBlock(T, box);

    tip.innerHTML = `<div class="th"><div class="tb">${abot("")}</div><b>${esc(st.t)}</b></div><p>${esc(st.d)}</p>
      ${foot(st.act ? `<button class="next ghost" id="tNext">Skip this</button>` : `<button class="next" id="tNext">${last ? "Let's go" : "Next"}</button>`)}`;
    const th = tip.offsetHeight, below = box.top + box.height + 14, room = innerHeight - below - 14;
    tip.style.top = (room >= th ? below : Math.max(54, box.top - 14 - th)) + "px";

    const advance = () => { tourTeardown(); tourI++; if(tourI >= TOUR.length) endTour(); else tourShow(); };
    $("#tNext").onclick = () => { haptic(); advance(); };
    const sk = $("#tSkip"); if(sk) sk.onclick = endTour;

    /* the step is finished by doing the thing, not by pressing Next */
    if(st.act){
      let done = false;
      const onHit = () => {
        if(done) return; done = true;
        if(st.pause){
          /* they opened something: get out of the way, come back when they close it */
          T.classList.add("paused");
          const watch = setInterval(() => {
            if(!$("#sheet").classList.contains("on") && !$("#chat").classList.contains("on")){
              clearInterval(watch); T.classList.remove("paused"); setTimeout(advance, 260);
            }
          }, 260);
          tourOff = () => { clearInterval(watch); clearInterval(idle); T.classList.remove("paused"); el.removeEventListener("click", onHit, true); };
        } else setTimeout(advance, 520);
      };
      el.addEventListener("click", onHit, true);
      /* if they stare at it without tapping, let the step advance itself */
      const idle = setTimeout(() => { if(!done){ const n = $("#tNext"); if(n) n.textContent = "Next"; } }, 6000);
      tourOff = () => { clearTimeout(idle); el.removeEventListener("click", onHit, true); };
    }
    return;
  }
  endTour();
}

/* =============== tab bar: one spring drives the glass lens =============== */
const TB = (() => {
  const nav = $("#nav");
  let b = null, pos = null, vel = 0, target = 0, lift = 0, liftT = 0, raf = 0, last = 0, tint = false, st = null;
  const wrap = () => nav.querySelector(".wrap");
  const btns = () => [...nav.querySelectorAll("button[data-tab]")];
  function ensure(){ const w = wrap(); if(!w) return null; b = w.querySelector(".tbub"); if(!b){ b = document.createElement("i"); b.className = "tbub"; w.prepend(b); } return b; }
  function geom(){ const bs = btns(), w = wrap(); return {bs, rel:bs.map(e => [e.offsetLeft, e.offsetLeft + e.offsetWidth]), bw:bs[0] ? bs[0].offsetWidth : 0, ww:w ? w.offsetWidth : 0}; }
  function paint(g){
    const k = Math.min(.16, Math.abs(vel) / 4800), sc = 1 + lift * .07;
    b.style.width = g.bw + "px";
    b.style.transform = `translateX(${pos.toFixed(2)}px)`;
    b.style.scale = (k > .002 || lift > .002) ? `${(sc + k).toFixed(3)} ${(sc - k * .45).toFixed(3)}` : "";
    if(tint) g.bs.forEach((el, i) => { const [l, r] = g.rel[i], ov = Math.max(0, Math.min(1, (Math.min(pos + g.bw, r) - Math.max(pos, l)) / (r - l))); el.style.setProperty("--p", Math.round(ov * 100) + "%"); });
  }
  function settle(g){
    pos = target; vel = 0; lift = liftT; paint(g); b.style.scale = "";
    if(tint){ tint = false; nav.classList.remove("tinting"); g.bs.forEach(e => e.style.removeProperty("--p")); }
    nav.classList.remove("dragging"); last = 0;
  }
  function tick(now){
    raf = 0;
    try{ step(now); }catch(err){ console.error(err); if(pos != null && ensure()){ try{ settle(geom()); }catch(_){} } }
  }
  function step(now){
    if(!ensure() || pos == null) return;
    const g = geom(), dt = last ? Math.min(.034, (now - last) / 1000) : 1 / 60; last = now;
    const drag = !!(st && st.drag), K = drag ? 1500 : 560, C = 2 * Math.sqrt(K) * (drag ? .92 : .86);
    for(let i = 0; i < 2; i++){ const h = dt / 2; vel += (K * (target - pos) - C * vel) * h; pos += vel * h; }
    lift += (liftT - lift) * Math.min(1, dt * 16);
    paint(g);
    if(!drag && Math.abs(target - pos) < .4 && Math.abs(vel) < 12 && Math.abs(liftT - lift) < .02){ settle(g); return; }
    raf = requestAnimationFrame(tick);
  }
  const run = () => { if(!raf){ last = 0; raf = requestAnimationFrame(tick); } };
  function startTint(){ tint = true; nav.classList.add("tinting"); }
  function to(btn, instant){
    if(st && st.drag) return;
    if(!ensure() || !btn || !btn.offsetWidth) return;
    target = btn.offsetLeft;
    if(pos == null || instant){ pos = target; vel = 0; settle(geom()); return; }
    if(Math.abs(target - pos) > 1){ startTint(); run(); }
  }
  function nearestTo(left){ const g = geom(); let best = 0, bd = Infinity; g.rel.forEach(([l, r], i) => { const d = Math.abs((l + r) / 2 - (left + g.bw / 2)); if(d < bd){ bd = d; best = i; } }); return g.bs[best]; }
  function fingerLeft(x){
    const g = geom(), wl = wrap().getBoundingClientRect().left, max = g.ww - g.bw;
    let l = x - wl - g.bw / 2;
    const band = d => 14 * (1 - 1 / (1 + d / 70)); // never more than ~14px past the edge, with growing resistance
    if(l < 0) l = -band(-l); else if(l > max) l = max + band(l - max);
    return l;
  }
  function beginDrag(){
    if(!st || st.drag) return; st.drag = true;
    nav.classList.add("dragging"); startTint(); liftT = 1;
    target = fingerLeft(st.x); st.cur = nearestTo(target); run();
  }
  function release(){ if(!st) return; clearTimeout(st.timer); st = null; liftT = 0; }
  nav.addEventListener("pointerdown", e => {
    if(e.pointerType === "mouse" && e.button !== 0) return;
    if(WIDE()) return;
    if(!ensure() || pos == null) navBubble();
    try{ nav.setPointerCapture(e.pointerId); }catch(_){}
    if(WIDE()) return;                       /* the sidebar is a plain list: clicks only */
    st = {id:e.pointerId, x0:e.clientX, y0:e.clientY, x:e.clientX, drag:false, cur:null, btn:e.target.closest("button[data-tab]")};
    st.timer = setTimeout(beginDrag, 230);
  });
  nav.addEventListener("pointermove", e => {
    if(!st || e.pointerId !== st.id) return; st.x = e.clientX;
    if(!st.drag){
      if(Math.abs(e.clientX - st.x0) > 7){ clearTimeout(st.timer); beginDrag(); }
      else if(Math.abs(e.clientY - st.y0) > 34){ release(); const on = nav.querySelector("button[data-tab].on"); if(on){ target = on.offsetLeft; run(); } }
      return;
    }
    target = fingerLeft(st.x); st.moved = performance.now();
    const n = nearestTo(target);
    if(n !== st.cur){ const g = geom(), c = st.cur ? st.cur.offsetLeft : -1e9; if(Math.abs(target - c) > g.bw * .58){ st.cur = n; haptic(); } }
    run();
  });
  nav.addEventListener("pointerup", e => {
    if(!st || e.pointerId !== st.id) return;
    const s0 = st; release(); navSkipClick = Date.now() + 450;
    if(!s0.drag){
      const hit = document.elementFromPoint(e.clientX, e.clientY), btn = (hit && hit.closest && hit.closest("nav button[data-tab]")) || s0.btn;
      if(btn){ haptic(); navTo(btn.dataset.tab); }
      return;
    }
    // a flick carries the lens on toward the next tab
    const g = geom(), proj = Math.max(0, Math.min(g.ww - g.bw, pos + vel * .09)), btn = nearestTo(proj);
    target = btn.offsetLeft; run();
    if(btn.dataset.tab !== S.tab){ haptic(); navTo(btn.dataset.tab); }
  });
  function abort(){
    if(!st) return; release();
    const on = nav.querySelector("button[data-tab].on"); if(on){ target = on.offsetLeft; run(); }
  }
  nav.addEventListener("pointercancel", e => { if(st && e.pointerId === st.id) abort(); });
  nav.addEventListener("lostpointercapture", e => { if(st && e.pointerId === st.id) setTimeout(() => { if(st && st.id === e.pointerId) abort(); }, 0); });
  addEventListener("blur", abort);
  document.addEventListener("visibilitychange", () => { if(document.hidden){ abort(); if(pos != null && ensure()){ cancelAnimationFrame(raf); raf = 0; settle(geom()); } } });
  // safety net: if the lens is ever left lifted or tinted with no finger down, put it back
  setInterval(() => { if(!st && !raf && (lift > .01 || tint || nav.classList.contains("dragging"))){ liftT = 0; const on = nav.querySelector("button[data-tab].on"); if(on) target = on.offsetLeft; run(); } }, 400);
  return {to};
})();
function navBubble(instant){
  const on = $("#nav button[data-tab].on"); if(!on) return;
  if(!on.offsetWidth){ requestAnimationFrame(() => { if(on.offsetWidth) navBubble(true); }); return; }
  TB.to(on, instant);
}
addEventListener("resize", () => navBubble(true));

/* large title shrinks and fades into the bar; stretches on overscroll */
function titleFx(y){
  const bar = $("#bar"); if(bar){ const bo = Math.min(1, Math.max(0, (y - 8) / 36)); bar.style.setProperty("--bo", bo.toFixed(3)); bar.classList.toggle("frost", bo > .02); }
  const mini = $("#miniTitle"); if(mini) mini.style.opacity = Math.min(1, Math.max(0, (y - 28) / 22)).toFixed(3);
  const lt = $("#app .lt"); if(!lt) return;
  if(y < 0){ lt.style.transform = `scale(${Math.min(1.1, 1 + (-y) / 650).toFixed(3)})`; lt.style.opacity = 1; }
  else { const p = Math.min(1, y / 46); lt.style.transform = `translateY(${(p * 8).toFixed(1)}px) scale(${(1 - p * .08).toFixed(3)})`; lt.style.opacity = (1 - p).toFixed(3); }
}

/* segmented controls: a pill that slides between options */
const segMem = {};
function segPills(root){
  const scope = root || $("#app"), pre = root ? "sh" : S.tab;
  scope.querySelectorAll(".seg").forEach((sg, i) => {
    const on = sg.querySelector("button.on"); if(!on) return;
    let pl = sg.querySelector(".pill"); if(!pl){ pl = document.createElement("i"); pl.className = "pill"; sg.prepend(pl); }
    const k = pre + i, x = on.offsetLeft, w = on.offsetWidth, prev = segMem[k];
    pl.style.transition = "none"; pl.style.width = w + "px"; pl.style.transform = `translateX(${prev != null ? prev : x}px)`;
    void pl.offsetWidth; pl.style.transition = ""; pl.style.transform = `translateX(${x}px)`; segMem[k] = x;
  });
}
document.addEventListener("click", e => { const b = e.target.closest("#shBody .seg button"); if(b) setTimeout(() => segPills($("#shBody")), 0); });

/* sheets: drag with the finger, rubber-band, snap to full / half / closed by flick speed */
let sheetBase = 0;
function sheetReset(){ sheetBase = 0; const sh = $("#sheet"); sh.classList.remove("drag"); sh.style.transform = ""; const sc = $("#scrim"); sc.classList.remove("dragging"); sc.style.opacity = ""; }
(function(){
  const sh = $("#sheet"), body = $("#shBody"), scrim = $("#scrim");
  let y0 = null, off = 0, mode = null, onHdr = false, H = 0, trail = [];
  const half = () => { const m = H - innerHeight * .55; return m > 90 ? m : null; };
  const place = (y, live) => {
    sh.classList.toggle("drag", live); scrim.classList.toggle("dragging", live);
    sh.style.transform = y ? `translateY(${y}px)` : "";
    scrim.style.opacity = Math.max(0, Math.min(1, 1 - y / H)).toFixed(3);
  };
  body.addEventListener("scroll", () => sh.classList.toggle("scrolled", body.scrollTop > 2), {passive:true});
  sh.addEventListener("touchstart", e => {
    if(WIDE()){ y0 = null; return; }
    const t = e.touches[0]; y0 = t.clientY; mode = null; H = sh.offsetHeight; off = sheetBase;
    onHdr = !!e.target.closest(".sh") || e.target === sh; trail = [[t.clientY, e.timeStamp]];
  }, {passive:true});
  sh.addEventListener("touchmove", e => {
    if(y0 == null) return; const t = e.touches[0], dy = t.clientY - y0;
    if(!mode){
      if(Math.abs(dy) < 5) return;
      mode = (onHdr || (body.scrollTop <= 0 && dy > 0) || (sheetBase > 0 && dy < 0 && body.scrollTop <= 0)) ? "drag" : "scroll";
    }
    if(mode !== "drag") return;
    e.preventDefault();
    let y = sheetBase + dy; if(y < 0) y = -Math.sqrt(-y) * 2.4;
    off = y; place(y, true);
    trail.push([t.clientY, e.timeStamp]); if(trail.length > 5) trail.shift();
  }, {passive:false});
  const end = () => {
    if(y0 == null) return; y0 = null; if(mode !== "drag") return;
    const a = trail[0], b = trail[trail.length - 1], dt = b[1] - a[1];
    const v = dt > 0 ? (b[0] - a[0]) / dt : 0, proj = off + v * 200;
    const pts = [0], m = half(); if(m != null) pts.push(m); pts.push(H);
    const tgt = pts.reduce((p, c) => Math.abs(c - proj) < Math.abs(p - proj) ? c : p);
    sh.classList.remove("drag"); scrim.classList.remove("dragging");
    if(tgt === H){ haptic(); closeSheet(); return; }
    if(tgt !== sheetBase) haptic();
    sheetBase = tgt; place(tgt, false);
  };
  sh.addEventListener("touchend", end); sh.addEventListener("touchcancel", end);
})();

/* =============== boot =============== */
let bootT = Date.now(), bootDone = false, bootSlow = 0;
const NOMO = matchMedia("(prefers-reduced-motion:reduce)").matches;
const BOOT_ANIM = NOMO ? 360 : 2120;   /* 4A runs 1.95s end to end */
/* the headset starts just above the top of the screen, whatever the screen is.
   CSS transforms inside an SVG use user units, so convert px through the sprite's scale. */
let animT = 0;
/* The animation used to begin the instant the CSS parsed, which is before this
   200KB script is done. SVG transforms are not composited in Safari, so it ticks
   on the main thread: the clock kept running while the parse blocked painting,
   then snapped forward, and --trv changed value in the same frame. That double
   jump is what showed up as a flicker and a second head. Set the travel distance
   first, then let one frame pass, then start it. */
(function travel(){
  const bb = document.querySelector("#boot .bbot"), b = document.getElementById("boot");
  if(!bb || !b) return;
  const px = bb.getBoundingClientRect().width || 108, u = 150 / px;
  b.style.setProperty("--trv", Math.round((innerHeight / 2 + 64) * u) + "px");
  const go = () => { if(b.isConnected && !b.classList.contains("go")){ b.classList.add("go"); animT = Date.now(); setTimeout(bootWait, BOOT_ANIM + 120); } };
  requestAnimationFrame(() => requestAnimationFrame(go));
  setTimeout(go, 300);                       /* belt and braces if a frame is dropped */
})();
/* The intro has finished and the app still isn't ready: switch him to working. */
let bootP = 0, bootCap = .2, bootTick = 0;
function bootWait(){
  const b = $("#boot"); if(!b || bootDone) return;
  b.classList.add("wait"); $("#bootProg").classList.add("on"); $("#bootMsg").classList.add("on");
  clearInterval(bootTick);
  bootTick = setInterval(() => {            /* creep toward the next real milestone so it never looks stuck */
    if(bootDone || !b.isConnected){ clearInterval(bootTick); return; }
    bootProg(bootP + (bootCap - bootP) * .07);
  }, 350);
}
function bootProg(p, cap){
  bootP = Math.max(bootP, Math.min(1, p)); if(cap) bootCap = Math.max(bootCap, cap);
  const i = document.querySelector("#bootProg i"); if(i) i.style.transform = `scaleX(${bootP.toFixed(3)})`;
}
function loading(msg){
  const b = $("#boot");
  if(b && !bootDone){
    // Sleeper-style: stay silent through the intro. The line appears with the working state.
    const m = $("#bootMsg");
    if(m && msg) m.textContent = String(msg).replace(/…$/, "");
    return;
  }
  $("#app").innerHTML = `<div class="loading"><div class="spin"></div>${esc(msg)}</div>`;
}
// hand off the moment the app is ready: content fades in behind, splash fades out
function bootOff(ready){
  const b = $("#boot"); if(!b || bootDone) return; bootDone = true; clearTimeout(bootSlow); clearInterval(bootTick); bootProg(1);
  /* Today is already rendered underneath an opaque boot screen. Fading BOTH
     meant each was semi-transparent at the same moment, so the screen dipped
     through black between them. Dissolve the boot screen only. */
  const leave = () => { b.classList.add("gone"); tintBar(); setTimeout(() => b.remove(), 380); warmRest(); };
  setTimeout(() => { ready ? ready.then(leave, leave) : leave(); },
             Math.max(0, BOOT_ANIM - (Date.now() - (animT || bootT))));
}
function setup(){
  bootOff();
  $("#bar").style.display = "none"; $("#nav").style.display = "none"; $("#fab").style.display = "none";
  $("#app").innerHTML = `<form class="setup wel" id="sf"><div class="welbot">${abot("")}</div><h1>Welcome to Audible</h1>
    <div class="c2" style="font-size:17px;line-height:1.4">Your Sleeper fantasy team, made simple. I'm Audible, your coach on the sideline.</div>
    <div class="welpts"><div>${MI.live}<span><b>Live matchups</b> with win odds, lineups, waivers and news</span></div>
      <div>${MI.news}<span><b>Alerts that matter</b>: lineup problems, lead changes and finals</span></div>
      <div>${MI.ai}<span><b>An AI coach</b> for start/sit, waivers and trades (optional)</span></div></div>
    <div class="stepl">Step 1 · Your Sleeper username</div>
    <input class="field" id="un" placeholder="Sleeper username" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username">
    <div class="xs c2" style="line-height:1.4">It's the name on your Sleeper profile. No password needed. Audible can only read your leagues, never change them.</div>
    <div class="err" id="err"></div><button class="btn" type="submit">Continue</button></form>`;
  $("#sf").onsubmit = async e => {
    e.preventDefault(); const n = $("#un").value.trim().replace(/^@/, ""); if(!n) return;
    $("#err").textContent = "Looking you up…";
    try{
      const u = await api(`/user/${encodeURIComponent(n)}`);
      if(!u || !u.user_id){ $("#err").textContent = "Couldn't find that username on Sleeper. Check the spelling in your Sleeper profile."; return; }
      store.set("gd_user", {user_id:u.user_id, username:n, display_name:u.display_name, avatar:u.avatar}); store.set("gd_new", 1);
      if(await tryRestore(n)) restoreScreen(n, boot); else boot();
    }catch(err){ $("#err").textContent = "Couldn't reach Sleeper. Check your connection."; }
  };
}
function pickLeague(){
  bootOff();
  $("#bar").style.display = "none"; $("#nav").style.display = "none"; $("#fab").style.display = "none";
  $("#app").innerHTML = `<div class="setup" style="justify-content:flex-start;padding-top:calc(var(--sat) + 40px)"><div class="stepl">Step 2 · Pick your league</div><h1 style="margin:0">Hi, ${esc(S.user.display_name)}</h1>
    <div class="c2" style="font-size:17px;line-height:1.4">You're in ${S.leagues.length} leagues. Which one first? You can switch anytime from your picture in the top left.</div>
    <div class="lgpick">${S.leagues.map(l => `<button data-lgp="${esc(l.league_id)}">${lgAv(l)}<div style="flex:1;min-width:0"><b>${esc(l.name)}</b><span>${[l.total_rosters ? l.total_rosters + " teams" : "", (l.scoring_settings || {}).rec ? ((l.scoring_settings.rec === 1) ? "PPR" : l.scoring_settings.rec + " PPR") : ""].filter(Boolean).join(" · ") || "Sleeper league"}</span></div>${CHEV}</button>`).join("")}</div></div>`;
  $$("#app [data-lgp]").forEach(b => b.onclick = () => { store.set("gd_league", b.dataset.lgp); boot(); });
}
async function boot(){
  loadSettings();
  S.user = store.get("gd_user");
  if(!S.user) return setup();
  loading("Loading your leagues…");
  try{
    /* fire everything we can predict from last launch, all at once */
    const hint = store.get("gd_hint"), lid0 = store.get("gd_league");
    pre(API + "/state/nfl");
    if(hint && hint.season){
      pre(API + `/user/${S.user.user_id}/leagues/nfl/${hint.season}`);
      if(lid0){
        ["", "/rosters", "/users", `/matchups/${hint.week}`].forEach(x => pre(API + `/league/${lid0}${x}`));
        pre(sbUrl(hint.st === "post" ? 3 : 2, hint.week, hint.sseason));
        const pc = store.get(`gd_proj_${lid0}_${hint.sseason}_${hint.week}`);
        if(!(pc && Date.now() - pc.t < 2*3600e3)) pre(API + `/projections/nfl/regular/${hint.sseason}/${hint.week}`);
      }
    }
    bootProg(.06, .28);
    S.state = await api("/state/nfl");
    S.state.week = Math.max(1, S.state.week || S.state.display_week || 1);
    bootProg(.28, .5);
    await loadPlayers(false);
    bootProg(.5, .66);
    const season = S.state.league_season || S.state.season;
    S.leagues = (await api(`/user/${S.user.user_id}/leagues/nfl/${season}`)) || [];
    bootProg(.66, .9);
    if(!S.leagues.length){
      bootOff();
      $("#app").innerHTML = `<div class="setup"><h1>No leagues found</h1><div class="c2">${esc(S.user.display_name)} isn't in any NFL leagues this season.</div><button class="btn" id="ag">Try another username</button></div>`;
      $("#ag").onclick = () => { store.del("gd_user"); setup(); }; return;
    }
    const isNew = !!store.get("gd_new");
    if(isNew && S.leagues.length > 1 && !S.leagues.some(l => l.league_id === store.get("gd_league"))) return pickLeague();
    S.league = S.leagues.find(l => l.league_id === store.get("gd_league")) || S.leagues[0];
    S.week = S.state.week; S.tab = "home";
    loading("Loading " + S.league.name + "…");
    await loadLeague();
    PRE.clear();
    store.set("gd_hint", {season, sseason:S.state.season, week:S.state.week, st:S.state.season_type, lid:S.league.league_id});
    bootProg(.92, .99);
    $("#bar").style.display = ""; $("#nav").style.display = ""; $("#fab").style.display = ""; pfFill();
    render(true);
    const warming = prewarm(criticalImgs(), 2000);
    /* yesterday's player list got us in; fetch today's now that nobody is waiting */
    if(playersStale) setTimeout(() => loadPlayers(true, true).then(() => render()).catch(() => {}), 5000);
    checkUpdate();
    bootOff(warming); startLive(); checkWin();
    if(location.hash && route(location.hash)) history.replaceState(null, "", location.pathname + location.search);
    syncWatcher(false);
    const seen = store.get("gd_seen_ver");
    if(isNew){ store.del("gd_new"); store.set("gd_seen_ver", VERSION); if(!store.get("gd_tour")) setTimeout(startTour, 900); }
    else if(seen !== VERSION){ if(seen || store.get("gd_settings")) setTimeout(() => openWhatsNew(false), 700); else store.set("gd_seen_ver", VERSION); }
  }catch(e){ fail(e); }
}
boot();
})();
</script>
