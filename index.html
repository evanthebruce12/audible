  navigator.serviceWorker.addEventListener("message", e => { if(e.data && e.data.type === "open"){ try{ route(new URL(e.data.url).hash); }catch(err){} } });
}
addEventListener("hashchange", () => { if(route(location.hash)) history.replaceState(null, "", location.pathname + location.search); });

/* =============== render =============== */
const TITLES = {home:"Today", matchup:"Matchup", team:"My Team", players:"Players", league:"League"};
function render(anim){
  if(!S.league) return;
  $$("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  homeBadge();
  $("#miniTitle").textContent = TITLES[S.tab] || "";
  const v = {home:vHome, matchup:vMatchup, team:vTeam, players:vPlayers, league:vLeague}[S.tab] || vHome;
  const y = window.scrollY, app = $("#app");
  app.innerHTML = v();
  if(anim){ app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter"); window.scrollTo(0, 0); }
  else window.scrollTo(0, y);
  bind();
  const fb = $("#fab"); if(fb && !fb.firstChild) fb.innerHTML = abot("");
  abRefresh(); segPills(); titleFx(scrollY); navBubble();
}
function head(title, sub){ return `<h1 class="lt">${title}</h1><div class="sub">${sub || ""}</div>`; }
function liveSub(){
  const live = S.games && S.games.some(g => g.state === "in") && isCur();
  return `${live ? '<i class="livedot"></i>Live · ' : ""}${esc(S.league.name)} · Week ${S.week}`;
}
function tRow(p, slot, pts, lvl){
  const s = p.empty ? "" : gState(p), pr = proj(p.id);
  return `<button class="trow ${lvl || ""}" ${p.empty ? "" : `data-p="${esc(p.id)}"`}>${slot ? `<div class="slot">${SLBL[slot] || slot}</div>` : ""}${hs(p)}
    <div class="i"><div class="t1 ${p.empty ? "red" : ""}">${esc(p.empty ? "Empty slot" : p.name)}${stBadge(p)}</div><div class="t2 ${s === "in" ? "live-g" : ""}">${p.empty ? "Tap Edit lineup to fill" : esc(p.pos) + " · " + esc(gameLine(p))}</div></div>
    <div class="r">${p.empty ? "" : `<b>${s === "pre" && !pts ? "–" : f1(pts || 0)}</b>${pr != null ? `<small>proj ${f1(pr)}</small>` : ""}`}</div></button>`;
}

/* ---- Today ---- */
function vHome(){
  const d = new Date().toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"});
  let h = head("Today", esc(d));
  const ins = insights();
  h += `<div class="bot"><button class="hd" id="botHd" style="width:100%;text-align:left">${abot("a40")}<div style="flex:1;min-width:0"><b>${esc(S.set.botName)}</b><span>Week ${S.state.week} briefing · ${esc(S.league.name)}</span></div>${CHEV}</button>
    ${ins.map(i => `<button class="ins" data-go="${i.go}"><i class="dot ${i.tone}"></i><span class="tx">${i.html}</span></button>`).join("") || `<div class="empty">Nothing to flag right now.</div>`}
    <button class="aibtn" id="askBtn">Ask ${esc(S.set.botName)} anything</button></div>`;
  const me = mOf(S.myRid), op = oppOf(me);
  if(me && isCur()){
    const live = (me.starters || []).map((id, i) => ({p:P(id), pts:(me.starters_points || [])[i], slot:slots()[i]})).filter(x => !x.p.empty && gState(x.p) === "in");
    if(live.length) h += `<div class="sec"><h2>On the field</h2><span class="sm" style="color:var(--red);font-weight:600">● Live</span></div><div class="grp">${live.map(x => tRow(x.p, x.slot, x.pts)).join("")}</div>`;
  }
  if(me) h += `<div class="sec"><h2>Your matchup</h2><button data-go="matchup">See all</button></div>` + scoreBug(me, op, true);
  if(S.games && S.games.length){
    const own = ownerMap(), mine = {};
    Object.keys(own).forEach(id => { if(own[id] === S.myRid){ const t = P(id).team; if(t) mine[t] = (mine[t] || 0) + 1; } });
    const ord = {in:0, pre:1, post:2};
    const sorted = [...S.games].sort((a,b) => (ord[a.state] - ord[b.state]) || (a.date - b.date));
    h += `<div class="sec"><h2>NFL · Week ${S.week}</h2></div><div class="rail">${sorted.map(g => gameCard(g, (mine[g.home.abbr] || 0) + (mine[g.away.abbr] || 0))).join("")}</div>`;
  }
  const tx = (S.tx || []).slice(0, 4);
  if(tx.length) h += `<div class="sec"><h2>League activity</h2><button data-go="league" data-seg="activity">See all</button></div><div class="grp">${tx.map(txCell).join("")}</div>`;
  h += `<div class="btns"><a class="btn gray" href="https://sleeper.com/leagues/${S.league.league_id}/trades" target="_blank" rel="noopener">Check trade offers in Sleeper</a></div>`;
  return h;
}
function gameCard(g, mineN){
  const done = g.state === "post", aw = g.away.score > g.home.score, hw = g.home.score > g.away.score;
  const row = (s, lose) => `<div class="gr ${done && lose ? "l" : ""}">${s.logo ? `<img src="${esc(s.logo)}" alt="" onerror="this.remove()">` : ""}<span class="ab">${esc(s.abbr)}</span>${g.state !== "pre" ? `<span class="s">${s.score}</span>` : `<span class="xs c2">${esc(s.rec)}</span>`}</div>`;
  const status = g.state === "in" ? `<span class="live">${esc(g.detail)}</span>` : g.state === "post" ? "Final" : `${day(g.date)} ${tm(g.date)}`;
  return `<button class="game" data-g="${esc(g.id)}" style="text-align:left">${row(g.away, hw)}${row(g.home, aw)}<div class="gs"><span>${status}</span><span>${g.state === "pre" ? esc(g.odds) : esc(g.net)}</span></div>${mineN ? `<div class="mine">${mineN} of your players</div>` : ""}</button>`;
}

/* ---- score bug ---- */
function scoreBug(a, b, link){
  const A = team(a.roster_id), B = b ? team(b.roster_id) : null;
  const ap = a.points || 0, bp = b ? (b.points || 0) : 0;
  const oa = teamOutlook(a), ob = b ? teamOutlook(b) : null, wp = hasProj() && b ? winProb(oa, ob) : null;
  const line = (T, p, o, lose, id) => `<div class="brow">${av(T, "l")}<div class="bi"><div class="nm">${esc(T.name)}</div><div class="rec">${rec(T)}${o && hasProj() ? ` · proj ${f1(o.proj)}` : ""}</div></div><span class="sc ${lose ? "lose" : ""}" ${link ? "" : `id="${id}"`}>${f2(p)}</span></div>`;
  return `<div class="bug" ${link ? `data-go="matchup"` : ""}>${line(A, ap, oa, b && ap < bp, "scA")}${B ? line(B, bp, ob, bp < ap, "scB") : `<div class="brow"><div class="bi"><div class="nm c2">Bye week</div></div></div>`}${wp != null ? `<div class="wp"><div class="lbls"><span class="green">${pct(wp)}</span><span class="c2">Win probability</span><span style="color:var(--blue)">${pct(1-wp)}</span></div><div class="track"><i style="width:${wp*100}%"></i><i style="width:${(1-wp)*100}%"></i></div></div>` : ""}</div>`;
}

/* ---- Matchup ---- */
function mCell(id, pts, right){
  const p = P(id), pr = proj(id), s = p.empty ? "" : gState(p);
  return `<div class="mp ${right ? "r" : ""} ${s === "post" ? "done" : s === "in" ? "live" : ""}" ${p.empty ? "" : `data-p="${esc(id)}"`}>${hs(p)}<div class="i"><div class="n">${esc(shortName(p))}${stBadge(p)}</div><div class="g">${esc(p.empty ? "" : gameLine(p))}</div></div>
    <div class="pts">${p.empty ? "" : `<b>${s === "pre" && !pts ? "–" : f1(pts)}</b>${pr != null ? `<small>${f1(pr)}</small>` : ""}`}</div></div>`;
}
function matchupBody(a, b){
  let h = scoreBug(a, b, false);
  h += `<div class="sec"><h2>Starters</h2>${hasProj() ? '<span class="xs c3">Small number = projection</span>' : ""}</div><div class="grp">`;
  slots().forEach((slot, i) => {
    const aid = (a.starters || [])[i], bid = b ? (b.starters || [])[i] : null;
    h += `<div class="mrow" data-a="${esc(aid)}">${mCell(aid, (a.starters_points || [])[i], false)}<div class="slot">${SLBL[slot] || slot}</div>${b ? mCell(bid, (b.starters_points || [])[i], true) : "<div></div>"}</div>`;
  });
  h += `</div>`;
  if(S.set.showBench){
    const ba = benchOf(a.roster_id), bb = b ? benchOf(b.roster_id) : [], n = Math.max(ba.length, bb.length);
    if(n){
      h += `<div class="sec"><h2>Bench</h2></div><div class="grp">`;
      for(let i = 0; i < n; i++){
        const x = ba[i], y = bb[i];
        h += `<div class="mrow">${x ? mCell(x.id, (a.players_points || {})[x.id], false) : "<div></div>"}<div class="slot">BN</div>${y ? mCell(y.id, (b.players_points || {})[y.id], true) : "<div></div>"}</div>`;
      }
      h += `</div>`;
    }
  }
  return h;
}
function vMatchup(){
  let h = head("Matchup", liveSub());
  h += `<div class="wkpick" style="justify-content:space-between;margin-top:6px"><button data-wk="-1">‹</button><span class="sm c2">${isCur() ? "This week" : "Week " + S.week}${S.updated ? " · updated " + tm(S.updated) : ""}</span><button data-wk="1">›</button></div>`;
  if(!S.myRid) return h + `<div class="empty">Couldn't find your team in this league.</div>`;
  const me = mOf(S.myRid);
  if(!me) return h + `<div class="empty">No matchup for week ${S.week} yet.</div>`;
  const iss = lineupIssues();
  if(iss.length){
    h += `<div class="sec"><h2>Lineup check</h2><a href="https://sleeper.com/leagues/${S.league.league_id}/team" target="_blank" rel="noopener">Edit in Sleeper</a></div><div class="grp">` +
      iss.map(x => `<button class="cell" data-p="${esc(x.p.id)}">${hs(x.p)}<div class="main"><div class="t1">${esc(x.p.name)}${stBadge(x.p)}</div><div class="t2">${SLBL[x.slot] || x.slot} · ${esc(x.why)}</div>
        ${x.subs.length ? `<div class="t2" style="color:var(--${x.level === "bad" ? "red" : x.level === "warn" ? "orange" : "blue"})">${x.level === "tip" ? "Consider" : "Swap in"} ${x.subs.map(s => `${esc(s.p.name)} (${f1(s.v)})`).join(", ")}</div>` : `<div class="t2 orange">No bench option. Check waivers.</div>`}</div></button>`).join("") + `</div>`;
  }
  h += matchupBody(me, oppOf(me));
  h += `<div class="foot">${+S.set.refresh ? `Scores refresh every ${S.set.refresh} seconds while the app is open.` : "Auto-refresh is off. Tap ↻ to update."} Tap any player for live stats.</div>`;
  return h;
}

/* ---- My Team ---- */
const PORD = "QB RB WR TE K DEF DL LB DB";
function vTeam(){
  if(!S.myRid) return head("My Team", "") + `<div class="empty">Couldn't find your team in this league.</div>`;
  const T = team(S.myRid), r = T.r || {}, m = mOf(S.myRid);
  let h = head("My Team", `${esc(T.name)} · ${rec(T)}`);
  const st = (m && m.starters) || r.starters || [];
  const ptsOf = id => m ? (m.players_points || {})[id] : null;
  const iss = {}; lineupIssues().forEach(x => { if(x.level !== "tip") iss[x.p.id] = x.level; });
  const o = m ? teamOutlook(m) : null, ls = S.league.settings || {};
  const faab = ls.waiver_type === 2 && ls.waiver_budget ? `<div><b>$${ls.waiver_budget - (T.faab || 0)}</b><span>FAAB left</span></div>` : `<div><b>${T.wpos != null ? "#" + T.wpos : "–"}</b><span>Waiver order</span></div>`;
  h += `<div class="summ"><div><b>${m ? f1(m.points) : "–"}</b><span>Wk ${S.week} pts</span></div><div><b>${o && hasProj() ? f1(o.proj) : "–"}</b><span>Projected</span></div><div><b>${Math.round(T.pf)}</b><span>Season PF</span></div>${faab}</div>`;
  const nIss = Object.keys(iss).length + st.filter(id => !id || id === "0").length;
  h += `<div class="sec"><h2>Starters</h2>${nIss ? `<span class="sm red" style="font-weight:600">${nIss} need${nIss === 1 ? "s" : ""} attention</span>` : `<span class="sm green" style="font-weight:600">All set</span>`}</div>`;
  h += `<div class="grp">${slots().map((slot, i) => { const id = st[i], p = P(id); return tRow(p, slot, ptsOf(id), p.empty ? "bad" : iss[id]); }).join("")}</div>`;
  const bench = benchOf(S.myRid).sort((a,b) => PORD.indexOf(a.pos) - PORD.indexOf(b.pos) || val(b.id) - val(a.id));
  if(bench.length) h += `<div class="sec"><h2>Bench</h2><span class="sm c2">${bench.length}</span></div><div class="grp">${bench.map(p => tRow(p, "BN", ptsOf(p.id))).join("")}</div>`;
  if((r.reserve || []).length) h += `<div class="sec"><h2>Injured reserve</h2></div><div class="grp">${r.reserve.map(id => tRow(P(id), "IR", ptsOf(id))).join("")}</div>`;
  if((r.taxi || []).length) h += `<div class="sec"><h2>Taxi squad</h2></div><div class="grp">${r.taxi.map(id => tRow(P(id), "TX", ptsOf(id))).join("")}</div>`;
  h += `<div class="btns"><a class="btn" href="https://sleeper.com/leagues/${S.league.league_id}/team" target="_blank" rel="noopener">Edit lineup in Sleeper</a></div><div class="foot">Tap any player for live stats, game info, and news.</div>`;
  return h;
}

/* ---- Players ---- */
function vPlayers(){
  let h = head("Players", esc(S.league.name));
  const seg = S.seg.players;
  h += `<div class="seg">${[["trending","Trending"],["available","Available"],["news","News"]].map(([k,l]) => `<button data-seg="${k}" class="${seg === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
  if(seg === "news"){
    h += `<div class="chips">${[["mine","My Players"],["league","My League"],["all","All NFL"]].map(([k,l]) => `<button class="chip ${S.seg.news === k ? "on" : ""}" data-nf="${k}">${l}</button>`).join("")}</div>`;
    return h + newsList();
  }
  h += `<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search all players" value="${esc(S.q)}" autocomplete="off" autocorrect="off" spellcheck="false"></div>`;
  h += `<div class="chips">${["ALL","QB","RB","WR","TE","K","DEF"].map(p => `<button class="chip ${S.pos === p ? "on" : ""}" data-pos="${p}">${p}</button>`).join("")}</div>`;
  h += `<div id="plist">${playerList()}</div>`;
  return h;
}
function playerList(){
  const own = ownerMap(), seg = S.seg.players, posOk = p => S.pos === "ALL" || p.pos === S.pos;
  let items = [], note = "";
  if(S.q.trim().length >= 2){
    const q = S.q.trim().toLowerCase();
    items = Object.keys(S.players).filter(id => S.players[id][0].toLowerCase().includes(q)).map(P).filter(posOk)
      .sort((a,b) => (val(b.id) || 0) - (val(a.id) || 0)).slice(0, 40).map(p => ({p}));
  } else if(seg === "trending"){
    if(!S.trendAdd) return `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
    const need = needs();
    items = (S.trendAdd || []).map(t => ({p:P(t.player_id), adds:t.count})).filter(x => x.p.team && posOk(x.p));
    items.forEach(x => x.fit = !own[x.p.id] && x.p.fp.some(f => need.has(f)));
    note = "Most-added across all Sleeper leagues in the last 24 hours.";
  } else {
    items = Object.keys(S.players).filter(id => !own[id]).map(P).filter(p => p.team && posOk(p) && !BAD.has(p.inj))
      .map(p => ({p, v:val(p.id)})).filter(x => x.v > 0).sort((a,b) => b.v - a.v).slice(0, 40);
    note = hasProj() ? "Best free agents by this week's projection." : "Best free agents by points per game.";
  }
  if(!items.length) return `<div class="grp" style="margin-top:12px"><div class="empty">No players here.</div></div>`;
  return `<div class="grp" style="margin-top:12px">${items.map(x => {
    const o = own[x.p.id], ot = o ? team(o) : null, pr = proj(x.p.id), pg = ppg(x.p.id);
    const right = x.adds != null ? `<div class="t1 num" style="font-size:15px">+${x.adds.toLocaleString()}</div><div class="t2">adds</div>` :
      `<div class="t1 num" style="font-size:15px">${pr != null ? f1(pr) : f1(pg)}</div><div class="t2">${pr != null ? "proj" : "ppg"}</div>`;
    const avail = o ? (o === S.myRid ? `<span class="tag b">Yours</span>` : `<span class="c3">${esc(ot.name)}</span>`) : `<span class="tag g">Free agent</span>`;
    return `<button class="cell" data-p="${esc(x.p.id)}">${hs(x.p)}<div class="main"><div class="t1">${esc(x.p.name)}${stBadge(x.p)}</div><div class="t2">${esc(x.p.pos)} · ${esc(x.p.team || "FA")} · ${avail}${x.fit ? ` <span class="tag o">Need</span>` : ""}</div></div><div class="end">${right}</div></button>`;
  }).join("")}</div>${note ? `<div class="foot">${note}</div>` : ""}`;
}
function newsList(){
  if(!S.news) return `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
  const seg = S.seg.news, own = ownerMap();
  const names = rids => { const n = new Set(); Object.keys(own).forEach(id => { if(!rids || rids.has(own[id])) n.add(P(id).name.toLowerCase()); }); return n; };
  const set = seg === "mine" ? names(new Set([S.myRid])) : seg === "league" ? names(null) : null;
  let items = S.news;
  if(set) items = items.filter(a => a.ath.some(x => set.has(x)) || [...set].some(n => n.length > 6 && (a.h + " " + a.d).toLowerCase().includes(n)));
  return items.length ? `<div class="grp" style="margin-top:12px">${items.slice(0, 40).map(a => `<a class="news" href="${esc(a.url)}" target="_blank" rel="noopener"><div style="flex:1;min-width:0"><h4 style="color:var(--label)">${esc(a.h)}</h4><p>${esc(a.d).slice(0, 140)}</p><p class="c3">${ago(a.t)}</p></div>${a.img ? `<div class="im"><img src="${esc(a.img)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></div>` : ""}</a>`).join("")}</div>`
    : `<div class="empty">No recent stories about ${seg === "mine" ? "your players" : "players in your league"}. Try All NFL.</div>`;
}

/* ---- League ---- */
function vLeague(){
  let h = head("League", esc(S.league.name));
  const seg = S.seg.league;
  h += `<div class="seg">${[["standings","Standings"],["scores","Scores"],["activity","Activity"]].map(([k,l]) => `<button data-seg="${k}" class="${seg===k?"on":""}">${l}</button>`).join("")}</div>`;
  if(seg === "standings"){
    const st = standings(), po = (S.league.settings || {}).playoff_teams || 0;
    h += `<div class="grp" style="margin-top:12px">${st.map((t,i) => `<button class="cell" data-team="${t.rid}"><div class="num c2 bold" style="width:18px;text-align:center">${i+1}</div>${av(t, "s")}<div class="main"><div class="t1">${esc(t.name)}${t.rid===S.myRid?' <span class="tag b">You</span>':""}</div><div class="t2">${esc(t.handle)}${t.streak ? " · " + esc(t.streak) : ""}</div></div><div class="end"><div class="t1 num">${rec(t)}</div><div class="t2 num">${f1(t.pf)} PF</div></div></button>${po && i === po-1 && i < st.length-1 ? `<div style="height:2px;background:var(--blue);opacity:.5;margin:0 14px"></div>` : ""}`).join("")}</div>`;
    if(po) h += `<div class="foot">Top ${po} make the playoffs (blue line).</div>`;
  } else if(seg === "scores"){
    const byM = {};
    S.matchups.forEach(m => { if(m.matchup_id != null) (byM[m.matchup_id] = byM[m.matchup_id] || []).push(m); });
    const pairs = Object.values(byM);
    h += `<div class="wkpick" style="justify-content:space-between;margin-top:12px"><button data-wk="-1">‹</button><span class="sm c2">Week ${S.week}</span><button data-wk="1">›</button></div>`;
    h += pairs.length ? `<div class="grp" style="margin-top:10px">${pairs.map(([a,b]) => {
      const A = team(a.roster_id), B = b ? team(b.roster_id) : null, ap = a.points||0, bp = b ? b.points||0 : 0;
      const ln = (T, p, win) => `<div style="display:flex;align-items:center;gap:9px;${win?"":"color:var(--label2)"}">${av(T, "s")}<span class="t1" style="flex:1;font-weight:${win?700:500}">${esc(T.name)}</span><span class="num bold" style="font-size:17px">${f2(p)}</span></div>`;
      return `<button class="cell noimg" data-team="${a.roster_id}" style="flex-direction:column;align-items:stretch;gap:8px">${ln(A, ap, ap >= bp)}${B ? ln(B, bp, bp > ap) : ""}</button>`;
    }).join("")}</div>` : `<div class="empty">No matchups this week.</div>`;
  } else {
    if(!S.tx) return h + `<div class="loading"><div class="spin"></div></div>`;
    h += S.tx.length ? `<div class="grp" style="margin-top:12px">${S.tx.slice(0,40).map(txCell).join("")}</div>` : `<div class="empty">No transactions in the last few weeks.</div>`;
    h += `<div class="foot">Completed trades, waiver claims, and free-agent moves from the last 3 weeks. Pending trade offers only show in Sleeper.</div>`;
  }
  return h;
}
function txCell(t){
  const adds = t.adds || {}, drops = t.drops || {}, when = ago(t.status_updated || t.created);
  if(t.type === "trade"){
    const sides = (t.roster_ids || []).map(r => {
      const got = Object.keys(adds).filter(id => adds[id] === r).map(id => esc(P(id).name));
      (t.draft_picks || []).filter(d => d.owner_id === r).forEach(d => got.push(`${d.season} Rd ${d.round} pick`));
      return `<div class="side"><div class="who">${esc(team(r).name)} gets</div>${got.map(x => `<div>${x}</div>`).join("") || '<div class="c3">Nothing</div>'}</div>`;
    }).join("");

  def:["Defense", [["sack","SACK"],["int","INT"],["fum_rec","FR"],["def_td","TD"],["pts_allow","PA"]]]
};
const POSG = {QB:["pass","rush"], RB:["rush","rec"], WR:["rec","rush"], TE:["rec","rush"], K:["kick"], DEF:["def"]};
function statLines(p, ws){
  const groups = POSG[p.pos] || ["pass","rush","rec"];
  return groups.map((k, gi) => {
    const [t, cols] = SG[k];
    if(gi > 0 && !cols.some(([c]) => ws[c])) return "";

  }).join("");
}
const SLAB = {pass_yd:"Passing yards",pass_td:"Passing TDs",pass_int:"Interceptions thrown",pass_2pt:"2-pt pass",rush_yd:"Rushing yards",rush_td:"Rushing TDs",rush_2pt:"2-pt run",rec:"Receptions",rec_yd:"Receiving yards",rec_td:"Receiving TDs",rec_2pt:"2-pt catch",fum_lost:"Fumbles lost",fum:"Fumbles",xpm:"Extra points",xpmiss:"Missed XPs",fgmiss:"Missed FGs",sack:"Sacks",int:"Interceptions",fum_rec:"Fumble recoveries",def_td:"Defensive TDs",safe:"Safeties",blk_kick:"Blocked kicks",def_st_td:"Return TDs",ff:"Forced fumbles",st_td:"Return TDs",pass_cmp:"Completions",pass_inc:"Incompletions",rush_att:"Carries",pass_att:"Pass attempts"};

  if(SLAB[k]) return SLAB[k]; let m;

/* liquid glass bubble that slides under the selected tab */
/* =============== tab bar: one spring drives the glass lens =============== */
const TB = (() => {
  const nav = $("#nav");
  let b = null, pos = null, vel = 0, target = 0, lift = 0, liftT = 0, raf = 0, last = 0, tint = false, st = null;
  const wrap = () => nav.querySelector(".wrap");
  const btns = () => [...nav.querySelectorAll("button[data-tab]")];
  function ensure(){ const w = wrap(); if(!w) return null; b = w.querySelector(".tbub"); if(!b){ b = document.createElement("i"); b.className = "tbub"; w.prepend(b); } return b; }
  function geom(){ const bs = btns(), w = wrap(); return {bs, rel:bs.map(e => [e.offsetLeft, e.offsetLeft + e.offsetWidth]), bw:bs[0] ? bs[0].offsetWidth : 0, ww:w ? w.offsetWidth : 0}; }
  function paint(g){
    const k = Math.min(.16, Math.abs(vel) / 4800), sc = 1 + lift * .07;
    b.style.width = g.bw + "px";
    b.style.transform = `translateX(${pos.toFixed(2)}px)`;
    b.style.scale = (k > .002 || lift > .002) ? `${(sc + k).toFixed(3)} ${(sc - k * .45).toFixed(3)}` : "";
    if(tint) g.bs.forEach((el, i) => { const [l, r] = g.rel[i], ov = Math.max(0, Math.min(1, (Math.min(pos + g.bw, r) - Math.max(pos, l)) / (r - l))); el.style.setProperty("--p", Math.round(ov * 100) + "%"); });
  }
  function settle(g){
    pos = target; vel = 0; lift = liftT; paint(g); b.style.scale = "";
    if(tint){ tint = false; nav.classList.remove("tinting"); g.bs.forEach(e => e.style.removeProperty("--p")); }
    nav.classList.remove("dragging"); last = 0;
  }
  function tick(now){
    raf = 0;
    try{ step(now); }catch(err){ console.error(err); if(pos != null && ensure()){ try{ settle(geom()); }catch(_){} } }
  }
  function step(now){
    if(!ensure() || pos == null) return;
    const g = geom(), dt = last ? Math.min(.034, (now - last) / 1000) : 1 / 60; last = now;
    const drag = !!(st && st.drag), K = drag ? 1500 : 560, C = 2 * Math.sqrt(K) * (drag ? .92 : .86);
    for(let i = 0; i < 2; i++){ const h = dt / 2; vel += (K * (target - pos) - C * vel) * h; pos += vel * h; }
    lift += (liftT - lift) * Math.min(1, dt * 16);
    paint(g);
    if(!drag && Math.abs(target - pos) < .4 && Math.abs(vel) < 12 && Math.abs(liftT - lift) < .02){ settle(g); return; }
    raf = requestAnimationFrame(tick);
  }
  const run = () => { if(!raf){ last = 0; raf = requestAnimationFrame(tick); } };

    if(st && st.drag) return;

    target = btn.offsetLeft;
    if(pos == null || instant){ pos = target; vel = 0; settle(geom()); return; }
    if(Math.abs(target - pos) > 1){ startTint(); run(); }
  }
  function nearestTo(left){ const g = geom(); let best = 0, bd = Infinity; g.rel.forEach(([l, r], i) => { const d = Math.abs((l + r) / 2 - (left + g.bw / 2)); if(d < bd){ bd = d; best = i; } }); return g.bs[best]; }
  function fingerLeft(x){
    const g = geom(), wl = wrap().getBoundingClientRect().left, max = g.ww - g.bw;
    let l = x - wl - g.bw / 2;
    const band = d => 14 * (1 - 1 / (1 + d / 70)); // never more than ~14px past the edge, with growing resistance
    if(l < 0) l = -band(-l); else if(l > max) l = max + band(l - max);
    return l;
  }
  function beginDrag(){
    if(!st || st.drag) return; st.drag = true;
    nav.classList.add("dragging"); startTint(); liftT = 1;
    target = fingerLeft(st.x); st.cur = nearestTo(target); run();
  }
  function release(){ if(!st) return; clearTimeout(st.timer); st = null; liftT = 0; }
  nav.addEventListener("pointerdown", e => {
    if(e.pointerType === "mouse" && e.button !== 0) return;
    if(!ensure() || pos == null) navBubble();
    try{ nav.setPointerCapture(e.pointerId); }catch(_){}
    st = {id:e.pointerId, x0:e.clientX, y0:e.clientY, x:e.clientX, drag:false, cur:null, btn:e.target.closest("button[data-tab]")};
    st.timer = setTimeout(beginDrag, 230);
  });
  nav.addEventListener("pointermove", e => {
    if(!st || e.pointerId !== st.id) return; st.x = e.clientX;
    if(!st.drag){
      if(Math.abs(e.clientX - st.x0) > 7){ clearTimeout(st.timer); beginDrag(); }
      else if(Math.abs(e.clientY - st.y0) > 34){ release(); const on = nav.querySelector("button.on"); if(on){ target = on.offsetLeft; run(); } }
      return;
    }
    target = fingerLeft(st.x); st.moved = performance.now();
    const n = nearestTo(target);
    if(n !== st.cur){ const g = geom(), c = st.cur ? st.cur.offsetLeft : -1e9; if(Math.abs(target - c) > g.bw * .58){ st.cur = n; haptic(); } }
    run();
  });
  nav.addEventListener("pointerup", e => {
    if(!st || e.pointerId !== st.id) return;
    const s0 = st; release(); navSkipClick = Date.now() + 450;
    if(!s0.drag){
      const hit = document.elementFromPoint(e.clientX, e.clientY), btn = (hit && hit.closest && hit.closest("nav button[data-tab]")) || s0.btn;
      if(btn){ haptic(); navTo(btn.dataset.tab); }
      return;
    }
    // a flick carries the lens on toward the next tab
    const g = geom(), proj = Math.max(0, Math.min(g.ww - g.bw, pos + vel * .09)), btn = nearestTo(proj);
    target = btn.offsetLeft; run();
    if(btn.dataset.tab !== S.tab){ haptic(); navTo(btn.dataset.tab); }
  });
  function abort(){
    if(!st) return; release();
    const on = nav.querySelector("button.on"); if(on){ target = on.offsetLeft; run(); }
  }
  nav.addEventListener("pointercancel", e => { if(st && e.pointerId === st.id) abort(); });
  nav.addEventListener("lostpointercapture", e => { if(st && e.pointerId === st.id) setTimeout(() => { if(st && st.id === e.pointerId) abort(); }, 0); });
  addEventListener("blur", abort);
  document.addEventListener("visibilitychange", () => { if(document.hidden){ abort(); if(pos != null && ensure()){ cancelAnimationFrame(raf); raf = 0; settle(geom()); } } });
  // safety net: if the lens is ever left lifted or tinted with no finger down, put it back
  setInterval(() => { if(!st && !raf && (lift > .01 || tint || nav.classList.contains("dragging"))){ liftT = 0; const on = nav.querySelector("button.on"); if(on) target = on.offsetLeft; run(); } }, 400);
  return {to};
})();
function navBubble(instant){
  const on = $("#nav button.on"); if(!on) return;
  if(!on.offsetWidth){ requestAnimationFrame(() => { if(on.offsetWidth) navBubble(true); }); return; }
  TB.to(on, instant);
}
addEventListener("resize", () => navBubble(true));

/* large title shrinks and fades into the bar; stretches on overscroll */
function titleFx(y){
  const bar = $("#bar"); if(bar) bar.style.setProperty("--bo", Math.min(1, Math.max(0, (y - 8) / 36)).toFixed(3));
  const mini = $("#miniTitle"); if(mini) mini.style.opacity = Math.min(1, Math.max(0, (y - 28) / 22)).toFixed(3);
  const lt = $("#app .lt"); if(!lt) return;
  if(y < 0){ lt.style.transform = `scale(${Math.min(1.1, 1 + (-y) / 650).toFixed(3)})`; lt.style.opacity = 1; }
  else { const p = Math.min(1, y / 46); lt.style.transform = `translateY(${(p * 8).toFixed(1)}px) scale(${(1 - p * .08).toFixed(3)})`; lt.style.opacity = (1 - p).toFixed(3); }
}

/* segmented controls: a pill that slides between options */
const segMem = {};
function segPills(root){
  const scope = root || $("#app"), pre = root ? "sh" : S.tab;
  scope.querySelectorAll(".seg").forEach((sg, i) => {
    const on = sg.querySelector("button.on"); if(!on) return;
    let pl = sg.querySelector(".pill"); if(!pl){ pl = document.createElement("i"); pl.className = "pill"; sg.prepend(pl); }
    const k = pre + i, x = on.offsetLeft, w = on.offsetWidth, prev = segMem[k];
    pl.style.transition = "none"; pl.style.width = w + "px"; pl.style.transform = `translateX(${prev != null ? prev : x}px)`;
    void pl.offsetWidth; pl.style.transition = ""; pl.style.transform = `translateX(${x}px)`; segMem[k] = x;
  });
}
document.addEventListener("click", e => { const b = e.target.closest("#shBody .seg button"); if(b) setTimeout(() => segPills($("#shBody")), 0); });

/* sheets: drag with the finger, rubber-band, snap to full / half / closed by flick speed */
let sheetBase = 0;
function sheetReset(){ sheetBase = 0; const sh = $("#sheet"); sh.classList.remove("drag"); sh.style.transform = ""; const sc = $("#scrim"); sc.classList.remove("dragging"); sc.style.opacity = ""; }
(function(){
  const sh = $("#sheet"), body = $("#shBody"), scrim = $("#scrim");
  let y0 = null, off = 0, mode = null, onHdr = false, H = 0, trail = [];
  const half = () => { const m = H - innerHeight * .55; return m > 90 ? m : null; };
  const place = (y, live) => {
    sh.classList.toggle("drag", live); scrim.classList.toggle("dragging", live);
    sh.style.transform = y ? `translateY(${y}px)` : "";
    scrim.style.opacity = Math.max(0, Math.min(1, 1 - y / H)).toFixed(3);
  };
  body.addEventListener("scroll", () => sh.classList.toggle("scrolled", body.scrollTop > 2), {passive:true});
  sh.addEventListener("touchstart", e => {
    const t = e.touches[0]; y0 = t.clientY; mode = null; H = sh.offsetHeight; off = sheetBase;
    onHdr = !!e.target.closest(".sh") || e.target === sh; trail = [[t.clientY, e.timeStamp]];
  }, {passive:true});
  sh.addEventListener("touchmove", e => {
    if(y0 == null) return; const t = e.touches[0], dy = t.clientY - y0;
    if(!mode){
      if(Math.abs(dy) < 5) return;
      mode = (onHdr || (body.scrollTop <= 0 && dy > 0) || (sheetBase > 0 && dy < 0 && body.scrollTop <= 0)) ? "drag" : "scroll";
    }
    if(mode !== "drag") return;
    e.preventDefault();
    let y = sheetBase + dy; if(y < 0) y = -Math.sqrt(-y) * 2.4;
    off = y; place(y, true);
    trail.push([t.clientY, e.timeStamp]); if(trail.length > 5) trail.shift();
  }, {passive:false});
  const end = () => {
    if(y0 == null) return; y0 = null; if(mode !== "drag") return;
    const a = trail[0], b = trail[trail.length - 1], dt = b[1] - a[1];
    const v = dt > 0 ? (b[0] - a[0]) / dt : 0, proj = off + v * 200;
    const pts = [0], m = half(); if(m != null) pts.push(m); pts.push(H);
    const tgt = pts.reduce((p, c) => Math.abs(c - proj) < Math.abs(p - proj) ? c : p);
    sh.classList.remove("drag"); scrim.classList.remove("dragging");
    if(tgt === H){ haptic(); closeSheet(); return; }
    if(tgt !== sheetBase) haptic();
    sheetBase = tgt; place(tgt, false);
  };
  sh.addEventListener("touchend", end); sh.addEventListener("touchcancel", end);
})();

/* =============== boot =============== */
function loading(msg){ $("#app").innerHTML = `<div class="loading"><div class="spin"></div>${esc(msg)}</div>`; }
function fail(e){
  $("#app").innerHTML = `<div class="setup"><h1>Couldn't load</h1><div class="c2">${esc((e && e.message) || e)}. Check your connection and try again.</div><button class="btn" onclick="location.reload()">Try again</button></div>`;
}
function setup(){
  $("#bar").style.display = "none"; $("#nav").style.display = "none"; $("#fab").style.display = "none";
  $("#app").innerHTML = `<form class="setup" id="sf"><div style="width:76px;height:76px">${abot("")}</div><h1>Audible</h1>
    <div class="c2" style="font-size:17px">Your Sleeper leagues with live scores, lineup alerts, waivers, news, and your own AI coach, all in one place. Enter your Sleeper username to start. No password needed.</div>
    <input class="field" id="un" placeholder="Sleeper username" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username">
    <div class="err" id="err"></div><button class="btn" type="submit">Continue</button></form>`;
  $("#sf").onsubmit = async e => {
    e.preventDefault(); const n = $("#un").value.trim(); if(!n) return;
    $("#err").textContent = "Looking you up…";
    try{
      const u = await api(`/user/${encodeURIComponent(n)}`);
      if(!u || !u.user_id){ $("#err").textContent = "Couldn't find that username on Sleeper."; return; }
      store.set("gd_user", {user_id:u.user_id, username:n, display_name:u.display_name, avatar:u.avatar});
      if(await tryRestore(n)) restoreScreen(n, boot); else boot();
    }catch(err){ $("#err").textContent = "Couldn't reach Sleeper. Check your connection."; }
  };
}
async function boot(){
  loadSettings();
  S.user = store.get("gd_user");
  if(!S.user) return setup();
  loading("Loading your leagues…");
  try{
    S.state = await api("/state/nfl");
    S.state.week = Math.max(1, S.state.week || S.state.display_week || 1);
    await loadPlayers(false);
    const season = S.state.league_season || S.state.season;
    S.leagues = (await api(`/user/${S.user.user_id}/leagues/nfl/${season}`)) || [];
    if(!S.leagues.length){
      $("#app").innerHTML = `<div class="setup"><h1>No leagues found</h1><div class="c2">${esc(S.user.display_name)} isn't in any NFL leagues this season.</div><button class="btn" id="ag">Try another username</button></div>`;
      $("#ag").onclick = () => { store.del("gd_user"); setup(); }; return;
    }
    S.league = S.leagues.find(l => l.league_id === store.get("gd_league")) || S.leagues[0];
    S.week = S.state.week; S.tab = TITLES[S.set.startTab] ? S.set.startTab : "home";
    loading("Loading " + S.league.name + "…");
    await loadLeague();
    $("#bar").style.display = ""; $("#nav").style.display = ""; $("#fab").style.display = "";
    render(true); startLive();
    if(location.hash && route(location.hash)) history.replaceState(null, "", location.pathname + location.search);
    syncWatcher(false);
    const seen = store.get("gd_seen_ver");
    if(seen !== VERSION){ if(seen || store.get("gd_settings")) setTimeout(() => openWhatsNew(false), 700); else store.set("gd_seen_ver", VERSION); }
  }catch(e){ fail(e); }
}
boot();
})();
</script>
