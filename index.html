<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Audible">
<meta name="theme-color" content="#06080f">
<style>
#boot{position:fixed;inset:0;z-index:999;background:#06080f;display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;
  transition:opacity .34s ease-out}
#boot.gone{opacity:0;pointer-events:none}
#boot .bbot{width:108px;height:108px;transition:transform .3s cubic-bezier(.32,.72,0,1)}
/* ---- launch animation: the headset builds itself on the way down ---- */
#boot .bbot svg{overflow:visible}
#boot .hd0{transform-origin:0px 42px}
#boot .face{transform-origin:0px 6px}
#boot .set{transform-origin:0px 0px}
#boot .eye,#boot .dot,#boot .dotg,#boot .sweep,#boot .flare{opacity:0}
#boot .bbot{opacity:0}
#boot.go .bbot{animation:bfade .34s ease-out both}
#boot .dotg{opacity:0}
#boot.go .set{animation:bdrop .72s cubic-bezier(.4,.1,.5,.9) .22s both}
#boot.go .band{animation:bunfurl .3s cubic-bezier(.3,1.3,.5,1) .34s both;transform-origin:0px 4px}
#boot.go .cupL{animation:btele .3s cubic-bezier(.3,1.35,.5,1) .44s both;transform-origin:-42.5px -14px}
#boot.go .cupR{animation:btele .3s cubic-bezier(.3,1.35,.5,1) .44s both;transform-origin:42.5px -14px}
#boot.go .boom{animation:bswing .26s cubic-bezier(.3,1.4,.5,1) .58s both;transform-origin:46px 14px}
#boot.go .hd0{animation:bslam .92s cubic-bezier(.3,1.44,.6,1) .92s both}
#boot.go .face{animation:bface .92s cubic-bezier(.3,1.44,.6,1) .92s both}
#boot.go .eye{animation:bpower .8s linear .96s both}
#boot.go .sweep{animation:bsweep .46s ease-out 1.34s both}
#boot.go .flare{animation:bflare .44s ease-out 1.4s both}
#boot.go .dot{animation:bdot .5s ease 1.58s both}
#boot.go .dotg{animation:bdotg .5s ease 1.58s both}
/* enters fast so you can see it, drifts while it assembles, then slams */
@keyframes bdrop{
  0%{transform:translateY(calc(var(--trv,480px) * -1))}
  18%{transform:translateY(calc(var(--trv,480px) * -.52))}
  32%{transform:translateY(calc(var(--trv,480px) * -.38))}
  64%{transform:translateY(calc(var(--trv,480px) * -.16))}
  85%{transform:translateY(7px)}
  93%{transform:translateY(-2.5px)}
  100%{transform:translateY(0)}}
@keyframes bfade{from{opacity:0}to{opacity:1}}
@keyframes bunfurl{0%{transform:scale(.18,.3);opacity:0}24%{opacity:1}100%{transform:none;opacity:1}}
@keyframes btele{0%{transform:translateY(-9px) scale(.2);opacity:0}26%{opacity:1}100%{transform:none;opacity:1}}
@keyframes bswing{0%{transform:rotate(-104deg);opacity:0}26%{opacity:1}100%{transform:rotate(0);opacity:1}}
@keyframes bslam{0%{transform:translateY(14px) rotate(6deg) scaleY(.93)}9%{transform:translateY(19px) rotate(6.5deg) scaleY(.91)}46%{transform:translateY(-3px) rotate(-2.4deg) scaleY(1.01)}72%{transform:translateY(0) rotate(1deg)}88%{transform:rotate(-.4deg)}100%{transform:none}}
@keyframes bface{0%{transform:translateY(6px) scaleY(.78)}9%{transform:translateY(8px) scaleY(.74)}100%{transform:none}}
@keyframes bpower{0%,8%{opacity:0;transform:scaleY(.1)}12%{opacity:.3;transform:scaleY(.72)}17%{opacity:0;transform:scaleY(.1)}23%{opacity:.4;transform:scaleY(.82)}29%{opacity:.04;transform:scaleY(.2)}36%{opacity:.75;transform:scaleY(1)}40%{opacity:.1;transform:scaleY(.4)}45%{opacity:.85;transform:scaleY(1)}49%{opacity:.15;transform:scaleY(.5)}54%{opacity:.9;transform:scaleY(1)}58%{opacity:.3;transform:scaleY(.8)}68%{opacity:1;transform:scaleY(1.3)}84%,100%{opacity:1;transform:scaleY(1)}}
@keyframes bsweep{0%{opacity:0;transform:translateX(-46px)}25%{opacity:.5}100%{opacity:0;transform:translateX(46px)}}
@keyframes bflare{0%{opacity:0;transform:scale(.25)}30%{opacity:.8;transform:scale(1.45)}100%{opacity:0;transform:scale(2)}}
@keyframes bdot{0%{opacity:0}18%{opacity:1}30%{opacity:.1}44%{opacity:1}58%{opacity:.35}100%{opacity:1}}
@keyframes bdotg{0%{opacity:0}18%{opacity:.22}30%{opacity:.02}44%{opacity:.22}58%{opacity:.08}100%{opacity:.22}}
/* ---- still loading: he keeps working instead of freezing ----
   Once the intro has played, a slow launch used to leave a finished, static
   logo on screen. Now his eyes scan and blink, the headset light pulses, and a
   bar under him tracks the real steps of the load. */
#boot.wait .eye{opacity:1;animation:bscan 2.8s cubic-bezier(.45,0,.55,1) infinite}
#boot.wait .dot{opacity:1;animation:bpulse 1.4s ease-in-out infinite}
#boot.wait .dotg{animation:bpulseg 1.4s ease-in-out infinite;transform-origin:42.5px -7px}
#boot.wait .sweep{animation:bsweep 2.8s ease-out 1.1s infinite}
#boot.wait .hd0,#boot.wait .set{animation:bbob 2.8s ease-in-out infinite}
@keyframes bscan{0%,100%{transform:translateX(0) scaleY(1)}14%,30%{transform:translateX(-3.4px) scaleY(1)}33%{transform:translateX(-3.4px) scaleY(.1)}36%{transform:translateX(-3.4px) scaleY(1)}58%,76%{transform:translateX(3.4px) scaleY(1)}79%{transform:translateX(3.4px) scaleY(.1)}82%{transform:translateX(3.4px) scaleY(1)}}
@keyframes bpulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bpulseg{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.5;transform:scale(1.7)}}
@keyframes bbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
#boot .bprog{position:absolute;left:50%;top:calc(50% + 84px);width:136px;height:3px;margin-left:-68px;border-radius:2px;
  background:rgba(255,255,255,.1);overflow:hidden;opacity:0;transition:opacity .4s ease}
#boot .bprog.on{opacity:1}
#boot .bprog i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#3d6af2,#5fd4ff);
  transform-origin:0 50%;transform:scaleX(0);transition:transform .55s cubic-bezier(.3,.7,.2,1)}
#boot .bprog::after{content:"";position:absolute;top:0;bottom:0;width:38px;left:-38px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:bglint 1.5s ease-in-out infinite}
@keyframes bglint{0%{transform:translateX(0)}100%{transform:translateX(176px)}}
/* no motion: show him finished, leave straight away */
@media (prefers-reduced-motion:reduce){
  #boot .set,#boot .band,#boot .cupL,#boot .cupR,#boot .boom,#boot .hd0,#boot .face,#boot .eye,#boot .sweep,#boot .flare,#boot .dot,#boot.go .dotg{animation:none!important}
  #boot .bbot{opacity:1}#boot .eye,#boot .dot{opacity:1}#boot .dotg{opacity:.22}#boot .sweep,#boot .flare{opacity:0}
  #boot .bprog::after{animation:none;display:none}
}
#boot.gone .bbot{transform:scale(.92)}
#boot .bbot svg{width:100%;height:100%;display:block}
#boot .bmsg{position:absolute;left:0;right:0;top:calc(50% + 100px);padding:0 28px;text-align:center;
  font-size:14px;font-weight:500;color:rgba(255,255,255,.42);opacity:0;transition:opacity .45s ease}
#boot .bmsg.on{opacity:1}
/* ---- 1.4.1 crisp top: blur only when it's actually visible ---- */
/* the bar's frost layer used to exist even at opacity 0, and WebKit folded
   the profile button into that composited layer. Blur now switches on with the bar. */
.bar::before{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.bar.frost::before{backdrop-filter:var(--frost)!important;-webkit-backdrop-filter:var(--frost)!important}
.bar .wrap{isolation:isolate}

/* ---- toast: text out of the filtered layer, swipe up to dismiss ---- */
.toast{position:relative;isolation:isolate;background:transparent!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none;
  animation:tin .5s var(--spring);pointer-events:auto;touch-action:none;cursor:grab;
  transform:translateY(0);opacity:1}
.toast::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;
  background:var(--glass);backdrop-filter:var(--frost);-webkit-backdrop-filter:var(--frost);
  box-shadow:0 12px 34px rgba(0,0,0,.28),0 0 0 .5px var(--sep)}
.toast.settle{transition:transform .5s var(--spring)}
.toast.out{transition:transform .32s var(--ios),opacity .26s ease;transform:translateY(-52px);opacity:0}
.reduce .toast.out{transition:opacity .2s}
/* ---- full-screen overlays: nothing underneath should keep a blur layer ----
   The bar sits behind the chat and the sheet. Its frosted pseudo-element was
   still being composited there, which softened the header text above it.
   It is not visible while an overlay is up, so drop the filter entirely. */
html.ovl .bar::before{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.ovl nav{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
/* the chat slides in on a transform, which rasterises its header once and
   leaves it soft. Give it its own context and re-raster when the slide ends. */
/* ---- no filtered layers at the top of the screen, anywhere ----
   Every report of blurred text at the top traced back to a composited
   layer up there: a backdrop-filter, or an element promoted with
   translateZ. WebKit rasterises those below device resolution, which
   softens text and images inside them. The bar is opaque now. */
.bar::before{background:#0b0b0d!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html[data-theme=light] .bar::before{background:#fafafc!important}
.circ{background:#2c2c2e!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html[data-theme=light] .circ{background:#fff!important}
.bar,.bar *,.chd,.chd *,.pfb,.pfb img{will-change:auto!important;transform:none}
.pfb:active{transform:scale(.9)}
/* ---- the chat header lives outside the sliding panel ----
   .chat slides in on a transform, which promotes the whole panel to a GPU
   layer. The log inside it scrolls and so keeps repainting at full
   resolution, but the header never moves, so it kept whatever scale the
   layer was rasterised at. Measured on a device: header text edges 5px,
   body text 1px, on the same screen. The header is now a sibling that
   never transforms. */
/* ---- chat header ----
   The header is the first row of the chat panel again. It lived outside the
   panel as its own fixed layer for a while, to dodge a blur that turned out to
   be iOS's, and two fixed layers can be moved apart: when the keyboard pans
   the screen the panel was following and the header was not, so Done and
   Clear ended up under the clock. One box cannot come apart. */
.chat .chd{flex:none;position:relative;z-index:2;max-width:none;width:100%;margin:0;padding:calc(10px + var(--sat)) 16px 10px;background:#0b0b0d}
html[data-theme=light] .chat .chd{background:#fafafc}
.chat{padding-top:0}
/* iOS 26 keyboards are glass: anything the panel does not cover shows through.
   Paint well past both ends of the panel so the page behind never does. */
.chat.on.cov{box-shadow:0 0 0 100vh var(--bg)}
/* ---- big plays carry weight ---- */
.play.big{position:relative}
.play.big::after{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
.play.t-td::after{background:var(--green)}
.play.t-turn::after,.play.t-sack::after{background:var(--red)}
.play.t-fg::after{background:var(--blue)}
.play.t-td{background:linear-gradient(90deg,rgba(48,209,88,.10),transparent 42%)}
.play.t-turn{background:linear-gradient(90deg,rgba(255,69,58,.10),transparent 42%)}
.play.t-exp{background:linear-gradient(90deg,rgba(255,159,10,.10),transparent 42%)}
.play.t-td .pt,.play.t-exp .pt{font-weight:600}
.tag.b{background:rgba(10,132,255,.18);color:#4da3ff}
/* ---- the field ----
   svg.field shares a class name with the sign-in text box and had been
   inheriting its 15px padding and background, which is why the field sat
   small inside its card. */
svg.field{padding:0;background:none;border-radius:0;font-size:inherit}
.field .ezflash,.field .tdbn,.field .gain,.field .ring,.field .gpglow{pointer-events:none}
.field .ezflash.lit{animation:ezlit 1.1s ease-out both}
@keyframes ezlit{0%{opacity:0}9%{opacity:.82}26%{opacity:.16}42%{opacity:.66}100%{opacity:0}}
.field .gain .gin,.field .ring{transform-box:fill-box;transform-origin:center}
.field .gain.in .gin{animation:gin .4s cubic-bezier(.3,1.45,.5,1) both}
.field .gain.in.big .gin{animation:ginb .58s cubic-bezier(.25,1.5,.4,1) both}
@keyframes gin{0%{opacity:0;transform:translateY(5px) scale(.8)}100%{opacity:1;transform:none}}
@keyframes ginb{0%{opacity:0;transform:scale(.4)}58%{opacity:1;transform:scale(1.13)}100%{opacity:1;transform:none}}
.field .ring.go{animation:fring .78s cubic-bezier(.2,.7,.3,1) both}
@keyframes fring{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(3.6)}}
.field .gp.lit .gpglow{animation:gplit 1.6s ease-out both}
@keyframes gplit{0%{opacity:0}16%{opacity:1}40%{opacity:.45}58%{opacity:.95}100%{opacity:0}}
.reduce .field .ezflash.lit,.reduce .field .gain .gin,.reduce .field .ring.go,.reduce .field .gp.lit .gpglow{animation:none}
/* ---- "this guy did something" marker on roster rows ---- */
.bp{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:800;
  letter-spacing:.03em;vertical-align:1px;line-height:1.5}
.bp.td{background:rgba(48,209,88,.20);color:#30d158}
.bp.fg{background:rgba(10,132,255,.18);color:#4da3ff}
.bp.to{background:rgba(255,69,58,.18);color:#ff6961}
/* ---- interactive tour ----
   The overlay no longer eats every touch. It is pointer-events:none, and four
   blocker panels around the spotlight swallow taps instead, so the only live
   part of the screen is the thing being pointed at. */
.tour{pointer-events:none;touch-action:auto}
.tour .blk{position:absolute;display:block;pointer-events:auto;touch-action:none}
.tour .tip{pointer-events:auto}
.tour .hole{transition:all .45s var(--ios),opacity .2s}
.tour.paused .hole,.tour.paused .tip,.tour.paused .blk{opacity:0;pointer-events:none}
.tour.paused .blk{display:none}
.tour .tip{transition:top .45s var(--ios),opacity .25s}
.tour .next.ghost{background:transparent;color:var(--label2);box-shadow:inset 0 0 0 1px var(--sep)}
.tour .tdemo{margin:12px 0 4px}
.tour .tdemo .field{width:100%;display:block;border-radius:12px}
.tour .tdemo .tdrow{margin-top:10px}
.tour .tdemo .play{padding:8px 10px}
.tour .tdemo .play .pt{font-size:13px}
/* ---- touchdown banner, in the spirit of ESPN's ---- */
.field .tdbig{fill:#fff;font:italic 900 27px -apple-system,system-ui,sans-serif;letter-spacing:.012em}
.field .tdsub{fill:#fff;fill-opacity:.86;font:700 8.4px -apple-system,system-ui,sans-serif;letter-spacing:.16em}
.field .tdghost{fill:#fff;fill-opacity:.14;font:italic 900 60px -apple-system,system-ui,sans-serif;text-anchor:end;letter-spacing:-.015em}
.field .tdbig,.field .tdsub,.field .tdghost,.field .tdrule{transform-box:fill-box;transform-origin:0% 100%}
.field .tdbn.run{animation:tdbn 2.6s linear both}
.field .tdbn.run .tdst{animation:tdst 2.6s linear both}
.field .tdbn.run .tdbig{animation:tdbig 2.6s cubic-bezier(.2,.9,.25,1) both}
.field .tdbn.run .tdrule{animation:tdrule 2.6s cubic-bezier(.2,.9,.25,1) both}
.field .tdbn.run .tdsub{animation:tdsub 2.6s ease both}
.field .tdbn.run .tdghost{animation:tdgh 2.6s cubic-bezier(.2,.8,.3,1) both}
@keyframes tdbn{0%{opacity:0}7%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes tdst{0%{transform:translateX(-46px)}100%{transform:translateX(34px)}}
@keyframes tdbig{0%{opacity:0;transform:translateX(-74px) skewX(-18deg)}15%{opacity:1;transform:translateX(6px) skewX(-5deg)}23%{transform:translateX(0) skewX(0)}84%{opacity:1;transform:translateX(4px)}100%{opacity:0;transform:translateX(28px)}}
@keyframes tdrule{0%,13%{transform:scaleX(0)}33%{transform:scaleX(1)}85%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}
@keyframes tdsub{0%,25%{opacity:0;transform:translateY(4px)}39%{opacity:1;transform:translateY(0)}85%{opacity:1}100%{opacity:0}}
@keyframes tdgh{0%{opacity:0;transform:translateX(54px)}20%{opacity:1}100%{opacity:1;transform:translateX(-12px)}}
.reduce .field .tdbn.run,.reduce .field .tdbn.run *{animation:none}
</style>

<title>Audible</title>
<style>
:root{
  --bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--bg4:#3a3a3c;--sep:rgba(84,84,88,.55);
  --label:#fff;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.32);--fill:rgba(118,118,128,.24);
  --green:#30d158;--red:#ff453a;--orange:#ff9f0a;--yellow:#ffd60a;--blue:#0a84ff;--purple:#bf5af2;--teal:#64d2ff;
  --green-t:rgba(48,209,88,.16);--red-t:rgba(255,69,58,.16);--orange-t:rgba(255,159,10,.16);--blue-t:rgba(10,132,255,.16);
  --bar:rgba(22,22,24,.86);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html[data-theme=light]{
  --bg:#f2f2f7;--bg2:#fff;--bg3:#e9e9ee;--bg4:#d1d1d6;--sep:rgba(60,60,67,.18);
  --label:#000;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.32);--fill:rgba(118,118,128,.12);
  --green:#28b14c;--red:#ff3b30;--orange:#f08c00;--yellow:#e0b400;--blue:#007aff;--purple:#af52de;--teal:#1ea7d6;
  --green-t:rgba(40,177,76,.12);--red-t:rgba(255,59,48,.12);--orange-t:rgba(240,140,0,.13);--blue-t:rgba(0,122,255,.1);
  --bar:rgba(249,249,251,.88);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);font:16px/1.32 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body{min-height:100vh;padding-bottom:calc(84px + var(--sab))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--label)}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}
.c2{color:var(--label2)}.c3{color:var(--label3)}.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}
.sm{font-size:13px}.xs{font-size:11px}
.bold{font-weight:700}

/* top bar */
.bar{position:sticky;top:0;z-index:20;padding-top:var(--sat);background:transparent;transition:background .2s}
.bar.solid{background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.bar .wrap{height:52px;display:flex;align-items:center;justify-content:space-between}
.bar .mini{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s}
.bar.solid .mini{opacity:1}
.circ{width:40px;height:40px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;box-shadow:0 0 0 .5px var(--sep)}
.circ svg{width:21px;height:21px;stroke:var(--label);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html[data-theme=light] .circ{background:var(--bg2);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar .acts{display:flex;gap:12px}
.lt{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:2px 0 0;line-height:1.1}
.sub{color:var(--label2);font-size:15px;margin:3px 0 4px;display:flex;align-items:center;gap:6px}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);padding-bottom:var(--sab)}
nav .wrap{display:flex;padding:0 4px}
nav button{flex:1;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--label3);position:relative}
nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--blue)}
.badge{position:absolute;top:2px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}

/* sections + groups */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 9px}
.sec h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em}
.sec button,.sec a{color:var(--blue);font-size:15px}
.grp{background:var(--bg2);border-radius:14px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;min-height:52px}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:62px;height:.5px;background:var(--sep)}
.cell.noimg+.cell::before,.cell.noimg::before{left:14px}
button.cell{width:100%;text-align:left}
.cell .main{flex:1;min-width:0}
.t1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.end{text-align:right;flex:none}
.chev{width:8px;height:13px;flex:none;stroke:var(--label3);fill:none;stroke-width:2.2}
.foot{text-align:center;font-size:12px;color:var(--label3);margin:16px 12px}
.empty{padding:22px 16px;text-align:center;color:var(--label2);font-size:15px}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:12px 0 4px}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:13px;font-weight:600;color:var(--label)}
.seg button.on{background:var(--bg4);box-shadow:0 2px 6px rgba(0,0,0,.18)}
html[data-theme=light] .seg button.on{background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 13px;border-radius:999px;background:var(--bg2);font-size:14px;font-weight:600;color:var(--label)}
.chip.on{background:var(--label);color:var(--bg)}
.search{display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:10px;padding:8px 10px;margin-top:12px}
.search svg{width:16px;height:16px;stroke:var(--label2);fill:none;stroke-width:2.2;flex:none}
.search input{flex:1;background:none;border:0;outline:none;font-size:16px;min-width:0}

/* avatars & headshots */
.hs{position:relative;width:38px;height:38px;border-radius:50%;background:var(--bg3);flex:none;overflow:hidden;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--label2)}
.hs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.hs.def img{inset:16%;width:68%;height:68%;object-fit:contain}
.hs.lg{width:84px;height:84px;font-size:24px}
.av{position:relative;width:44px;height:44px;border-radius:50%;background:var(--bg3);overflow:hidden;display:grid;place-items:center;font-weight:700;color:var(--label2);flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.s{width:30px;height:30px;font-size:13px}
.av.l{width:54px;height:54px;font-size:20px}

/* status pills */
.st{display:inline-block;font-size:11px;font-weight:700;padding:1px 5px;border-radius:5px;margin-left:5px;vertical-align:2px;letter-spacing:0}
.st.Q{background:var(--orange-t);color:var(--orange)}
.st.O,.st.IR,.st.D,.st.S,.st.BYE{background:var(--red-t);color:var(--red)}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.g{background:var(--green-t);color:var(--green)}.tag.b{background:var(--blue-t);color:var(--blue)}.tag.o{background:var(--orange-t);color:var(--orange)}.tag.r{background:var(--red-t);color:var(--red)}

/* score bug */
.bug{background:var(--bg2);border-radius:18px;padding:16px 16px 14px;margin-top:12px}
.brow{display:flex;align-items:center;gap:12px;padding:5px 0}
.brow .bi{flex:1;min-width:0}
.bug .nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bug .rec{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.bug .sc{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.bug .sc.lose{color:var(--label3)}
.wp{margin-top:14px}
.wp .lbls{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:5px;font-variant-numeric:tabular-nums}
.wp .track{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden;display:flex}
.wp .track i{display:block;height:100%;background:var(--green);transition:width .6s}
.wp .track i+i{background:var(--blue)}
.pop{animation:pop .75s ease}
@keyframes pop{30%{transform:scale(1.14);color:var(--green)}}
.wkpick{display:flex;align-items:center;gap:6px}
.wkpick button{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--blue);font-size:18px;font-weight:600;display:grid;place-items:center}
.wkrow{justify-content:space-between;margin-top:10px}
.wkmid{display:flex;flex-direction:column;align-items:center;gap:2px}
.wkmid small{font-size:12px;color:var(--label3)}
.wkl{display:inline-flex;align-items:center;gap:7px}
.wkl b{font-size:15px;font-weight:600}
.wkt{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--label2)}
.wkt.live{background:rgba(255,69,58,.18);color:var(--red)}
.wkt.cur{background:rgba(10,132,255,.18);color:var(--blue)}
.wkt.next{background:rgba(255,159,10,.16);color:var(--orange,#ff9f0a)}
.wkpick button.wknow,.wkc button.wknow{width:auto;height:auto;border-radius:0;background:none;font-size:13px;font-weight:600;color:var(--blue);padding:0}
.wkc{display:flex;align-items:center;gap:8px;align-self:center;white-space:nowrap;flex:none}
.wkl,.wknow{white-space:nowrap}
.wkc button{width:26px;height:26px;border-radius:50%;background:var(--fill);color:var(--blue);font-size:16px;font-weight:600;display:grid;place-items:center}
.wkc .wknow{margin-right:4px}

/* matchup rows */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr);align-items:center;gap:4px;padding:9px 10px;position:relative}
.mrow+.mrow::before{content:"";position:absolute;top:0;left:10px;right:10px;height:.5px;background:var(--sep)}
.mp{display:flex;align-items:center;gap:7px;min-width:0}
.mp.r{flex-direction:row-reverse;text-align:right}
.mp .hs{width:32px;height:32px}
/* name truncates, but the injury badge and news dot always stay visible */
.mp .n{display:flex;align-items:center;gap:0;overflow:visible}
.mp .n .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp .n .st,.mp .n .ndot{flex:none}
.mp.r .n{justify-content:flex-end}
/* slimmer position chip buys room for names and points */
.mrow{grid-template-columns:minmax(0,1fr) 32px minmax(0,1fr)!important;gap:4px!important;padding-left:8px!important;padding-right:8px!important}
.mrow .slot{width:32px;padding:3px 0;border-radius:6px}
.mp{gap:7px}
.mp .pts{min-width:32px;margin-left:2px}
.mp.r .pts{margin-left:0;margin-right:2px}
.mp .i{flex:1;min-width:0}
.mp .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp .g{font-size:11px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp .pts{text-align:right;min-width:36px}
.mp.r .pts{text-align:left}
.mp .pts b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.mp .pts small{font-size:11px;color:var(--label3);font-variant-numeric:tabular-nums}
.mp.done .pts b{color:var(--label)}
.mp.live .g{color:var(--green)}
.slot{justify-self:center;font-size:10px;font-weight:700;color:var(--label2);background:var(--fill);border-radius:6px;padding:4px 0;width:40px;text-align:center;letter-spacing:.02em}
.mrow.flash{animation:flash 1.8s ease}
@keyframes flash{0%{background:var(--green-t)}100%{background:transparent}}

/* games rail */
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{display:none}
.game{flex:none;width:168px;background:var(--bg2);border-radius:14px;padding:11px 12px;scroll-snap-align:start}
.game .gr{display:flex;align-items:center;gap:8px;height:26px}
.game .gr img{width:22px;height:22px;object-fit:contain}
.game .gr .ab{flex:1;font-weight:700;font-size:15px}
.game .gr .s{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.game .gr.l .ab,.game .gr.l .s{color:var(--label2)}
.game .gs{font-size:12px;color:var(--label2);margin-top:6px;display:flex;justify-content:space-between;gap:6px}
.game .gs .live{color:var(--red);font-weight:600}
.game .mine{font-size:11px;color:var(--blue);font-weight:600;margin-top:3px}

/* audible */
.bot{background:linear-gradient(160deg,rgba(10,132,255,.22),rgba(191,90,242,.14) 60%,transparent),var(--bg2);border-radius:18px;padding:14px 14px 6px;margin-top:14px}
.bot .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px;padding:0}
.bot .hd .chev{margin-left:4px}
.boticon{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;flex:none}
.boticon svg{width:20px;height:20px;fill:#fff}
.bot .hd b{display:block;font-size:16px}
.bot .hd span{font-size:12px;color:var(--label2)}
.ins{display:flex;gap:11px;padding:10px 0;border-top:.5px solid var(--sep);text-align:left;width:100%}
.ins:first-of-type{border-top:0}
.ins .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.ins .dot.bad{background:var(--red)}.ins .dot.warn{background:var(--orange)}.ins .dot.good{background:var(--green)}.ins .dot.info{background:var(--blue)}
.ins .tx{flex:1;font-size:15px;line-height:1.36}
.ins .tx b{font-weight:600}
.aibox{font-size:15px;line-height:1.45;white-space:pre-wrap;padding:6px 0 10px}
.aibtn svg{width:17px;height:17px;fill:currentColor}
.aibtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;margin:4px 0 8px;border-radius:12px;background:var(--fill);font-weight:600;font-size:15px;color:var(--blue)}

/* buttons */
.btn{display:block;width:100%;text-align:center;background:var(--blue);color:#fff;font-weight:600;border-radius:13px;padding:14px;font-size:17px}
.btn.gray{background:var(--bg2);color:var(--blue)}
.btn.red{background:var(--bg2);color:var(--red)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:600px;margin:0 auto;background:var(--bg);border-radius:14px 14px 0 0;max-height:calc(100vh - var(--sat) - 30px);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
html[data-theme=light] .sheet{background:var(--bg)}
.sheet.on{transform:none}
.sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--bg4);margin:7px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;flex:none}
.sheet .sh b{font-size:17px}
.sheet .sh button{color:var(--blue);font-weight:600;font-size:17px}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(24px + var(--sab))}
.lbl{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;margin:22px 14px 7px}
.note{font-size:13px;color:var(--label2);margin:7px 14px 0;line-height:1.4}
.sel{background:none;border:0;color:var(--label2);font-size:16px;text-align:right;direction:rtl;outline:none;-webkit-appearance:none;appearance:none;max-width:60%}
.sel option{direction:ltr}
.tgl{position:relative;width:51px;height:31px;flex:none}
.tgl input{opacity:0;width:0;height:0;position:absolute}
.tgl i{position:absolute;inset:0;border-radius:16px;background:var(--bg4);transition:.2s}
.tgl i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:.2s}
.tgl input:checked+i{background:var(--green)}
.tgl input:checked+i::after{transform:translateX(20px)}
.tin{flex:1;background:none;border:0;outline:none;text-align:right;color:var(--label2);font-size:16px;min-width:0}

/* player sheet */
.phero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.phero h3{margin:12px 0 2px;font-size:24px;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border-radius:14px;margin-top:14px}
.stats div{padding:12px 6px;text-align:center}
.stats div+div{box-shadow:-.5px 0 0 var(--sep)}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats span{font-size:12px;color:var(--label2)}
.spark{display:flex;align-items:flex-end;gap:5px;height:90px;padding:12px 14px 8px}
.spark div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.spark i{display:block;width:100%;max-width:22px;border-radius:4px 4px 2px 2px;background:var(--blue);min-height:2px}
.spark span{font-size:10px;color:var(--label3)}

/* trades + news */
.trade{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 14px 12px}
.trade .side .who{font-size:12px;color:var(--label2);margin-bottom:4px}
.trade .side div{font-size:14px;font-weight:600;line-height:1.35}
.news{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;position:relative}
.news+.news::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.news .im{width:78px;height:58px;border-radius:9px;background:var(--bg3);flex:none;overflow:hidden}
.news .im img{width:100%;height:100%;object-fit:cover}
.news h4{margin:0;font-size:15px;line-height:1.3;font-weight:600}
.news p{margin:3px 0 0;font-size:12px;color:var(--label2)}

/* setup + toasts + loading */
.setup{min-height:86vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 4px}
.logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center}
.logo svg{width:40px;height:40px;fill:#fff}
.setup h1{margin:6px 0 0;font-size:34px;letter-spacing:-.025em}
.field{width:100%;background:var(--bg2);border:0;border-radius:12px;padding:15px;font-size:17px;outline:none}
.err{color:var(--red);font-size:14px;min-height:18px}
.toasts{position:fixed;top:calc(8px + var(--sat));left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--bg3);border-radius:999px;padding:6px 18px 6px 6px;box-shadow:0 12px 34px rgba(0,0,0,.35);animation:tin .4s cubic-bezier(.2,.9,.3,1.2),tout .4s ease 3.7s forwards;font-weight:600;font-size:15px}
.toast .hs{width:34px;height:34px}
.toast b{color:var(--green);font-size:17px;font-variant-numeric:tabular-nums}
.toast.plain{padding:11px 18px}
@keyframes tin{from{transform:translateY(-38px);opacity:0}}
@keyframes tout{to{transform:translateY(-36px);opacity:0}}
.loading{padding:90px 0;text-align:center;color:var(--label2)}
.spin{width:24px;height:24px;border:2.5px solid var(--bg4);border-top-color:var(--label2);border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* audible bot */
.abot{display:block;flex:none;overflow:visible}
.abot .b{transform-box:fill-box;transform-origin:center}
.abot .bd.hop{animation:abhop .85s cubic-bezier(.3,1.4,.5,1)}
.abot .bd.shake{animation:abshake .55s ease}
.abot .bd.sink{transform:translateY(4px);transition:transform .6s ease}
.abot .bd.tilt{transform:rotate(-6deg);transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.abot .bd.breathe{animation:abbreathe 3.2s ease-in-out infinite}
.abot .bd.popin{animation:abpop .55s cubic-bezier(.3,1.6,.5,1)}

.av.ring-b{box-shadow:0 0 0 2px var(--bg2),0 0 0 4.5px var(--blue)}
.brow:has(.ring-b){margin-top:8px}
.brow:has(.ring-a){margin-bottom:0}
.fld .los{background:#fff!important;box-shadow:0 0 4px rgba(0,0,0,.4)}
.fld .yl{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35)}
.fld .hash{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 1px,transparent 1px 2%)}
.fld .nums span{position:absolute;bottom:1px;transform:translateX(-50%);font-size:7px;font-weight:700;color:rgba(255,255,255,.55)}
.fld .los{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#4c8dff;transition:left .6s}
.fld .ball{position:absolute;top:50%;width:14px;height:9px;margin:-4.5px 0 0 -7px;border-radius:50%;background:#8a4b22;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.4);transition:left .6s}
.fld .ball::after{content:"";position:absolute;left:4px;right:4px;top:4px;height:1px;background:#fff}
.mp .g2{color:var(--label3)}.mp.live .g2{color:var(--green)}
.ndot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-left:5px;vertical-align:middle}
.news.pn h4{font-size:15px;color:var(--label);line-height:1.3}
button.news{width:100%;border:0;background:none;font:inherit;color:inherit;cursor:pointer}
.rimg{width:100%;border-radius:14px;display:block;margin-bottom:12px;aspect-ratio:16/9;object-fit:cover}
.rh{font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:0 2px}
.rbody p{font-size:17px;line-height:1.55;margin:0 2px 14px;color:var(--label)}
.stepn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:1px 12px 0 0}
.rback{border:0;background:none;color:var(--blue);font:inherit;font-size:16px;padding:4px 2px 12px;cursor:pointer}
/* ---- pages inside the sheet ----
   Tapping a player inside a game used to swap the sheet's contents in a single
   frame, and Done threw the whole thing away. The sheet is a small navigation
   stack now: the new page slides in over the old one, Back slides it off. */
.sheet .sh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:8px}
.sheet .sh b{max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.sheet .sh #shDone{justify-self:end}
.sheet .sh .shback{justify-self:start;display:inline-flex;align-items:center;gap:5px;margin-left:-4px;padding:4px 8px 4px 0;
  font-weight:400;opacity:0;pointer-events:none;transform:translateX(-8px);transition:opacity .22s ease,transform .34s var(--ios)}
.sheet .sh .shback.on{opacity:1;pointer-events:auto;transform:none}
.sheet .sh .shback:active{opacity:.45}
.sheet.nav{overflow:hidden;box-shadow:0 60vh 0 0 var(--bg)}
.sheet.nav .sb:not(.shghost){position:relative;z-index:2;background:var(--bg);box-shadow:-10px 0 28px rgba(0,0,0,.34)}
.sheet .sb.shghost{position:absolute;left:0;right:0;bottom:0;z-index:1;margin:0;overflow:hidden;pointer-events:none;background:var(--bg)}
.sheet.nav.back .sb:not(.shghost){z-index:1;box-shadow:none}
.sheet.nav.back .sb.shghost{z-index:2;box-shadow:-10px 0 28px rgba(0,0,0,.34)}
.news.pn .pd{font-size:13px;color:var(--label2);line-height:1.35;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.take p{font-size:15px;line-height:1.4;padding:7px 0}.take p+p{border-top:.5px solid var(--sep)}
.spark.log{overflow-x:auto;justify-content:flex-start;height:110px;scrollbar-width:none}
.spark.log div{flex:0 0 26px}
/* stop the page behind sheets and chat from scrolling */
#shBody,#chLog{overscroll-behavior:contain}
.scrim{touch-action:none}
.ln{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{font-size:12px;color:var(--label2);line-height:1.3}
/* clearer frosted glass, shared by every glass surface */
:root{--glass:rgba(30,30,34,.3);--frost:blur(12px) saturate(210%) brightness(1.06)}
html[data-theme=light]{--glass:rgba(255,255,255,.38)}
nav,.bar::before,.toast{backdrop-filter:var(--frost);-webkit-backdrop-filter:var(--frost)}
.bar::before{background:var(--glass)}
.toast{background:var(--glass)}
nav button{text-shadow:0 1px 6px rgba(0,0,0,.35)}
html[data-theme=light] nav button{text-shadow:0 1px 6px rgba(255,255,255,.6)}
/* hide initials behind player photos once the photo loads */
.hs.ok,.av.ok{color:transparent}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ===== 1.4: profile menu, leagues, pull to refresh, tour, Audible AI ===== */
.bar .wrap{gap:10px}
.pfb{width:38px;height:38px;border-radius:50%;flex:none;position:relative;overflow:hidden;background:var(--bg3);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--label2);box-shadow:0 0 0 .5px var(--sep);transition:transform .3s var(--soft)}
.pfb:active{transform:scale(.9)}
.pfb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pfsp{width:38px;flex:none}
.bar .mini{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pscrim{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s}
.pscrim.on{opacity:1;pointer-events:auto}
.pmenu{position:fixed;z-index:45;top:calc(var(--sat) + 52px);left:max(12px, calc(50% - 288px));width:min(300px,82vw);padding:8px;border-radius:24px;background:rgba(38,38,42,.74);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);box-shadow:inset 0 1px .5px rgba(255,255,255,.18),inset 0 0 0 .5px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.5);transform-origin:20px 0;transform:scale(.55);opacity:0;pointer-events:none;transition:transform .42s var(--soft),opacity .18s}
html[data-theme=light] .pmenu{background:rgba(252,252,253,.82);box-shadow:inset 0 1px .5px #fff,0 0 0 .5px rgba(0,0,0,.08),0 24px 60px rgba(0,0,0,.22)}
.pmenu.on{transform:none;opacity:1;pointer-events:auto}
.pmh{display:flex;align-items:center;gap:12px;padding:10px 10px 12px}
.pmh b{display:block;font-size:17px}.pmh span{display:block;font-size:13px;color:var(--label2);line-height:1.3}
.pmenu button{display:flex;align-items:center;gap:13px;width:100%;padding:12px 10px;border-radius:14px;font-size:17px;text-align:left;color:var(--label)}
.pmenu button:active{background:var(--fill);transform:none}
.pmenu button svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pmenu button span{flex:1}.pmenu button em{font-style:normal;font-size:14px;color:var(--label2)}
.pmenu hr{border:0;height:.5px;background:var(--sep);margin:4px 10px}
.ptr{position:fixed;z-index:25;top:calc(var(--sat) + 6px);left:50%;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:var(--bg3);box-shadow:0 4px 14px rgba(0,0,0,.3),0 0 0 .5px var(--sep);display:grid;place-items:center;opacity:0;pointer-events:none;transform:translateY(-20px)}
.ptr svg{width:18px;height:18px;fill:none;stroke:var(--label2);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ptr.armed svg{stroke:var(--blue)}
.ptr.spin{transition:transform .25s var(--ios)}.ptr.spin svg{animation:ptrs .7s linear infinite;stroke:var(--blue)}
@keyframes ptrs{to{transform:rotate(360deg)}}
.chk{width:20px;height:20px;flex:none;fill:none;stroke:var(--blue);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* welcome + league picker */
.wel .welbot{width:84px;height:84px}
.welpts{display:flex;flex-direction:column;gap:12px;margin:6px 0 4px}
.welpts div{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.35;color:var(--label2)}
.welpts b{color:var(--label)}
.welpts svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.stepl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.lgpick{display:flex;flex-direction:column;gap:10px}
.lgpick button{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--bg2);text-align:left;width:100%}
.lgpick b{display:block;font-size:17px}.lgpick span{font-size:13px;color:var(--label2)}
/* tour */
.tour{position:fixed;inset:0;z-index:70;display:none;touch-action:none}
.tour.on{display:block}
.tour .hole{position:absolute;border-radius:22px;box-shadow:0 0 0 200vmax rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.55);transition:all .45s var(--ios);pointer-events:none}
.tour .tip{position:absolute;left:max(14px, calc(50% - 210px));right:max(14px, calc(50% - 210px));padding:16px;border-radius:22px;background:var(--bg2);box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 .5px var(--sep);transition:top .45s var(--ios),opacity .25s}
.tour .th{display:flex;gap:12px;align-items:center}
.tour .th .tb{width:44px;height:44px;flex:none}
.tour .th b{font-size:19px;letter-spacing:-.01em}
.tour .tip p{font-size:16px;line-height:1.42;color:var(--label2);margin:10px 0 14px}
.tour .tf{display:flex;align-items:center;gap:10px}
.tour .dots{flex:1;display:flex;gap:6px}.tour .dots i{width:7px;height:7px;border-radius:50%;background:var(--bg4)}.tour .dots i.on{background:var(--blue)}
.tour .skip{color:var(--label2);font-size:16px;padding:10px 8px}
.tour .next{background:var(--blue);color:#fff;font-weight:600;font-size:16px;padding:10px 20px;border-radius:999px}
/* Audible AI */
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.plan{background:var(--bg2);border-radius:16px;padding:14px;position:relative;box-shadow:inset 0 0 0 .5px var(--sep)}
.plan.cur{box-shadow:inset 0 0 0 2px var(--blue)}
.plan.cur::after{content:"Your plan";position:absolute;top:-9px;right:12px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.plan b{display:block;font-size:18px}.plan>span{display:block;font-size:12px;color:var(--label2);margin:2px 0 8px;line-height:1.3;min-height:31px}
.plan ul{margin:0;padding:0;list-style:none}.plan li{font-size:13px;line-height:1.35;padding:3px 0 3px 16px;position:relative;color:var(--label)}
.plan li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.steps{display:flex;flex-direction:column;gap:16px;padding:16px 14px}
.stp{display:flex;gap:12px}
.stp>i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-style:normal;font-weight:700;font-size:14px;display:grid;place-items:center}
.stp b{font-size:16px}.stp p{font-size:14px;line-height:1.4;color:var(--label2);margin:3px 0 0}
.stp .btn{margin-top:10px;padding:10px;font-size:15px;background:var(--bg3);color:var(--blue)}
.stp input{width:100%;margin-top:10px;background:var(--bg3);border:0;border-radius:10px;padding:12px;font-size:16px;outline:none}
.sbar{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden;margin:10px 0 8px}.sbar i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.sbar.hot i{background:var(--orange)}
#shBody .seg{margin:4px 0 0}
.chin .effchip{width:auto!important;height:32px;padding:0 11px;border-radius:999px;background:var(--bg3);color:var(--blue);font-size:13px;font-weight:600;flex:none;align-self:flex-end;margin-left:-8px}
.chin{padding-left:12px}
.msg .stat{display:block;font-size:13px;color:var(--label2);margin-top:6px}

/* ============================================================
   iPad and Mac
   Everything below only applies from 760px wide. The phone app
   above this line is untouched.
   ============================================================ */
.navbrand,.navlg,.navask,.navsp{display:none}
kbd{font:600 11px/1 -apple-system,system-ui,sans-serif;color:var(--label2);background:var(--fill);border-radius:5px;padding:4px 6px;min-width:20px;display:inline-block;text-align:center}
@media (min-width:760px){
  :root{--side:88px;--panel:440px}
  html{scrollbar-gutter:stable}
  body{padding-left:var(--side);padding-bottom:48px;transition:padding-right .42s var(--ios)}
  .wrap{max-width:760px;padding:0 28px}
  #app{max-width:760px}
  .bar .wrap{max-width:760px}
  h1.lt{font-size:36px}

  /* ---- the tab bar becomes a rail ---- */
  nav{left:0;right:auto;top:0;bottom:0;width:var(--side);max-width:none;margin:0;border-radius:0;padding:calc(var(--sat) + 14px) 10px calc(72px + var(--sab));
    background:var(--bg2);backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:.5px 0 0 var(--sep);touch-action:auto;z-index:30}
  nav::before,nav::after{display:none!important}
  nav .wrap{display:flex;flex-direction:column;align-items:stretch;gap:4px;height:100%;max-width:none;padding:0}
  nav .tbub{display:none!important}
  nav button[data-tab]{flex:none;flex-direction:column;gap:3px;padding:9px 2px 8px;border-radius:12px;font-size:10px;text-shadow:none;transform:none!important;transition:background-color .18s,color .15s}
  nav button[data-tab].on{background:var(--fill);color:var(--blue)}
  nav button[data-tab] .badge{top:4px;right:calc(50% - 22px)}
  .navbrand{display:flex;justify-content:center;padding:2px 0 12px}
  .navbrand b{display:none}
  .navbrand .abot{width:38px;height:38px}
  .navsp{display:block;flex:1}
  nav .navlg,nav .navask{flex:none}
  .navask{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;border-radius:12px;font-size:10px;font-weight:600;color:var(--blue);background:rgba(10,132,255,.14);transition:background-color .18s}
  .navask svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .navask span{white-space:nowrap}.navask kbd{display:none}
  .navask.on{background:var(--blue);color:#fff}
  .fab{display:none!important}
  /* the profile button moves to the foot of the rail, and its menu opens upward */
  .bar{z-index:31;pointer-events:none}
  .bar .wrap>*{pointer-events:auto}
  .pfb{position:fixed;left:calc((var(--side) - 40px) / 2);bottom:calc(18px + var(--sab));width:40px;height:40px;z-index:32}
  .pmenu{top:auto;bottom:calc(68px + var(--sab));left:12px;transform-origin:0 100%}
  .bar .mini{padding-left:0}

  /* ---- content ---- */
  .rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;overflow:visible;margin:0;padding:0;scroll-snap-type:none}
  .game{width:auto}
  .chips{margin:0;padding-left:0;padding-right:0;flex-wrap:wrap;overflow:visible}
  .btns{max-width:420px}
  .dash.solo{max-width:760px}
  .toasts{left:var(--side)}
  .wkrow{justify-content:flex-start;gap:12px}
  .wkrow .wkmid{align-items:flex-start;order:0}
  .wkrow>button:last-child{order:1}

  /* ---- sheets become a panel on the right ---- */
  .sheet{left:auto;right:0;top:0;bottom:0;width:min(var(--panel),100vw - var(--side));max-width:none;max-height:none;height:100%;margin:0;border-radius:0;
    border-left:.5px solid var(--sep);transform:translateX(104%);box-shadow:none}
  .sheet.on{transform:none;box-shadow:-26px 0 70px rgba(0,0,0,.5)}
  .sheet::before{display:none}
  .sheet .sh{padding-top:calc(var(--sat) + 16px);padding-bottom:12px}
  .sheet.nav{box-shadow:-26px 0 70px rgba(0,0,0,.5)}
  .scrim{background:rgba(0,0,0,.3)}
  html.dock .sheet{right:var(--panel)}

  /* ---- chat is a panel too ---- */
  .chat{left:auto;right:0;width:min(var(--panel),100vw - var(--side));border-left:.5px solid var(--sep);transform:translateX(104%)}
  .chat.on{transform:none;box-shadow:-26px 0 70px rgba(0,0,0,.5)}
  .chat.on.cov{box-shadow:-26px 0 70px rgba(0,0,0,.5)}
  .chat .chd,.chlog,.chin{max-width:none}
  .chin{width:calc(100% - 24px)}
  .tour .tip{max-width:420px}
}
@media (min-width:1100px){
  :root{--side:236px;--panel:440px}
  #app,.bar .wrap,.wrap{max-width:1240px}
  .wrap{padding:0 36px}
  /* the rail opens into a sidebar with labels */
  nav{padding:calc(var(--sat) + 18px) 12px calc(74px + var(--sab))}
  nav button[data-tab]{flex-direction:row;justify-content:flex-start;gap:12px;padding:9px 12px;font-size:15px;font-weight:500;border-radius:10px;color:var(--label)}
  nav button[data-tab] svg{width:22px;height:22px;color:var(--label2)}
  nav button[data-tab].on{color:var(--label);font-weight:600}
  nav button[data-tab].on svg{color:var(--blue)}
  nav button[data-tab] .badge{position:static;margin-left:auto}
  .navbrand{justify-content:flex-start;align-items:center;gap:10px;padding:0 8px 14px}
  .navbrand b{display:block;font-size:19px;letter-spacing:-.02em}
  .navbrand .abot{width:32px;height:32px}
  .navlg{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;color:var(--label);padding:9px 12px;margin-bottom:10px;border-radius:10px;background:var(--fill);transition:background-color .18s}
  .navlg b{font-size:14px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navlg span{font-size:12px;color:var(--label2)}
  .navask{flex-direction:row;justify-content:flex-start;gap:10px;padding:10px 12px;font-size:15px;border-radius:10px}
  .navask kbd{display:inline-block;margin-left:auto;background:rgba(10,132,255,.2);color:var(--blue)}
  .navask.on kbd{background:rgba(255,255,255,.22);color:#fff}
  .pfb{left:16px}
  .pmenu{left:14px}

  /* two columns */
  .dash{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(320px,1fr);column-gap:36px;align-items:start}
  .dash>.dmain{grid-column:1;grid-row:1;min-width:0}
  .dash>.dside{grid-column:2;grid-row:1;min-width:0}
  .dash.solo{display:block;max-width:820px}
  .dash>.dside>.sec:first-child,.dash>.dmain>.sec:first-child{margin-top:14px}
  /* headers in the two columns sit on one line whatever controls they carry */
  .dash>div>.sec{min-height:32px;align-items:center}
  .dash .btns{max-width:none}
  .dash .btns .btn{width:100%}
  .dash>.dmain>.bot:first-child,.dash>.dmain>.bug:first-child{margin-top:14px}
  .rail{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .summ{max-width:none}

  /* the chat docks: the page makes room for it instead of being covered */
  @media (max-width:1559px){ html.dock .dash{display:block} html.dock .dash>.dmain,html.dock .dash>.dside{max-width:820px} }
  html.dock body{padding-right:var(--panel)}
  .chat{transition:transform .42s var(--ios)}
  .chat.on,.chat.on.cov{box-shadow:none}
}
/* a mouse gets hover states, a pointer cursor, and text it can select */
@media (hover:hover) and (pointer:fine){
  button,a,[data-p],[data-g],[data-team],[data-go],[data-art],[data-play],.play,.chip{cursor:pointer}
  button.cell:hover,.cell[data-p]:hover,.cell[data-team]:hover,.trow:hover,a.news:hover,button.news:hover,.play:hover,.mp[data-p]:hover,.ins:hover{background-color:var(--bg3)}
  .game:hover,.bug[data-go]:hover{filter:brightness(1.14)}
  .btn:hover,.aibtn:hover,.navask:hover{filter:brightness(1.12)}
  nav button[data-tab]:hover,.navlg:hover{background-color:var(--bg3)}
  .pmenu button:hover{background:var(--fill)}
  .chip:hover,.seg button:hover,.wkpick button:hover{filter:brightness(1.2)}
  .sheet .sh button:hover,.chbtn:hover,.sec button:hover,.sec a:hover{opacity:.7}
  .pfb:hover{box-shadow:0 0 0 2px var(--blue)}
  .msg,.reader,.note,.rbody{-webkit-user-select:text;user-select:text;cursor:auto}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:rgba(128,128,128,.34);border-radius:6px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background-color:rgba(128,128,128,.6)}
  ::-webkit-scrollbar-track{background:transparent}
}
</style>

<body>
<header class="bar" id="bar" style="display:none"><div class="wrap">
  <button class="pfb" id="pfBtn" aria-label="Profile and menu"></button>
  <span class="mini" id="miniTitle"></span>
  <span class="pfsp"></span>
</div></header>

<main class="wrap" id="app"></main>

<div id="boot">

(function(){

const BOT_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9zM19 15l.9 2.6 2.6.9-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9z"/></svg>';
const DEF_SET = {theme:"system", refresh:30, celebrate:true, showBench:true, botName:"Audible", apiKey:"", model:"claude-haiku-5-5", effort:"auto", length:"standard", aiLimit:3, deepWeb:true};

  timer:null, updated:null, chat:[], chatBusy:false, wstats:null, wsT:0, wsW:0, sheetPid:null, sheetGid:null, sum:{}, set:{...DEF_SET}
};

const VERSION = "1.9.3";
const RELEASES = [
  {v:"1.9.3", date:"Nov 15, 2026", title:"Tidier iPad and Mac details", items:[
    ["Edit lineup button matches the starters","On a big screen it sits under your starters and is the same width as the list."],
    ["Week arrows sit next to the week","On iPad and Mac they hug the label instead of stretching across the page."]]},
  {v:"1.9.2", date:"Nov 15, 2026", title:"Cleaner big screens, clearer weeks", items:[
    ["You can always tell which week you're on","Every week picker now says Live, This week, Final or Upcoming, and if you've moved off the current week there's a link straight back."],
    ["Standings and Scores line up","On iPad and Mac the week picker moved into the Scores heading, so both lists start level."],
    ["Columns end closer together","League activity sits under your matchup on Today, and the League tab shows the latest six moves with a Show all."]]},
  {v:"1.9.1", date:"Nov 15, 2026", title:"Only players who can play count", items:[
    ["Game cards count who's actually playing","A player who's Out or on IR no longer adds to the blue \"of your players\" line on a game."],
    ["On the field shows your whole roster","Bench players in a live game now show up there too, marked BN, under your starters. Anyone ruled out is left off."]]},
  {v:"1.9", date:"Nov 15, 2026", title:"Audible for iPad and Mac", items:[
    ["A real layout for big screens","Open the same link on an iPad or a Mac. The tab bar becomes a sidebar, and each screen spreads into two columns: your briefing beside the NFL slate, starters beside the bench, standings beside scores and activity."],
    ["Players and games open beside what you were looking at","On a big screen they slide in as a panel on the right instead of covering everything."],
    ["Audible docks next to the app","On a Mac or a landscape iPad the chat sits beside the app and both stay usable, so you can ask about a player while you're looking at him."],
    ["Keyboard shortcuts","1 to 5 switch sections, Command-K opens Audible, slash searches players, the bracket keys change weeks, R refreshes, Escape goes back. Press ? for the list. Return sends a message."],
    ["Made for a mouse too","Hover states, a pointer cursor, and chat text you can select and copy."],
    ["How to install","iPad: Share, then Add to Home Screen. Mac: in Safari choose File, then Add to Dock. Turn on Backup first and everything comes across with your PIN."]]},
  {v:"1.8.1", date:"Nov 15, 2026", title:"Chat header, rebuilt so it can't go missing", items:[
    ["Done and Clear are part of the chat itself","They were a separate layer that the keyboard could slide away from the rest. They're now the top row of the chat, so they go wherever it goes."],
    ["The page behind is pinned","iPhone can no longer scroll the screen underneath the chat when the keyboard opens."],
    ["No more see-through strip above the keyboard","The new glass keyboard showed whatever the chat didn't cover. The chat now paints past its own edges."],
    ["Settings shows your version","If you're ever unsure an update landed, it's at the bottom of Settings."]]},
  {v:"1.8", date:"Nov 15, 2026", title:"The blur, found. Plus a rebuilt field.", items:[
    ["The blur at the top was never Audible","Since iOS 26.1, iPhone lays its own blur and dark strip over the top of any Home Screen app added with a see-through status bar, and an app can't switch it off. Audible now asks for a solid status bar instead. iPhone only reads that when the icon is added, so it needs one remove and re-add: Settings, About, Sharpen the top bar walks you through it. Turn on Backup first."],
    ["Done and Clear stay put in chat","When the keyboard opened, iPhone slid the screen and the chat header stayed behind, under the clock or off screen. It moves with the chat now."],
    ["Pages slide inside a sheet","Tap a player inside a game and he slides in over it. Back, or a swipe from the left edge, returns you to the game. Done still closes everything."],
    ["Faster in the morning","The 5MB player list used to re-download in front of the splash once a day. Now yesterday's copy gets you in and today's loads quietly afterwards. Everything else is requested at once instead of one after another."],
    ["He keeps working while you wait","If a launch runs long, Audible scans and blinks, his headset light pulses, and a bar tracks the real steps."],
    ["A new field","Mowed stripes, hash marks, pylons, yard numbers painted in perspective with the line running between the digits, team names in the endzones, and a field that finally fills its card."],
    ["Plays look like the play","Passes go to the side they were thrown, get caught, then run. The ball has a shadow that stays on the turf. The gain is painted on the field in team color."],
    ["Every outcome has a moment","Field goals split the uprights and the posts light up. Misses sail wide, fall short, or get blocked. Interceptions, fumbles, sacks, punts and incompletions each play out, and first downs get called."],
    ["A new touchdown graphic","Team color, speed stripes, the word, the team and the clock."],
    ["Long questions get answered","If an answer ran out of room, Audible now tries again with far more instead of giving up."]]},
  {v:"1.7.2", date:"Nov 14, 2026", title:"Endzone type and posts, measured", items:[
    ["Endzone lettering sits square","No more lean, and each end reads toward its own endline."],
    ["Goalposts stand straight","Plumb uprights, drawn as round pipe."]]},
  {v:"1.7.1", date:"Nov 14, 2026", title:"Endzones and goalposts, properly", items:[
    ["Endzone names fill the endzone","Sized and stretched to the space and laid into the plane of the field, instead of small type standing upright."],
    ["Goalposts in three dimensions","A grey weighted base, a gooseneck carrying the uprights out over the endline, and one upright a touch taller because you are seeing them at an angle."],
    ["The field has thickness","A front edge along the near sideline, tinted to each team in their endzone, so it reads as a slab rather than a sticker."],
    ["Fixed a stuck banner","Tapping another play while the touchdown graphic was still up left it on screen."]]},
  {v:"1.7", date:"Nov 14, 2026", title:"Touchdown graphic", items:[
    ["A proper celebration","Score, and the card goes over to a banner in your team's colour with TOUCHDOWN spread across it and the team's abbreviation ghosted behind, then hands back to the field for the next play."],
    ["Endzone names lie on the grass","They were standing bolt upright. Now they lean with the endzone the way painted lettering actually does."]]},
  {v:"1.6.2", date:"Nov 14, 2026", title:"The field has the right shape", items:[
    ["Not stretched any more","The first 3D field was tilted far too hard, so it looked impossibly deep and the goalposts ended up somewhere near the 10. Measured against ESPN's own drive graphic and rebuilt to match: a shallow strip with a gentle lean."],
    ["Posts where they belong","Standing beyond the back of each endzone, tall and thin, instead of planted on the goal line."],
    ["Team names back in the endzones","Turned on their side so they fit the narrow endzone, the way a real field is painted."]]},
  {v:"1.6.1", date:"Nov 14, 2026", title:"Field goals actually kick", items:[
    ["The kick flies at the uprights","A field goal started and ended on the same yard line, so replaying one did nothing at all. Now the ball sails downfield, climbs, and finishes up at the crossbar with the distance called out."]]},
  {v:"1.6", date:"Nov 14, 2026", title:"The field in 3D", items:[
    ["A real camera angle","The field is drawn in perspective now, like a broadcast shot from the sideline, instead of a flat diagram from above. Yard lines converge, the far side sits further away, and the numbers shrink with distance."],
    ["Goalposts","Standing at the back of each endzone, planted with a shadow, sized to how far away they are."],
    ["Plays travel through it","The ball follows the ground as it slopes away, gets smaller downfield and bigger as it comes toward you. The line of scrimmage and the first-down marker lie flat on the grass instead of standing up as bars."]]},
  {v:"1.5.2", date:"Nov 14, 2026", title:"Two fixes", items:[
    ["No stale colour band","Switching between light and dark could leave a stripe of the old background frozen across a player card. Everything repaints properly now."],
    ["The pass stays on screen","Deep passes arced so high the ball left the top of the field. The arc is capped."]]},
  {v:"1.5.1", date:"Nov 14, 2026", title:"The tour lets you touch things", items:[
    ["Tap the thing I'm pointing at","The tour used to block the whole screen while describing a feature. Now the highlighted control is live. Tap it, it really works, and that is what moves the tour along. Everything else stays locked so you can't get lost."],
    ["Open a player and have a look","Tap a player during the tour and his card opens for real. I get out of the way while you poke around, and pick up again when you close it."],
    ["See a touchdown, don't read about one","There's a stop that plays a real touchdown on the field, so you see the replay instead of being told about it. It works in the off-season and at 4am."]]},
  {v:"1.5", date:"Nov 14, 2026", title:"Big plays", items:[
    ["Plays are ranked, not just flagged","A touchdown, a 44-yard run and a 21-yard catch used to look identical. Now there are tiers: TD, Explosive, Big play, INT, Fumble, Safety, long field goals and big sacks, each with its own colour and weight."],
    ["Touchdowns get a moment","Replay a score and the ball runs longer, arcs higher, the endzone lights up, and Audible reacts. A checkdown still replays like a checkdown."],
    ["Big plays on every NFL game","Game cards showed scoring plays only, so a 50-yard catch that set up a score was invisible. There's a Big plays section now, and every play in it replays on the field."],
    ["Know who did something at a glance","Players on My Team and Matchup now carry a TD, FG or turnover marker on their row, so you can see who produced without opening each one."]]},
  {v:"1.4.9", date:"Nov 14, 2026", title:"Smooth all the way up", items:[
    ["No more catch at the top","Player cards, team cards and game cards slide up and then caught for a split second right before they landed. Stats, news and the game log were arriving mid-slide and rebuilding the card while it moved. Nothing rebuilds until it has parked."]]},
  {v:"1.4.8", date:"Nov 14, 2026", title:"Updates in one open, and a ready first run", items:[
    ["Updates arrive on the next open","You no longer have to open Audible twice to get a new version. While the launch animation plays, he checks for a newer build and switches to it before you ever see the app."],
    ["Everything is loaded before you land","The first launch now spends the animation pulling down the photos your first few screens need, so you never meet a page of empty circles. It costs about a second, once."]]},
  {v:"1.4.7", date:"Nov 14, 2026", title:"Photos stop flashing", items:[
    ["Player photos are kept on your phone","Headshots and team logos were refetched from Sleeper every time a screen redrew, and iPhone throws away image data when you leave the app. That is why everything went blank coming back from the Home Screen. They are stored on your phone now and never download twice."],
    ["No more empty circles","A photo that had not loaded yet hid the player's initials, so you got an empty grey circle instead. Initials stay until the photo is actually ready."],
    ["Player cards build once","Opening a player rebuilt the whole card three separate times as stats, news and the game log arrived, recreating every image each time. It builds once now."]]},
  {v:"1.4.6", date:"Nov 14, 2026", title:"The chat header is sharp", items:[
    ["Fixed for real this time","Measured on a screenshot: header text was five times blurrier than body text on the same screen. The chat panel slides up using the graphics chip, which bakes everything inside it at a fixed resolution. The log kept repainting as you scroll so it stayed sharp, but the header never moved. It now sits outside the sliding panel."]]},
  {v:"1.4.5", date:"Nov 14, 2026", title:"Nothing blurry at the top", items:[
    ["Top of the screen is sharp","The header, your profile picture and the chat title were being drawn into a separate layer that iPhone renders at lower resolution. Every filter and layer trick at the top of the screen is gone. The bar is a solid colour now instead of frosted glass."]]},
  {v:"1.4.4", date:"Nov 14, 2026", title:"No more blink on open", items:[
    ["The screen stops blinking","Today was appearing, going dark, then fading back in. Two separate fades were running at the handoff and the second one landed late. There is only one now."]]},
  {v:"1.4.3", date:"Nov 14, 2026", title:"One clean entrance", items:[
    ["No more double image on open","The launch screen was a picture of Audible and the app then drew its own. Any mismatch between the two showed as a second head flickering. The launch screen is now plain, and he fades in as the animation's first beat."],
    ["Animation waits its turn","It used to start while the app was still loading, so it ran blind and then jumped. It now begins on a frame where the app is actually ready."]]},
  {v:"1.4.2", date:"Nov 14, 2026", title:"Opens in a blink", items:[
    ["Much faster launch","Audible now keeps itself on your phone instead of downloading on every open. The launch image used to sit frozen for nearly two seconds waiting on the network. It does not any more."],
    ["Works with no signal","The app opens offline. Scores still need a connection, but it will not sit on a blank screen."],
    ["Update notice","When a new version lands you get a tap-to-reload banner, rather than quietly staying on the old one."],
    ["Sharper chat header","Done, Audible and Clear were being softened by a blur layer sitting behind them. It is switched off while the chat is open."]]},
  {v:"1.4.1", date:"Nov 14, 2026", title:"A new look, and a proper entrance", items:[
    ["Redesigned Audible","A graphite helmet and a lit visor instead of the old white dome. Sharper at every size, and the same face now runs through the app, the icon and your Home Screen."],
    ["Launch animation","Open the app and the headset builds itself on the way down, slams on, and he powers up. The launch image is the first frame, so there is no jump."],
    ["Crisper top of screen","The blur behind the header only exists once the header is actually showing, so your profile picture stays sharp."],
    ["Swipe a message away","Tap or flick a banner upward to dismiss it instead of waiting it out."],
    ["He reacts to good news","Big plays, taking the lead, pulling away, and winning your week. A passing touchdown counts now too."],
    ["Always opens to Today","The start screen setting is gone."]]},
  {v:"1.4", date:"Nov 14, 2026", title:"Made to share", items:[
    ["A proper launch","Tapping the icon shows Audible instantly on a dark screen instead of a white flash, then fades straight into your league."],
    ["Sharper icon","The Home Screen icon got depth, a glow and cleaner lines so it reads well at any size."],
    ["Your menu","Tap your picture in the top left to switch leagues, refresh, open settings, or set up Audible AI."],
    ["League switcher","In more than one league? See them all with your record in each, and switch with one tap."],
    ["Pull to refresh","Pull down on any screen to update scores."],
    ["Guided tour","New here? Audible walks you through the app. Replay it anytime from the menu."],

const PRE = new Map();

}

/* The launch animation runs for two seconds whatever we do. Spend it pulling

function criticalImgs(){

    [me, op].forEach(m => (m ? (m.players || m.starters || []) : []).forEach(id => {

function prewarm(list, ms){
  if(!list.length) return Promise.resolve();

    const t = setTimeout(done, ms || 2600);                 /* never hold the app hostage */
    list.forEach(src => {

  if(any) return Math.round(t*100)/100;
  const rec = ss.rec || 0, k = rec >= 1 ? "pts_ppr" : rec >= .5 ? "pts_half_ppr" : "pts_std";

function gameFrac(p){

/* =============== projections & win probability =============== */
function teamOutlook(m){
  if(!m) return null;
  let cur = m.points || 0, rem = 0, v = 0, left = 0;
  (m.starters || []).forEach((id, i) => {
    if(!id || id === "0") return;
    const p = P(id), pr = proj(id) || 0, act = (m.starters_points||[])[i] || 0, f = gameFrac(p);
    if(f >= 1) return;
    const r = Math.max(0, pr * (1 - f));
    if(f === 0 || pr > act) { rem += f === 0 ? pr : Math.max(0, pr - act) * (1 - f) + 0; }
    v += Math.pow(Math.max(2, r) * .55, 2); left++;
  });
  return {cur, proj:cur + rem, sd:Math.sqrt(v), left};
}
function winProb(a, b){
  if(!a || !b) return null;
  const sd = Math.sqrt(a.sd*a.sd + b.sd*b.sd);
  if(sd < .01) return a.proj > b.proj ? 1 : a.proj < b.proj ? 0 : .5;
  const z = (a.proj - b.proj) / sd;
  return 1 / (1 + Math.exp(-1.702 * z));
}
const hasProj = () => Object.keys(S.proj).length > 20;

const BAD = new Set(["Out","IR","PUP","Sus","NA","DNR","COV","Doubtful"]);
/* ruled out of this week: can't score, so they don't count as "playing" anywhere.
   Doubtful and Questionable players still might go, so they stay in. */
const OUTS = new Set(["Out","IR","PUP","Sus","NA","DNR","COV"]);
function sidelined(p){
  if(!p || p.empty) return true;
  if(OUTS.has(p.inj)) return true;
  const r = S.rosters && S.rosters.find(x => x.roster_id === S.myRid);
  return !!(r && (r.reserve || []).includes(p.id));
}
function benchOf(rid){
  const r = S.rosters.find(x => x.roster_id === rid), m = mOf(rid);
  if(!r) return [];
  const st = new Set((m && m.starters) || r.starters || []), res = new Set([...(r.reserve||[]), ...(r.taxi||[])]);
  return (r.players||[]).filter(id => !st.has(id) && !res.has(id)).map(P);
}
const val = id => proj(id) != null ? proj(id) : (ppg(id) || 0);
function lineupIssues(){
  const me = mOf(S.myRid); if(!me || !isCur()) return [];
  const st = me.starters || [], bench = benchOf(S.myRid);
  const ok = b => b.team && (!b.inj || b.inj === "Questionable") && !isBye(b) && gState(b) === "pre";
  const out = [];
  slots().forEach((slot, i) => {
    const p = P(st[i]);
    if(!p.empty && gState(p) !== "pre") return; // locked
    let level = null, why = "";
    if(p.empty){ level = "bad"; why = "Empty slot"; }
    else if(isBye(p)){ level = "bad"; why = "On bye this week"; }
    else if(!p.team && p.pos !== "DEF"){ level = "bad"; why = "Not on an NFL team"; }
    else if(BAD.has(p.inj)){ level = "bad"; why = p.inj === "Doubtful" ? "Doubtful to play" : "Listed " + p.inj; }
    else if(p.inj === "Questionable"){ level = "warn"; why = "Questionable"; }
    const subs = bench.filter(b => canPlay(b, slot) && ok(b)).map(b => ({p:b, v:val(b.id)})).sort((a,b) => b.v - a.v);
    if(level){ out.push({slot, p, level, why, subs:subs.slice(0,3)}); return; }
    const mine = val(p.id), best = subs[0];
    const gap = hasProj() ? 2.5 : 3.5;
    if(best && mine > 0 && best.v - mine >= gap) out.push({slot, p, level:"tip", why:`${f1(mine)} ${hasProj()?"proj":"ppg"}`, subs:[best]});
  });
  return out;
}
function insights(){
  const out = [], me = mOf(S.myRid), op = oppOf(me);
  if(!S.myRid) return out;
  const issues = lineupIssues();
  issues.filter(x => x.level === "bad").forEach(x => {
    const s = x.subs[0];
    out.push({tone:"bad", go:"matchup", html: x.p.empty
      ? `Your <b>${SLBL[x.slot]||x.slot}</b> slot is empty.${s ? ` Start <b>${esc(s.p.name)}</b>.` : " Grab someone off waivers."}`
      : `<b>${esc(x.p.name)}</b> is ${x.why.toLowerCase()}.${s ? ` Swap in <b>${esc(s.p.name)}</b>${proj(s.p.id)!=null?` (${f1(proj(s.p.id))} proj)`:""}.` : " Nobody on your bench fits, so check waivers."}`});
  });
  issues.filter(x => x.level === "warn").forEach(x => {
    const g = gameFor(x.p.team);
    out.push({tone:"warn", go:"matchup", html:`<b>${esc(x.p.name)}</b> is questionable${g && g.state==="pre" ? ` for ${day(g.date)} ${tm(g.date)}` : ""}. Check the news before kickoff${x.subs[0] ? `. <b>${esc(x.subs[0].p.name)}</b> is your backup` : ""}.`});
  });

    const s = x.subs[0];
    out.push({tone:"info", go:"matchup", html:`Start/sit: <b>${esc(s.p.name)}</b> (${f1(s.v)}) ${hasProj()?"projects":"is averaging"} more than <b>${esc(x.p.name)}</b> (${x.why}) at ${SLBL[x.slot]||x.slot}.`});
  });
  if(!issues.some(x => x.level !== "tip") && isCur() && me) out.push({tone:"good", go:"matchup", html:"Your lineup is clean. No byes, empty slots, or injured starters."});
  if(me && op && hasProj()){
    const a = teamOutlook(me), b = teamOutlook(op), wp = winProb(a, b), T = team(op.roster_id);
    if(wp != null) out.push({tone: wp >= .5 ? "good" : "warn", go:"matchup", html:`You're projected <b>${f1(a.proj)}</b> to ${f1(b.proj)} against ${esc(T.name)}. That's a <b>${pct(wp)}</b> chance to win.`});
    const oppHurt = (op.starters||[]).map(P).filter(p => !p.empty && (BAD.has(p.inj) || isBye(p)));
    if(oppHurt.length) out.push({tone:"info", go:"matchup", html:`${esc(T.handle || T.name)} is starting <b>${esc(oppHurt[0].name)}</b>, who's ${isBye(oppHurt[0]) ? "on bye" : oppHurt[0].inj.toLowerCase()}. That's free points for you if they don't notice.`});
  }
  const fa = bestAvailable(), need = needs();
  if(fa.length){

    out.push({tone:"info", go:"players", html:`Top pickup: <b>${esc(pick.p.name)}</b> (${pick.p.pos}, ${pick.p.team})${pick.adds ? `, added in ${kfmt(pick.adds)} leagues today` : ""}${need.has(pick.p.pos) ? ". Fills a hole for you" : ""}.`});
  }
  const trades = (S.tx||[]).filter(t => t.type === "trade");
  if(trades.length){
    const t = trades[0], names = (t.roster_ids||[]).map(r => team(r).handle || team(r).name).join(" and ");
    out.push({tone:"info", go:"league", html:`League news: <b>${esc(names)}</b> made a trade ${ago(t.status_updated||t.created)}.`});
  }

  }
  return out;
}
const ordinal = n => n + (["th","st","nd","rd"][((n%100)-20)%10] || ["th","st","nd","rd"][n%100] || "th");
function needs(){
